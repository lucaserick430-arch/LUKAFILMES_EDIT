
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LUKAFILMES - Série</title>

    <link rel="stylesheet" href="../css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .pagina-serie {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            padding-bottom: 80px;
            background: #050505;
        }

        /* ==========================================
           FUNDO
           ========================================== */

        .pagina-serie::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 780px;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(5, 5, 5, .15),
                    rgba(5, 5, 5, .30) 35%,
                    rgba(5, 5, 5, .65) 65%,
                    #050505 100%
                ),
                var(--fundo-serie);

            background-size: cover;

            background-position: center top;

            filter: blur(2px);

            transform: scale(1.03);

            opacity: .9;

            z-index: 0;
        }

        .pagina-serie::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 25%,
                    rgba(5, 5, 5, .25) 45%,
                    #050505 78%
                );

            z-index: 0;

            pointer-events: none;
        }


        /* ==========================================
           VOLTAR
           ========================================== */

        .voltar-area {

            position: relative;

            z-index: 5;

            max-width: 1200px;

            margin: auto;

            padding: 25px;
        }

        .voltar {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 11px 18px;

            color: #fff;

            text-decoration: none;

            background: rgba(0, 0, 0, .55);

            border: 1px solid rgba(255, 255, 255, .14);

            border-radius: 30px;

            backdrop-filter: blur(12px);

            font-weight: bold;

            transition: .25s;
        }

        .voltar:hover {

            background: #e50914;

            border-color: #e50914;

            transform: translateX(-3px);
        }


        /* ==========================================
           DETALHES
           ========================================== */

        .detalhes-serie {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1000px;

            margin: 40px auto 0;

            padding: 0 20px;

            text-align: center;
        }


        /* ==========================================
           CAPA
           ========================================== */

        .poster-serie {

            width: 270px;

            margin: 0 auto 25px;
        }

        .poster-serie img {

            width: 100%;

            display: block;

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, .18);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .9);
        }


        /* ==========================================
           TITULO
           ========================================== */

        #tituloSerie {

            margin: 0 0 15px;

            font-size: clamp(34px, 5vw, 58px);

            line-height: 1.05;

            font-weight: 900;

            text-shadow:
                0 8px 35px rgba(0, 0, 0, .95);
        }

        .dados-serie {

            color: #ddd;

            font-size: 15px;

            margin-bottom: 18px;
        }


        /* ==========================================
           SINOPSE
           ========================================== */

        .sinopse-box {

            width: 100%;

            max-width: 850px;

            margin: 25px auto 0;

            padding: 30px 35px;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 20px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55);
        }

        .sinopse-box h2 {

            margin: 0 0 15px;

            font-size: 22px;
        }

        .sinopse {

            margin: 0;

            color: #d1d1d1;

            font-size: 16px;

            line-height: 1.8;
        }


        /* ==========================================
           TEMPORADAS
           ========================================== */

        .temporadas {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);
        }

        .temporadas h2 {

            margin: 0 0 20px;

            font-size: 26px;
        }

        #selectTemporada {

            width: 100%;

            padding: 14px 16px;

            color: #fff;

            background: #151515;

            border: 1px solid rgba(255, 255, 255, .15);

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            cursor: pointer;
        }


        /* ==========================================
           EPISODIOS
           ========================================== */

        .episodios {

            margin-top: 25px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 14px;
        }

        .episodio {

    position: relative;

    padding: 20px 17px;

    text-align: center;

    color: #fff;

    background: rgba(0, 0, 0, .18);

    border: 1px solid rgba(255, 255, 255, .08);

    border-radius: 14px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    font-family: inherit;

    min-height: 145px;

    backdrop-filter: blur(4px);

    -webkit-backdrop-filter: blur(4px);
}

.episodio span {

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.episodio:hover {

    background: rgba(229, 9, 20, .18);

    border-color: rgba(229, 9, 20, .65);

    transform: translateY(-4px);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, .35);
}

.episodio:hover span {

    background: rgba(229, 9, 20, .9) !important;

    transform: scale(1.08);

    box-shadow:
        0 0 20px rgba(229, 9, 20, .35);
}

.episodio strong {

    display: block;

    margin-bottom: 6px;

    color: #fff;

    font-weight: 700;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, .8);
}

.episodio small {

    display: block;

    color: rgba(255, 255, 255, .58);

    line-height: 1.4;

    transition: color .25s ease;
}

.episodio:hover small {

    color: rgba(255, 255, 255, .9);
}
/* ==========================================
           PLAYER
           ========================================== */

        .player-serie {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);

            backdrop-filter: blur(16px);
        }

        .player-serie h2 {

            margin: 0 0 22px;

            font-size: 26px;
        }

        .player-video {

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #000;

            border-radius: 15px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .7);
        }

        .player-video iframe {

            width: 100%;

            height: 100%;

            border: 0;

            display: block;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 700px) {

            .voltar-area {

                padding: 18px 15px 0;
            }

            .detalhes-serie {

                margin-top: 35px;

                padding: 0 15px;
            }

            .poster-serie {

                width: 205px;
            }

            .sinopse-box {

                padding: 22px 20px;
            }

            .temporadas,
            .player-serie {

                width: calc(100% - 24px);

                padding: 18px 14px;

                border-radius: 17px;
            }

            .episodios {

                grid-template-columns: 1fr;
            }

            #tituloSerie {

                font-size: 36px;
            }

        }

    </style>

</head>


<body>

<div class="pagina-serie">

    <!-- ==========================================
         VOLTAR
         ========================================== -->

    <div class="voltar-area">

        <a href="series.html" class="voltar">
            ← Voltar para séries
        </a>

    </div>


    <!-- ==========================================
         DETALHES DA SÉRIE
         ========================================== -->

    <main class="detalhes-serie">

        <div class="poster-serie">

            <img
                id="posterSerie"
                src=""
                alt="Capa da série"
            >

        </div>


        <h1 id="tituloSerie">
            Carregando...
        </h1>


        <div
            id="dadosSerie"
            class="dados-serie">
        </div>


        <div class="sinopse-box">

            <h2>
                📝 Sinopse
            </h2>

            <p
                id="sinopseSerie"
                class="sinopse">
                Carregando sinopse...
            </p>

        </div>

    </main>


    <!-- ==========================================
         TEMPORADAS
         ========================================== -->

    <section class="temporadas">

        <h2>
            📚 Temporadas e episódios
        </h2>

        <select id="selectTemporada"></select>

        <div
            id="episodios"
            class="episodios">

            <div class="episodio">
                🔄 Carregando episódios...
            </div>

        </div>

    </section>


    <!-- ==========================================
         PLAYER
         ========================================== -->

    <section
        id="playerSerie"
        class="player-serie"
        style="display: none;"
    >

        <h2 id="tituloPlayer">
            🎬 Assistindo
        </h2>

        <div class="player-video">

            <iframe
                id="serieFrame"
                src=""
                title="Player da série"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen>
            </iframe>

        </div>

    </section>

</div>


<script>

(function () {

    "use strict";


    console.log("[LUKAFILMES] Iniciando carregamento da série...");


    /* ==========================================
       RECUPERAR SÉRIE
       ========================================== */

    const salvo = localStorage.getItem("serieSelecionada");


    if (!salvo) {

        document.getElementById("tituloSerie").textContent =
            "Série não encontrada";

        document.getElementById("sinopseSerie").textContent =
            "Nenhuma série foi selecionada.";

        return;
    }


    let serie;


    try {

        serie = JSON.parse(salvo);

        }

    } catch (erro) {

        console.error(
            "[SERIES] Erro ao ler série:",
            erro
        );

        document.getElementById("tituloSerie").textContent =
            "Erro ao carregar série";

        return;
    }


    console.log(
        "[SERIES] Série selecionada:",
        serie
    );


    /* ==========================================
       ELEMENTOS
       ========================================== */

    const tituloElemento =
        document.getElementById("tituloSerie");

    const posterElemento =
        document.getElementById("posterSerie");

    const sinopseElemento =
        document.getElementById("sinopseSerie");

    const dadosElemento =
        document.getElementById("dadosSerie");

    const select =
        document.getElementById("selectTemporada");

    const listaEpisodios =
        document.getElementById("episodios");

    const player =
        document.getElementById("playerSerie");

    const frame =
        document.getElementById("serieFrame");

    const tituloPlayer =
        document.getElementById("tituloPlayer");


    /* ==========================================
       DADOS BÁSICOS
       ========================================== */

    const titulo =
        serie.titulo ||
        serie.name ||
        serie.original_name ||
        "Sem título";


    document.title =
        "LUKAFILMES - " + titulo;


    tituloElemento.textContent =
        titulo;


    /* ==========================================
       CAPA
       ========================================== */

    let poster = "";


    if (serie.capa) {

        poster = serie.capa;

    } else if (serie.poster_path) {

        poster =
            "https://image.tmdb.org/t/p/w500" +
            serie.poster_path;

    }


    if (poster) {

        posterElemento.src = poster;

    } else {

        posterElemento.style.display = "none";

    }


    /* ==========================================
       SINOPSE
       ========================================== */

    sinopseElemento.textContent =
        serie.sinopse ||
        serie.overview ||
        "Sinopse não disponível.";


    /* ==========================================
       ANO
       ========================================== */

    const ano =
        serie.ano ||
        (
            serie.first_air_date
                ? serie.first_air_date.substring(0, 4)
                : ""
        );


    /* ==========================================
       NOTA
       ========================================== */

    const valorNota =
        serie.nota ??
        serie.vote_average ??
        0;


    const nota =
        Number(valorNota || 0).toFixed(1);


    dadosElemento.textContent =
        "⭐ " +
        nota +
        (
            ano
                ? " • " + ano
                : ""
        );


    /* ==========================================
       FUNDO
       ========================================== */

    let fundo = "";


    if (serie.fundo) {

        fundo = serie.fundo;

    } else if (serie.backdrop_path) {

        fundo =
            "https://image.tmdb.org/t/p/w1280" +
            serie.backdrop_path;

    }


    if (fundo) {

        document.documentElement.style.setProperty(
            "--fundo-serie",
            'url("' + fundo + '")'
        );

    }


    /* ==========================================
       VARIÁVEIS
       ========================================== */

    let temporadas = [];


    /* ==========================================
       CARREGAR DETALHES DA SÉRIE
       ========================================== */

    async function carregarDetalhes() {

        console.log(
            "[SERIES] ID da série:",
            serie.id
        );


        if (!serie.id) {

            console.error(
                "[SERIES] ID da série não encontrado."
            );

            listaEpisodios.innerHTML = `
                <div class="episodio">
                    ❌ ID da série não encontrado.
                </div>
            `;

            return;
        }


        try {

            const url =
                "/api/serie/" +
                encodeURIComponent(serie.id);


            console.log(
                "[SERIES] Buscando detalhes:",
                url
            );


            const resposta =
                await fetch(url, {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                });


            console.log(
                "[SERIES] Status detalhes:",
                resposta.status
            );


            if (!resposta.ok) {

                throw new Error(
                    "Erro HTTP " +
                    resposta.status
                );
            }


            const dados =
                await resposta.json();


            console.log(
                "[SERIES] Detalhes recebidos:",
                dados
            );


            if (
                dados &&
                dados.sucesso &&
                dados.serie
            ) {

                const serieDetalhes =
                    dados.serie;


                const listaTemporadas =
                Array.isArray(serieDetalhes.temporadas)
                    ? serieDetalhes.temporadas
                    : (
                        Array.isArray(serieDetalhes.seasons)
                            ? serieDetalhes.seasons
                            : []
                    );

            if (listaTemporadas.length) {

                console.log(
                    "[SERIES] Temporadas encontradas:",
                    listaTemporadas.length
                );

                preencherTemporadas(
                    listaTemporadas
                );

                return;
            }

        /* ======================================
               FALLBACK
               Se a API de detalhes não retornar
               temporadas, tenta a temporada 1.
               ====================================== */

            console.warn(
                "[SERIES] Temporadas não retornadas. Tentando temporada 1."
            );


            criarTemporadaFallback();


        } catch (erro) {

            console.error(
                "[ERRO DETALHES SÉRIE]",
                erro
            );


            /* ======================================
               FALLBACK
               ====================================== */

            criarTemporadaFallback();

        }

    }


    /* ==========================================
       FALLBACK TEMPORADA 1
       ========================================== */

    function criarTemporadaFallback() {

        temporadas = [
            {
                season_number: 1,
                name: "Temporada 1"
            }
        ];


        select.innerHTML = "";


        const option =
            document.createElement("option");


        option.value = "1";

        option.textContent =
            "Temporada 1";


        select.appendChild(option);


        mostrarEpisodios(1);

    }


    /* ==========================================
       PREENCHER TEMPORADAS
       ========================================== */

    function preencherTemporadas(lista) {

        temporadas =
            Array.isArray(lista)
                ? lista.filter(function (temporada) {

                    return Number(
                        temporada.season_number
                    ) > 0;

                })
                : [];


        select.innerHTML = "";


        if (!temporadas.length) {

            criarTemporadaFallback();

            return;
        }


        temporadas.forEach(function (temporada) {

            const option =
                document.createElement("option");


            option.value =
                String(
                    temporada.season_number
                );


            option.textContent =
                temporada.name ||
                (
                    "Temporada " +
                    temporada.season_number
                );


            select.appendChild(option);

        });


        mostrarEpisodios(
            Number(
                temporadas[0].season_number
            )
        );

    }


    /* ==========================================
       CARREGAR EPISÓDIOS
       ========================================== */

    async function mostrarEpisodios(temporada) {

        if (
            !listaEpisodios ||
            !serie ||
            !serie.id
        ) {

            console.error(
                "[SERIES] Dados da série não encontrados."
            );

            return;
        }


        listaEpisodios.innerHTML = `

            <div style="
                padding: 25px;
                text-align: center;
                color: #aaa;
                width: 100%;
                grid-column: 1 / -1;
            ">

                🔄 Carregando episódios...

            </div>

        `;


        const url =
            "/api/serie/" +
            encodeURIComponent(serie.id) +
            "/temporada/" +
            encodeURIComponent(temporada);


        console.log(
            "[SERIES] Buscando episódios:",
            url
        );


        try {

            const resposta =
                await fetch(url, {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                });


            console.log(
                "[SERIES] Status episódios:",
                resposta.status
            );


            if (!resposta.ok) {

                throw new Error(
                    "Erro HTTP " +
                    resposta.status
                );
            }


            const dados =
                await resposta.json();


            console.log(
                "[SERIES] Episódios recebidos:",
                dados
            );


            if (
                !dados ||
                !dados.sucesso ||
                !Array.isArray(dados.episodios)
            ) {

                throw new Error(
                    "A API não retornou episódios."
                );
            }


            if (!dados.episodios.length) {

                listaEpisodios.innerHTML = `

                    <div style="
                        padding: 25px;
                        text-align: center;
                        color: #aaa;
                        width: 100%;
                        grid-column: 1 / -1;
                    ">

                        Nenhum episódio encontrado.

                    </div>

                `;

                return;
            }


            listaEpisodios.innerHTML = "";


            dados.episodios.forEach(function (ep) {

                const numero =
                    ep.episode_number;


                const nome =
                    ep.name ||
                    "Sem título";


                const item =
                    document.createElement("button");


                item.type = "button";

                item.className =
                    "episodio";


                item.innerHTML = `

                    <span style="
                        display: flex;
                        align-items: center;
                        justify-content: center;
                        width: 42px;
                        height: 42px;
                        margin: 0 auto 10px;
                        border-radius: 50%;
                        background: #e50914;
                        color: white;
                        font-size: 18px;
                    ">
                        ▶
                    </span>


                    <strong style="
                        display: block;
                        color: white;
                        font-size: 16px;
                    ">
                        Episódio ${numero}
                    </strong>


                    <small style="
                        display: block;
                        margin-top: 6px;
                        color: #aaa;
                    ">
                        ${nome}
                    </small>

                `;


                item.addEventListener(
                    "click",
                    function () {

                        assistirEpisodio(
                            temporada,
                            numero,
                            nome
                        );

                    }
                );


                listaEpisodios.appendChild(item);

            });


        } catch (erro) {

            console.error(
                "[ERRO EPISODIOS]",
                erro
            );


            listaEpisodios.innerHTML = `

                <div style="
                    padding: 25px;
                    text-align: center;
                    color: #ff7777;
                    width: 100%;
                    grid-column: 1 / -1;
                ">

                    ❌ Não foi possível carregar os episódios.

                    <br>

                    <small style="
                        color: #888;
                    ">
                        Verifique o console do navegador.
                    </small>

                </div>

            `;

        }

    }


    /* ==========================================
       TROCAR TEMPORADA
       ========================================== */

    select.addEventListener(
        "change",
        function () {

            const temporada =
                Number(
                    select.value
                );


            if (!temporada) {

                return;
            }


            mostrarEpisodios(
                temporada
            );

        }
    );


    /* ==========================================
       PLAYER
       ========================================== */

    function assistirEpisodio(
        temporada,
        episodio,
        nome
    ) {

        if (!serie || !serie.id) {

            console.error(
                "[SERIES] ID da série não encontrado."
            );

            return;
        }


        console.log(
            "[SERIES] Abrindo episódio:",
            {
                serie: serie.id,
                temporada: temporada,
                episodio: episodio
            }
        );


        const urlPlayer =
            "https://myembed.biz/serie/" +
            encodeURIComponent(serie.id) +
            "/" +
            encodeURIComponent(temporada) +
            "/" +
            encodeURIComponent(episodio);


        console.log(
            "[SERIES] Player:",
            urlPlayer
        );


        frame.src =
            urlPlayer;


        tituloPlayer.textContent =
            "🎬 " +
            (
                nome ||
                "Episódio " + episodio
            );


        player.style.display =
            "block";


        player.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }


    /* ==========================================
       INICIAR
       ========================================== */

    carregarDetalhes();


})();


/* ==========================================
   DOM CARREGADO
   ========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "[LUKAFILMES] Página de série carregada."
        );

    }
);

</script>

<script src="../js/navegacao.js"></script>
</body>

</html>
