<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Continuar Assistindo — LUKAFILMES</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100%;
}

body{
    overflow-x:hidden;
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 4%;
    background:rgba(5,5,5,.96);
    box-shadow:0 5px 25px rgba(0,0,0,.45);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
    color:#e50914;
    margin-right:35px;
    white-space:nowrap;
}

.logo span{
    color:#fff;
}
main{
    padding:110px 5% 50px;
}

h1{
    font-size:28px;
    margin-bottom:28px;
}

#listaContinuar{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:24px 16px;
}

.continuar-card{
    min-width:0;
    color:#fff;
}

.continuar-capa{
    width:100%;
    aspect-ratio:2 / 3;
    object-fit:cover;
    display:block;
    border-radius:10px;
    background:#151515;
}

.continuar-info{
    padding-top:9px;
}

.continuar-titulo{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.continuar-progresso{
    width:100%;
    height:4px;
    margin-top:8px;
    background:#333;
    border-radius:4px;
    overflow:hidden;
}

.continuar-progresso > div{
    height:100%;
    background:#e50914;
}

.continuar-btn{
    display:block;
    width:100%;
    margin-top:9px;
    padding:10px 8px;
    border:0;
    border-radius:7px;
    background:#e50914;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.continuar-btn:active{
    transform:scale(.98);
}

.continuar-remover-btn{
    display:block;
    width:100%;
    margin-top:7px;
    padding:9px 8px;
    border:1px solid #555;
    border-radius:7px;
    background:#222;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.continuar-remover-btn:hover{
    background:#333;
}

.vazio{
    color:#aaa;
    font-size:16px;
    padding:30px 0;
}

@media(max-width:600px){

    .header{
        height:60px;
        padding:0 15px;
    }

    .logo{
        font-size:20px;
        margin-right:15px;
    }
main{
        padding:85px 14px 40px;
    }

    h1{
        font-size:23px;
        margin-bottom:22px;
    }

    #listaContinuar{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:20px 12px;
    }

    .continuar-btn{
        padding:11px 6px;
        font-size:13px;
    }
}
</style>


<style id="continuar-inicio-header">
.inicio-header{
    margin-left:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9px 18px;
    min-width:78px;
    height:40px;
    box-sizing:border-box;
    background:#e50914;
    color:#fff;
    border:0;
    border-radius:8px;
    text-decoration:none;
    font-size:15px;
    font-weight:800;
    line-height:1;
    cursor:pointer;
    pointer-events:auto;
    position:relative;
    z-index:1001;
    transition:.2s ease;
}

.inicio-header:hover{
    background:#ff1724;
    color:#fff;
    transform:translateY(-1px);
}

@media(max-width:700px){
    .inicio-header{
        min-width:70px;
        height:38px;
        padding:0 14px;
        font-size:14px;
    }
}
</style>


<style id="lukafilmes-loader-global">
#lukaLoaderOverlay{
    position:fixed;
    inset:0;
    z-index:9999999;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.94);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:1;
    visibility:visible;
    pointer-events:auto;
    transition:
        opacity .28s ease,
        visibility .28s ease;
}

#lukaLoaderOverlay.luka-loader-oculto{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

#lukaLoaderBox{
    width:min(540px,88vw);
    min-height:340px;
    box-sizing:border-box;
    border:1px solid #292929;
    border-radius:18px;
    background:#030303;
    box-shadow:0 25px 80px rgba(0,0,0,.8);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:42px 30px;
    text-align:center;
}

#lukaLoaderLogo{
    font-family:Arial,Helvetica,sans-serif;
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.8px;
    margin-bottom:32px;
    line-height:1;
    text-transform:uppercase;
}

#lukaLoaderLogo .luka{
    color:#fff;
}

#lukaLoaderLogo .filmes{
    color:#e50914;
}

#lukaLoaderSpinner{
    width:58px;
    height:58px;
    border-radius:50%;
    border:7px solid #242424;
    border-top-color:#e50914;
    border-right-color:#e50914;
    box-sizing:border-box;
    animation:lukaLoaderSpin .85s linear infinite;
    margin-bottom:27px;
}

#lukaLoaderTitle{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 10px;
}

#lukaLoaderText{
    color:#858585;
    font-family:Arial,Helvetica,sans-serif;
    font-size:16px;
    margin:0;
}

@keyframes lukaLoaderSpin{
    to{transform:rotate(360deg)}
}

@media(max-width:600px){
    #lukaLoaderBox{
        width:88vw;
        min-height:300px;
        padding:35px 22px;
        border-radius:16px;
    }

    #lukaLoaderLogo{
        font-size:30px;
        margin-bottom:28px;
    }

    #lukaLoaderSpinner{
        width:52px;
        height:52px;
        border-width:6px;
        margin-bottom:24px;
    }

    #lukaLoaderTitle{
        font-size:18px;
    }

    #lukaLoaderText{
        font-size:14px;
    }
}
</style>

</head>

<body>


<div id="lukaLoaderOverlay" aria-hidden="false">
    <div id="lukaLoaderBox">
        <div id="lukaLoaderLogo">
            <span class="luka">LUKA</span><span class="filmes">FILMES</span>
        </div>
        <div id="lukaLoaderSpinner"></div>
        <h2 id="lukaLoaderTitle">Preparando sua sessão...</h2>
        <p id="lukaLoaderText">Isso pode levar alguns segundos</p>
    </div>
</div>


<header class="header">

    <div class="logo">
        LUKA<span>FILMES</span>
    </div>
    <a class="inicio-header" href="../index.html">Início</a></header>




<main>

    <h1>▶ Continuar Assistindo</h1>

    <div id="listaContinuar"></div>

</main>

<script src="../js/conta-storage.js"></script>
<script src="../js/continuar-assistindo.js"></script>

<script>
(function(){

    const container =
        document.getElementById("listaContinuar");

    if(!container){
        console.error("[CONTINUAR] Container não encontrado.");
        return;
    }

    function lerHistorico(){

        try{
            const bruto =
                localStorage.getItem("lukafilmes_continuar");

            const lista =
                bruto ? JSON.parse(bruto) : [];

            return Array.isArray(lista) ? lista : [];

        }catch(e){

            console.error(
                "[CONTINUAR] Erro ao ler histórico:",
                e
            );

            return [];
        }
    }

    function escapar(valor){

        return String(valor || "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    function abrirConteudo(item){

        if(!item || !item.id){
            console.error(
                "[CONTINUAR] Item sem ID:",
                item
            );
            return;
        }

        try{

            localStorage.setItem(
                "filmeSelecionadoHome_" + String(item.id),
                JSON.stringify(item)
            );

            localStorage.setItem(
                "filmeSelecionado",
                JSON.stringify(item)
            );

        }catch(e){

            console.error(
                "[CONTINUAR] Erro ao preparar filme:",
                e
            );

            return;
        }

        const tipo =
            item.tipo === "serie" ||
            item.tipo === "series" ||
            item.media_type === "tv"
                ? "serie"
                : "filme";

        const pagina =
            tipo === "serie"
                ? "/paginas/serie.html"
                : "/paginas/filme.html";

        console.log(
            "[CONTINUAR] Abrindo:",
            pagina,
            "ID:",
            item.id,
            "tempo:",
            item.tempo
        );

        window.location.href =
            pagina +
            "?id=" +
            encodeURIComponent(item.id);
    }

    function carregar(){

        let lista = lerHistorico();

        /*
         * Só aparecem conteúdos que realmente possuem
         * algum progresso e ainda não chegaram ao fim.
         */
        lista = lista.filter(function(item){

            if(!item || !item.id){
                return false;
            }

            const progresso =
                Number(item.progresso) || 0;

            const tempo =
                Number(item.tempo) || 0;

            return (tempo > 0 || item.player) && progresso < 99.5;
        });

        console.log(
            "[CONTINUAR] Itens encontrados:",
            lista.length,
            lista
        );

        if(!lista.length){

            container.innerHTML =
                '<div class="vazio">' +
                'Você ainda não tem filmes ou séries para continuar assistindo.' +
                '</div>';

            return;
        }

        container.innerHTML = "";

        lista.forEach(function(item){

            const progresso =
                Math.min(
                    100,
                    Math.max(
                        0,
                        Number(item.progresso) || 0
                    )
                );

            const card =
                document.createElement("div");

            card.className =
                "continuar-card";

            card.innerHTML = `
                <img
                    class="continuar-capa"
                    src="${escapar(item.capa || "")}"
                    alt="${escapar(item.titulo || "Conteúdo")}"
                    draggable="false"
                >

                <div class="continuar-info">

                    <div class="continuar-titulo">
                        ${escapar(item.titulo || "Conteúdo")}
                    </div>

                    <div class="continuar-progresso">
                        <div style="width:${progresso}%"></div>
                    </div>

                    <button
                        type="button"
                        class="continuar-btn"
                    >
                        ▶ Continuar
                    </button>

                    <button
                        type="button"
                        class="continuar-remover-btn"
                    >
                        🗑 Remover
                    </button>

                </div>
            `;

            const botao =
                card.querySelector(".continuar-btn");

            botao.addEventListener(
                "click",
                function(){
                    abrirConteudo(item);
                }
            );

            const remover =
                card.querySelector(".continuar-remover-btn");

            remover.addEventListener(
                "click",
                function(e){

                    e.preventDefault();
                    e.stopPropagation();

                    if(window.LukaContinuar){
                        LukaContinuar.remover(
                            item.id,
                            item.tipo || "filme"
                        );
                    }

                    carregar();
                }
            );

            container.appendChild(card);
        });
    }

    function iniciar(){
        carregar();
    }

    if(window.LukaContaPronta){
        window.LukaContaPronta.then(iniciar);
    }else{
        window.addEventListener(
            "lukafilmes:conta-pronta",
            iniciar,
            {once:true}
        );
    }

})();
</script>

<script id="lukafilmes-loader-global-js">
(function(){

    var loaderPronto = false;

    function loader(){
        return document.getElementById("lukaLoaderOverlay");
    }

    function mostrarLukaLoader(){
        var overlay = loader();
        if(!overlay) return;

        overlay.classList.remove("luka-loader-oculto");
        overlay.setAttribute("aria-hidden","false");
    }

    function esconderLukaLoader(){
        var overlay = loader();
        if(!overlay) return;

        overlay.classList.add("luka-loader-oculto");
        overlay.setAttribute("aria-hidden","true");
    }

    window.mostrarLukaLoader = mostrarLukaLoader;

    window.LukaLoader = {
        show: mostrarLukaLoader,
        hide: esconderLukaLoader
    };

    /*
     * Qualquer navegação interna mostra o Loader.
     */
    function prepararNavegacao(){

        document.addEventListener("click",function(event){

            var link = event.target.closest
                ? event.target.closest("a[href]")
                : null;

            if(!link) return;

            if(
                link.target === "_blank" ||
                link.hasAttribute("download") ||
                link.getAttribute("href").startsWith("#") ||
                link.getAttribute("href").startsWith("javascript:")
            ){
                return;
            }

            var href = link.href;

            if(!href) return;

            try{
                var destino = new URL(href, location.href);

                if(destino.origin !== location.origin){
                    return;
                }

                if(
                    destino.pathname === location.pathname &&
                    destino.search === location.search &&
                    destino.hash !== ""
                ){
                    return;
                }

                mostrarLukaLoader();

            }catch(e){}

        },true);

        /*
         * Botões que normalmente iniciam player/navegação.
         */
        document.addEventListener("click",function(event){

            var botao = event.target.closest
                ? event.target.closest("button")
                : null;

            if(!botao) return;

            var texto = (botao.textContent || "")
                .trim()
                .toLowerCase();

            if(
                texto.includes("assistir") ||
                botao.matches("#playCentralFilme") ||
                botao.matches("#playCentralSerie") ||
                botao.matches(".btn-watch")
            ){
                mostrarLukaLoader();
            }

        },true);
    }

    /*
     * Voltar/avançar pelo navegador:
     * nunca deixar o Loader preso.
     */
    window.addEventListener("pageshow",function(event){

        if(event.persisted){
            esconderLukaLoader();
        }

    });

    /*
     * A própria página já terminou de carregar.
     * Para páginas normais, isso libera o Loader.
     *
     * A Home possui controle próprio abaixo.
     */
    window.addEventListener("load",function(){

        setTimeout(function(){

            if(!window.__LUKAFILMES_HOME_LOADER_CONTROLLED__){
                esconderLukaLoader();
            }

        },80);

    });

    if(document.readyState === "loading"){
        document.addEventListener(
            "DOMContentLoaded",
            prepararNavegacao
        );
    }else{
        prepararNavegacao();
    }

})();
</script>



<script id="lukafilmes-loader-player-fix">
(function(){

    function loader(){
        return document.getElementById("lukaLoaderOverlay");
    }

    function esconder(){
        var el = loader();
        if(!el) return;

        el.classList.remove("ativo");
        el.classList.add("luka-loader-oculto");
        el.setAttribute("aria-hidden","true");

        el.style.display = "none";
        el.style.pointerEvents = "none";
    }

    function mostrar(){
        var el = loader();
        if(!el) return;

        el.classList.remove("luka-loader-oculto");
        el.classList.add("ativo");
        el.setAttribute("aria-hidden","false");

        el.style.display = "flex";
        el.style.pointerEvents = "auto";
    }

    function monitorarPlayer(){

        var iframes = document.querySelectorAll("iframe");

        iframes.forEach(function(frame){

            if(frame.dataset.lukaLoaderMonitorado === "1"){
                return;
            }

            frame.dataset.lukaLoaderMonitorado = "1";

            frame.addEventListener("load",function(){

                setTimeout(function(){
                    esconder();
                },120);

            });

        });

        var videos = document.querySelectorAll("video");

        videos.forEach(function(video){

            if(video.dataset.lukaLoaderMonitorado === "1"){
                return;
            }

            video.dataset.lukaLoaderMonitorado = "1";

            [
                "loadstart",
                "loadedmetadata",
                "loadeddata",
                "canplay",
                "playing"
            ].forEach(function(evento){

                video.addEventListener(evento,function(){
                    esconder();
                });

            });

        });
    }

    function iniciarMonitoramento(){

        monitorarPlayer();

        var observer = new MutationObserver(function(){
            monitorarPlayer();
        });

        observer.observe(document.documentElement,{
            childList:true,
            subtree:true
        });

    }

    document.addEventListener("click",function(event){

        var alvo = event.target.closest(
            "#playCentralFilme," +
            "#playCentralSerie," +
            ".btn-watch," +
            "[class*='play']," +
            "[id*='play']"
        );

        if(!alvo){
            return;
        }

        mostrar();

        /*
         * O clique original continua funcionando normalmente.
         * Apenas esperamos o player nascer/carregar.
         */

        var tentativas = 0;

        var verificar = setInterval(function(){

            monitorarPlayer();

            tentativas++;

            /*
             * Se o iframe/player já apareceu,
             * damos tempo para o evento load atuar.
             */
            if(
                document.querySelector("iframe") ||
                document.querySelector("video")
            ){

                clearInterval(verificar);

            }

            /*
             * Proteção contra Loader preso.
             * Nunca deixa o overlay ficar eternamente
             * por cima de um player que já está funcionando.
             */
            if(tentativas >= 80){

                clearInterval(verificar);
                esconder();

            }

        },250);

    },true);

    /*
     * Se o navegador voltar por histórico,
     * nunca deixa o Loader preso.
     */
    window.addEventListener("pageshow",function(){
        setTimeout(function(){
            monitorarPlayer();
        },100);

        setTimeout(function(){
            esconder();
        },800);
    });

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            iniciarMonitoramento
        );

    }else{

        iniciarMonitoramento();

    }

})();
</script>

</body>
