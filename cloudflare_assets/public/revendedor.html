<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LUKAFILMES — Painel de Revenda</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#050505;
    color:#fff;
}
header{
    padding:18px 20px;
    background:#0b0b0b;
    border-bottom:1px solid #222;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:10;
}
.logo{
    font-size:23px;
    font-weight:900;
}
.logo span{color:#e50914}
.sair{
    background:#e50914;
    border:0;
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-weight:bold;
}
main{
    max-width:1100px;
    margin:auto;
    padding:22px;
}
h1{margin:0 0 5px}
.sub{color:#aaa;margin-bottom:25px}

.cards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}
.card{
    background:#111;
    border:1px solid #252525;
    border-radius:14px;
    padding:20px;
}
.card small{color:#999}
.card strong{
    display:block;
    font-size:32px;
    margin-top:8px;
}

.box{
    background:#101010;
    border:1px solid #252525;
    border-radius:14px;
    padding:20px;
    margin-top:20px;
}
.box h2{margin-top:0}

form{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
input{
    width:100%;
    padding:13px;
    border-radius:8px;
    border:1px solid #333;
    background:#080808;
    color:#fff;
}
button{
    cursor:pointer;
}
.criar{
    grid-column:1/-1;
    padding:14px;
    border:0;
    border-radius:8px;
    background:#e50914;
    color:#fff;
    font-weight:bold;
}

.lista{
    display:grid;
    gap:10px;
}
.usuario{
    background:#080808;
    border:1px solid #242424;
    border-radius:10px;
    padding:15px;
}
.usuario-top{
    display:flex;
    justify-content:space-between;
    gap:10px;
}
.online{color:#20d46b}
.offline{color:#777}
.meta{
    color:#aaa;
    font-size:13px;
    margin-top:8px;
}

#msg{
    margin-top:12px;
    color:#aaa;
}

@media(max-width:700px){
    main{padding:14px}
    .cards{grid-template-columns:1fr}
    form{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
    <div class="logo">LUKA<span>FILMES</span></div>
    <button class="sair" onclick="sair()">Sair</button>
</header>

<main>

    <h1>🤝 Painel de Revenda</h1>
    <div class="sub">Gerencie suas contas e clientes.</div>

    <div class="cards">
        <div class="card">
            <small>CLIENTES</small>
            <strong id="total">0</strong>
        </div>

        <div class="card">
            <small>ONLINE</small>
            <strong id="online">0</strong>
        </div>

        <div class="card">
            <small>LIMITE</small>
            <strong id="limite">0</strong>
        </div>
    </div>

    <div class="box">
        <h2>➕ Criar cliente</h2>

        <form id="formCriar">
            <input id="usuario" placeholder="Usuário" required>
            <input id="senha" placeholder="Senha" required>
            <input id="dias" type="number" min="1" value="30" placeholder="Dias">
            <button class="criar" type="submit">CRIAR CLIENTE</button>
        </form>

        <div id="msg"></div>
    </div>

    <div class="box">
        <h2>👥 Meus clientes</h2>
        <div id="lista" class="lista">
            Carregando...
        </div>
    </div>

</main>

<script>
async function carregar(){

    try{

        const r = await fetch("/api/revendedor/clientes", {
            credentials:"include",
            cache:"no-store"
        });

        if(!r.ok){
            document.getElementById("lista").innerHTML =
                "<div class='usuario'>Não foi possível carregar os clientes.</div>";
            return;
        }

        const d = await r.json();

        const clientes = Array.isArray(d.clientes) ? d.clientes : [];

        document.getElementById("total").textContent = clientes.length;
        document.getElementById("online").textContent =
            clientes.filter(x => x.online).length;

        document.getElementById("limite").textContent =
            Number(d.limite || 0) || "∞";

        const lista = document.getElementById("lista");

        if(!clientes.length){
            lista.innerHTML =
                "<div class='usuario'>Nenhum cliente cadastrado.</div>";
            return;
        }

        lista.innerHTML = clientes.map(u => `
            <div class="usuario">
                <div class="usuario-top">
                    <strong>${esc(u.usuario || "—")}</strong>
                    <span class="${u.online ? "online":"offline"}">
                        ${u.online ? "● ONLINE":"○ OFFLINE"}
                    </span>
                </div>

                <div class="meta">
                    Status: ${esc(u.status || "ativo")}<br>
                    Validade: ${u.validade ? esc(new Date(u.validade).toLocaleString("pt-BR")) : "—"}
                </div>
            </div>
        `).join("");

    }catch(e){
        document.getElementById("lista").innerHTML =
            "<div class='usuario'>Erro ao carregar painel.</div>";
    }
}

document.getElementById("formCriar").addEventListener("submit", async e => {

    e.preventDefault();

    const msg = document.getElementById("msg");
    msg.textContent = "Criando cliente...";

    try{

        const r = await fetch("/api/revendedor/clientes", {
            method:"POST",
            credentials:"include",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usuario:document.getElementById("usuario").value.trim(),
                senha:document.getElementById("senha").value,
                dias:Number(document.getElementById("dias").value)
            })
        });

        const d = await r.json();

        msg.textContent = d.mensagem || "Operação concluída.";

        if(d.sucesso){
            document.getElementById("formCriar").reset();
            document.getElementById("dias").value = 30;
            carregar();
        }

    }catch(e){
        msg.textContent = "Erro de comunicação com o servidor.";
    }
});

function esc(v){
    return String(v ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

async function sair(){
    try{
        await fetch("/logout",{
            method:"POST",
            credentials:"include"
        });
    }catch(e){}
    location.href="/";
}

carregar();
setInterval(carregar,15000);
</script>

</body>
</html>
