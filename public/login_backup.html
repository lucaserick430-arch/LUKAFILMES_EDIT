<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LUKAFILMES - Login</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        background: #080808;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login {
        width: 90%;
        max-width: 400px;
        background: #151515;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(229, 9, 20, 0.15);
    }

    .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .logo span {
        color: #e50914;
    }

    input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        box-shadow: 0 0 0 2px #e50914;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 5px;
        background: #e50914;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #b20710;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #mensagem {
        margin-top: 15px;
        text-align: center;
        color: #ff5555;
        min-height: 20px;
    }
</style>


</head>

<body>


<div class="login">

    <div class="logo">
        LUKA<span>FILMES</span>
    </div>

    <form id="loginForm">

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
            required
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            required
        >

        <button
            id="botaoLogin"
            type="submit"
        >
            ENTRAR
        </button>

    </form>

    <div id="mensagem"></div>

</div>

<script>
    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const usuario =
                document.getElementById("usuario").value.trim();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            const botao =
                document.getElementById("botaoLogin");

            mensagem.textContent = "";
            botao.disabled = true;
            botao.textContent = "ENTRANDO...";

            try {

                const resposta = await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario,
                            senha
                        })
                    }
                );

                const dados = await resposta.json();

                if (dados.sucesso) {

                    window.location.href = "/";

                } else {

                    mensagem.textContent =
                        dados.mensagem ||
                        "Usuário ou senha incorretos.";

                }

            } catch (erro) {

                console.error(
                    "Erro no login:",
                    erro
                );

                mensagem.textContent =
                    "Não foi possível conectar ao servidor.";

            } finally {

                botao.disabled = false;
                botao.textContent = "ENTRAR";

            }

        });
</script>


</body>
</html>
