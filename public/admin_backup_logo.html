
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Admin - LUKAFILMES</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: #fff;
            padding: 30px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitulo {
            color: #999;
            margin-bottom: 30px;
        }

        .card {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        input,
        button {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            margin-bottom: 15px;
            border-radius: 7px;
            border: none;
            font-size: 15px;
        }

        input {
            background: #222;
            color: #fff;
            border: 1px solid #333;
        }

        button {
            background: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .btn-sair {
            width: auto;
            padding: 10px 20px;
            float: right;
        }

        .mensagem {
            padding: 12px;
            border-radius: 7px;
            display: none;
            margin-bottom: 15px;
        }

        .tabela {
            width: 100%;
            border-collapse: collapse;
        }

        .tabela th,
        .tabela td {
            padding: 12px;
            border-bottom: 1px solid #292929;
            text-align: left;
        }

        .tabela th {
            color: #aaa;
        }

        .status {
            font-weight: bold;
        }

        .ativo {
            color: #00d26a;
        }

        .bloqueado {
            color: #ff4444;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .tabela {
                font-size: 13px;
            }

            .tabela th:nth-child(1),
            .tabela td:nth-child(1) {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <button class="btn-sair" onclick="sair()">Sair</button>

    <h1>🎬 LUKAFILMES</h1>
    <div class="subtitulo">Painel administrativo</div>

    <div class="card">

        <h2>Criar usuário</h2>

        <div id="mensagem" class="mensagem"></div>

        <label>Usuário</label>
        <input
            type="text"
            id="usuario"
            placeholder="Ex: cliente001"
        >

        <label>Senha</label>
        <input
            type="text"
            id="senha"
            placeholder="Digite a senha"
        >

        <label>Dias de acesso</label>
        <input
            type="number"
            id="dias"
            min="1"
            placeholder="Ex: 30"
        >

        <button onclick="criarUsuario()">
            CRIAR USUÁRIO
        </button>

    </div>

    <div class="card">

        <h2>Usuários cadastrados</h2>

        <div id="usuarios">
            Carregando...
        </div>

    </div>

</div>

<script>

async function verificarAdmin() {

    const resposta = await fetch("/api/eu");

    if (!resposta.ok) {
        window.location.href = "/login";
        return;
    }

    const dados = await resposta.json();

    if (!dados.logado || dados.usuario.tipo !== "admin") {
        window.location.href = "/";
        return;
    }

    carregarUsuarios();
}


async function criarUsuario() {

    const usuario = document.getElementById("usuario").value.trim();
    const senha = document.getElementById("senha").value;
    const dias = document.getElementById("dias").value;

    const mensagem = document.getElementById("mensagem");

    if (!usuario || !senha || !dias) {

        mensagem.style.display = "block";
        mensagem.style.background = "#5c1b1b";
        mensagem.textContent = "Preencha todos os campos.";

        return;
    }

    const resposta = await fetch("/api/admin/usuarios", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            usuario,
            senha,
            dias: Number(dias)
        })

    });

    const dados = await resposta.json();

    mensagem.style.display = "block";

    if (dados.sucesso) {

        mensagem.style.background = "#123d25";
        mensagem.textContent = "Usuário criado com sucesso!";

        document.getElementById("usuario").value = "";
        document.getElementById("senha").value = "";
        document.getElementById("dias").value = "";

        carregarUsuarios();

    } else {

        mensagem.style.background = "#5c1b1b";
        mensagem.textContent = dados.mensagem || "Erro ao criar usuário.";
    }
}


async function carregarUsuarios() {

    const resposta = await fetch("/api/admin/usuarios");

    if (!resposta.ok) {
        document.getElementById("usuarios").innerHTML =
            "Não foi possível carregar os usuários.";
        return;
    }

    const dados = await resposta.json();

    if (!dados.usuarios || dados.usuarios.length === 0) {

        document.getElementById("usuarios").innerHTML =
            "Nenhum usuário cadastrado.";

        return;
    }

    let html = `
        <table class="tabela">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuário</th>
                    <th>Tipo</th>
                    <th>Status</th>
                    <th>Validade</th>
                </tr>
            </thead>

            <tbody>
    `;

    dados.usuarios.forEach(usuario => {

        let validade = "Permanente";

        if (usuario.validade) {
            validade = new Date(usuario.validade)
                .toLocaleString("pt-BR");
        }

        html += `
            <tr>

                <td>${usuario.id}</td>

                <td>${usuario.usuario}</td>

                <td>${usuario.tipo}</td>

                <td class="status ${
                    usuario.status === "ativo"
                        ? "ativo"
                        : "bloqueado"
                }">
                    ${usuario.status}
                </td>

                <td>${validade}</td>

            </tr>
        `;

    });

    html += `
            </tbody>
        </table>
    `;

    document.getElementById("usuarios").innerHTML = html;
}


async function sair() {

    await fetch("/logout", {
        method: "POST"
    });

    window.location.href = "/login";
}


verificarAdmin();

</script>

</body>
</html>
