<!DOCTYPE html>

<html lang="pt-BR">
<head>
    <meta charset="UTF-8">


<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LUKAFILMES - Login</title>

<style>

    #fundoTrailer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: -3;
        background: #000;
    }

    #fundoTrailer iframe {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 120vw;
        height: 67.5vw;
        min-width: 177.78vh;
        min-height: 100vh;
        transform: translate(-50%, -50%) scale(1.12);
        border: 0;
        pointer-events: none;
    }

    #escuro {
        position: fixed;
        inset: 0;
        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,.88),
                rgba(0,0,0,.58),
                rgba(0,0,0,.88)
            ),
            linear-gradient(
                180deg,
                rgba(0,0,0,.35),
                rgba(0,0,0,.72)
            );
        z-index: -2;
        pointer-events: none;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        min-height: 100vh;
        overflow: hidden;
        position: relative;
        background: #000;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #080808;
        color: white;
        font-family: Arial, sans-serif;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .login {
        position: relative;
        z-index: 5;
        width: 90%;
        max-width: 400px;
        background: rgba(10, 10, 10, 0.82);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,.12);
        width: 90%;
        max-width: 400px;
        background: #151515;
        padding: 35px;
        border-radius: 10px;
        box-shadow: 0 0 30px rgba(229, 9, 20, 0.15);
    }

    .logo {
        text-align: center;
        font-size: 30px;
        font-weight: bold;
        margin-bottom: 30px;
    }

    .logo span {
        color: #e50914;
    }

    input {
        width: 100%;
        padding: 15px;
        margin-bottom: 15px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        outline: none;
    }

    input:focus {
        box-shadow: 0 0 0 2px #e50914;
    }

    button {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 5px;
        background: #e50914;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #b20710;
    }

    button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #mensagem {
        margin-top: 15px;
        text-align: center;
        color: #ff5555;
        min-height: 20px;
    }
</style>



<style id="lukafilmes-login-loader-premium">
#lukafilmesLoginLoader{
    position:fixed;
    inset:0;
    z-index:9999999;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.94);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    opacity:0;
    transition:opacity .25s ease;
}

#lukafilmesLoginLoader.ativo{
    display:flex;
    opacity:1;
}

#lukafilmesLoginLoaderBox{
    width:min(540px,88vw);
    min-height:340px;
    box-sizing:border-box;
    border:1px solid #292929;
    border-radius:18px;
    background:#030303;
    box-shadow:0 25px 80px rgba(0,0,0,.8);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:42px 30px;
    text-align:center;
}

#lukafilmesLoginLoaderLogo{
    font-family:Arial,Helvetica,sans-serif;
    font-size:34px;
    font-weight:900;
    letter-spacing:-1.8px;
    margin-bottom:32px;
    line-height:1;
    text-transform:uppercase;
}

#lukafilmesLoginLoaderLogo .luka{
    color:#fff;
}

#lukafilmesLoginLoaderLogo .filmes{
    color:#e50914;
}

#lukafilmesLoginLoaderSpinner{
    width:58px;
    height:58px;
    border-radius:50%;
    border:7px solid #242424;
    border-top-color:#e50914;
    border-right-color:#e50914;
    box-sizing:border-box;
    animation:lukafilmesLoginLoaderSpin .85s linear infinite;
    margin-bottom:27px;
}

#lukafilmesLoginLoaderTitle{
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:20px;
    font-weight:700;
    margin:0 0 10px;
}

#lukafilmesLoginLoaderText{
    color:#858585;
    font-family:Arial,Helvetica,sans-serif;
    font-size:16px;
    margin:0;
}

@keyframes lukafilmesLoginLoaderSpin{
    to{transform:rotate(360deg)}
}

@media(max-width:600px){
    #lukafilmesLoginLoaderBox{
        width:88vw;
        min-height:300px;
        padding:35px 22px;
        border-radius:16px;
    }

    #lukafilmesLoginLoaderLogo{
        font-size:30px;
        margin-bottom:28px;
    }

    #lukafilmesLoginLoaderSpinner{
        width:52px;
        height:52px;
        border-width:6px;
        margin-bottom:24px;
    }

    #lukafilmesLoginLoaderTitle{
        font-size:18px;
    }

    #lukafilmesLoginLoaderText{
        font-size:14px;
    }
}
</style>

</head>

<body>

<div id="fundoTrailer">
    <iframe
        src="https://www.youtube.com/embed/c51ND9Hdbw0?autoplay=1&mute=1&controls=0&loop=1&playlist=c51ND9Hdbw0&modestbranding=1&rel=0"
        allow="autoplay; fullscreen"
        frameborder="0">
    </iframe>
</div>

<div id="escuro"></div>


<div class="login">

    <div class="logo">
        LUKA<span>FILMES</span>
    </div>

    <form id="loginForm">

        <input
            id="usuario"
            type="text"
            placeholder="Usuário"
            autocomplete="username"
            required
        >

        <input
            id="senha"
            type="password"
            placeholder="Senha"
            autocomplete="current-password"
            required
        >

        <button
            id="botaoLogin"
            type="submit"
        >
            ENTRAR
        </button>

    </form>

    <div id="mensagem"></div>

</div>

<script>
    document
        .getElementById("loginForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();

            const usuario =
                document.getElementById("usuario").value.trim();

            const senha =
                document.getElementById("senha").value;

            const mensagem =
                document.getElementById("mensagem");

            const botao =
                document.getElementById("botaoLogin");

            mensagem.textContent = "";
            botao.disabled = true;
            botao.textContent = "ENTRANDO...";

            try {

                const resposta = await fetch(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            usuario,
                            senha
                        })
                    }
                );

                const dados = await resposta.json();

                if (dados.sucesso) {

                    window.location.href = "/";

                } else {

                    mensagem.textContent =
                        dados.mensagem ||
                        "Usuário ou senha incorretos.";

                }

            } catch (erro) {

                console.error(
                    "Erro no login:",
                    erro
                );

                mensagem.textContent =
                    "Não foi possível conectar ao servidor.";

            } finally {

                botao.disabled = false;
                botao.textContent = "ENTRAR";

            }

        });
</script>



<div id="lukafilmesLoginLoader" aria-hidden="true">
    <div id="lukafilmesLoginLoaderBox">
        <div id="lukafilmesLoginLoaderLogo">
            <span class="luka">LUKA</span><span class="filmes">FILMES</span>
        </div>
        <div id="lukafilmesLoginLoaderSpinner"></div>
        <h2 id="lukafilmesLoginLoaderTitle">Entrando no LUKAFILMES...</h2>
        <p id="lukafilmesLoginLoaderText">Preparando sua sessão...</p>
    </div>
</div>


<script id="lukafilmes-login-loader-js">
(function(){

    var loader = document.getElementById("lukafilmesLoginLoader");
    var form = document.getElementById("loginForm");

    function mostrarLoginLoader(){
        if(!loader)return;
        loader.classList.add("ativo");
        loader.setAttribute("aria-hidden","false");
    }

    function esconderLoginLoader(){
        if(!loader)return;
        loader.classList.remove("ativo");
        loader.setAttribute("aria-hidden","true");
    }

    window.lukafilmesMostrarLoginLoader = mostrarLoginLoader;
    window.lukafilmesEsconderLoginLoader = esconderLoginLoader;

    if(form){
        form.addEventListener("submit",function(){
            mostrarLoginLoader();
        },true);
    }

    window.addEventListener("pageshow",function(){
        esconderLoginLoader();
    });

})();
</script>

</body>
</html>
