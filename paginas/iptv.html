<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUKAFILMES — IPTV</title>

<style>
:root{
    --red:#e50914;
    --red-dark:#8b0008;
    --black:#050505;
    --white:#fff;
    --muted:rgba(255,255,255,.58);
    --border:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    background:#050505;
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -15%,rgba(229,9,20,.30),transparent 38%),
        radial-gradient(circle at 0% 50%,rgba(120,0,8,.16),transparent 30%),
        radial-gradient(circle at 100% 70%,rgba(120,0,8,.14),transparent 30%),
        linear-gradient(180deg,#090909 0%,#050505 100%);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,.012) 50%,
        transparent 100%
    );
}

a{
    color:inherit;
    text-decoration:none;
}

.topo{
    position:sticky;
    top:0;
    z-index:1000;
    min-height:76px;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 24px;
    background:rgba(5,5,5,.88);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.logo{
    color:#fff;
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
    white-space:nowrap;
}

.logo::first-letter{
    color:#fff;
}

.titulo{
    color:var(--red);
    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
    text-transform:uppercase;
    white-space:nowrap;
}

.busca{
    margin-left:auto;
    width:min(330px,42vw);
    min-height:42px;
    padding:0 16px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    outline:none;
    background:rgba(255,255,255,.045);
    color:#fff;
    font-size:13px;
    transition:.2s ease;
}

.busca:focus{
    border-color:rgba(229,9,20,.65);
    background:rgba(229,9,20,.07);
    box-shadow:0 0 0 3px rgba(229,9,20,.08);
}

.busca::placeholder{
    color:rgba(255,255,255,.40);
}

.conteudo{
    width:min(1280px,100%);
    margin:auto;
    padding:0 24px 60px;
}

.status{
    padding:24px 0 8px;
    color:rgba(255,255,255,.40);
    font-size:11px;
    letter-spacing:.8px;
}

.secao{
    margin-bottom:35px;
}

.secao h2{
    margin:0 0 20px;
    font-size:19px;
    font-weight:800;
}

.categorias-iptv{
    display:flex;
    gap:9px;
    overflow-x:auto;
    padding:3px 1px 16px;
    margin-bottom:5px;
    scrollbar-width:none;
}

.categorias-iptv::-webkit-scrollbar{
    display:none;
}

.categoria-btn{
    flex:0 0 auto;
    min-height:38px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:11px;
    padding:0 15px;
    background:rgba(255,255,255,.045);
    color:rgba(255,255,255,.55);
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
    white-space:nowrap;
}

.categoria-btn:hover{
    border-color:rgba(229,9,20,.55);
    background:rgba(229,9,20,.10);
    color:#fff;
}

.categoria-btn.ativo{
    background:var(--red);
    color:#fff;
    border-color:var(--red);
    box-shadow:0 8px 25px rgba(229,9,20,.20);
}

.canais{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(190px,1fr));
    gap:18px;
}

.canal{
    --accent:rgba(229,9,20,.70);
    position:relative;
    min-height:190px;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    overflow:hidden;
    padding:18px;
    border:1px solid var(--border);
    border-radius:21px;
    background:
        radial-gradient(circle at 90% 10%,var(--accent),transparent 38%),
        linear-gradient(135deg,rgba(255,255,255,.075),rgba(255,255,255,.018));
    box-shadow:0 18px 45px rgba(0,0,0,.28);
    isolation:isolate;
    cursor:pointer;
    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.canal::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;
    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.94) 0%,
            rgba(0,0,0,.70) 38%,
            rgba(0,0,0,.35) 70%,
            rgba(0,0,0,.62) 100%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.88) 0%,
            rgba(0,0,0,.22) 65%,
            rgba(229,9,20,.16) 100%
        );
}

.canal::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    z-index:3;
    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );
    opacity:.75;
}

.logo-canal{
    position:absolute;
    inset:0;
    z-index:-3;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    margin:0;
    padding:18px;
    background:transparent;
    border-radius:21px;
    opacity:.55;
    transform:scale(1.03);
    transition:
        opacity .45s ease,
        transform .55s ease;
}

.canal:hover{
    transform:translateY(-5px);
    border-color:rgba(229,9,20,.55);
    box-shadow:
        0 25px 55px rgba(0,0,0,.38),
        0 0 35px rgba(229,9,20,.08);
}

.canal:hover .logo-canal{
    opacity:.70;
    transform:scale(1.08);
}

.nome{
    position:relative;
    z-index:2;
    margin-top:auto;
    color:#fff;
    font-size:17px;
    line-height:1.08;
    font-weight:800;
    letter-spacing:-.3px;
    text-shadow:
        0 2px 10px rgba(0,0,0,.75),
        0 4px 22px rgba(0,0,0,.65);
}

.categoria{
    position:relative;
    z-index:2;
    margin-top:7px;
    color:rgba(255,255,255,.40);
    font-size:10px;
    font-weight:800;
    letter-spacing:1.5px;
    text-transform:uppercase;
}

.player-area{
    display:none;
    margin:28px 0 35px;
    padding:20px;
    border:1px solid rgba(255,255,255,.10);
    border-radius:21px;
    background:
        radial-gradient(circle at 90% 0%,rgba(229,9,20,.14),transparent 35%),
        rgba(255,255,255,.025);
    box-shadow:0 20px 55px rgba(0,0,0,.30);
}

.player-area.ativo{
    display:block;
}

.player-topo{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:14px;
}

.player-titulo{
    color:#fff;
    font-size:18px;
    font-weight:800;
}

.fechar{
    min-height:40px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    padding:0 15px;
    background:rgba(255,255,255,.045);
    color:#fff;
    font-size:12px;
    font-weight:700;
    cursor:pointer;
    transition:.2s ease;
}

.fechar:hover{
    border-color:rgba(229,9,20,.55);
    background:rgba(229,9,20,.10);
}

.player{
    position:relative;
    width:100%;
    aspect-ratio:16/9;
    min-height:300px;
    overflow:hidden;
    background:#000;
    border-radius:15px;
    box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.player video::-webkit-media-controls-timeline{
    display:none !important;
}

.player video::-webkit-media-controls-current-time-display,
.player video::-webkit-media-controls-time-remaining-display{
    display:none !important;
}

.aviso{
    padding:25px;
    border:1px solid rgba(255,255,255,.08);
    border-radius:15px;
    background:rgba(255,255,255,.035);
    color:rgba(255,255,255,.40);
}

.erro{
    color:#ff7777;
}

@media(max-width:700px){

    .topo{
        min-height:68px;
        padding:0 12px;
        gap:10px;
    }

    .logo{
        font-size:20px;
    }

    .titulo{
        font-size:9px;
        letter-spacing:2px;
    }

    .busca{
        width:145px;
        min-height:38px;
        padding:0 12px;
        font-size:12px;
    }

    .conteudo{
        width:100%;
        padding:0 12px calc(30px + env(safe-area-inset-bottom));
    }

    .status{
        padding:20px 0 8px;
    }

    .secao h2{
        font-size:18px;
        margin-bottom:17px;
    }

    .categorias-iptv{
        margin-left:-2px;
        margin-right:-2px;
    }

    .canais{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .canal{
        min-height:155px;
        padding:14px;
        border-radius:18px;
    }

    .logo-canal{
        border-radius:18px;
        padding:14px;
    }

    .nome{
        font-size:14px;
    }

    .categoria{
        font-size:9px;
    }

    .player-area{
        margin-top:20px;
        padding:13px;
        border-radius:18px;
    }

    .player{
        min-height:210px;
        border-radius:12px;
    }
}

@media(min-width:1600px){

    .canais{
        grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    }

    .canal::before{
        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,.91),
                rgba(0,0,0,.58) 48%,
                rgba(0,0,0,.30)
            ),
            linear-gradient(
                0deg,
                rgba(0,0,0,.78),
                transparent
            );
    }
}

/* ========================================================= */
/* =============== IPTV PREMIUM — VISUAL V2 ================ */
/* ========================================================= */

.iptv-hero{
    position:relative;
    overflow:hidden;
    margin:42px 0 20px;
    padding:48px 42px 38px;
    border:1px solid rgba(255,255,255,.09);
    border-radius:26px;
    background:
        radial-gradient(
            circle at 88% 15%,
            rgba(229,9,20,.30),
            transparent 32%
        ),
        radial-gradient(
            circle at 5% 100%,
            rgba(120,0,8,.20),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,.065),
            rgba(255,255,255,.012)
        );
    box-shadow:
        0 25px 70px rgba(0,0,0,.34),
        inset 0 1px 0 rgba(255,255,255,.025);
}

.iptv-hero::before{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    right:-150px;
    top:-190px;
    border-radius:50%;
    background:rgba(229,9,20,.30);
    filter:blur(65px);
    pointer-events:none;
}

.iptv-hero::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(229,9,20,.95),
            transparent
        );
    opacity:.75;
}

.iptv-kicker{
    position:relative;
    z-index:2;
    margin-bottom:14px;
    color:var(--red);
    font-size:10px;
    font-weight:900;
    letter-spacing:3px;
    text-transform:uppercase;
}

.iptv-hero h1{
    position:relative;
    z-index:2;
    margin:0;
    color:#fff;
    font-size:clamp(48px,7vw,78px);
    line-height:.92;
    font-weight:900;
    letter-spacing:-4px;
}

.iptv-hero h1 span{
    color:var(--red);
}

.iptv-hero p{
    position:relative;
    z-index:2;
    max-width:650px;
    margin:22px 0 30px;
    color:rgba(255,255,255,.54);
    font-size:14px;
    line-height:1.7;
}

.iptv-hero-meta{
    position:relative;
    z-index:2;
    display:flex;
    align-items:center;
    gap:22px;
}

.hero-meta-item{
    display:flex;
    flex-direction:column;
    gap:4px;
}

.hero-meta-item strong{
    color:#fff;
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
}

.hero-meta-item small{
    color:rgba(255,255,255,.32);
    font-size:8px;
    font-weight:800;
    letter-spacing:2px;
}

.hero-meta-line{
    width:1px;
    height:28px;
    background:rgba(255,255,255,.10);
}

.hero-live{
    display:flex;
    align-items:center;
    gap:7px;
    margin-left:auto;
    padding:8px 11px;
    border:1px solid rgba(229,9,20,.30);
    border-radius:9px;
    background:rgba(229,9,20,.08);
    color:rgba(255,255,255,.70);
    font-size:9px;
    font-weight:900;
    letter-spacing:1.5px;
}

.hero-live i{
    width:6px;
    height:6px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 10px rgba(229,9,20,.85);
    animation:iptvPulse 1.5s infinite;
}

@keyframes iptvPulse{
    0%,100%{
        opacity:1;
        transform:scale(1);
    }
    50%{
        opacity:.45;
        transform:scale(.72);
    }
}

.status{
    display:flex;
    align-items:center;
    min-height:22px;
    margin:0 0 12px;
    padding:0;
    color:rgba(255,255,255,.30);
    font-size:10px;
    font-weight:700;
    letter-spacing:.8px;
}

.secao{
    position:relative;
}

.secao h2{
    display:flex;
    align-items:center;
    gap:10px;
    margin:0 0 20px;
    font-size:20px;
    letter-spacing:-.4px;
}

.secao h2::before{
    content:"";
    width:3px;
    height:19px;
    border-radius:3px;
    background:var(--red);
    box-shadow:0 0 12px rgba(229,9,20,.45);
}

.categorias-iptv{
    padding-bottom:17px;
}

.categoria-btn{
    position:relative;
    overflow:hidden;
}

.categoria-btn::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:2px;
    background:var(--red);
    transform:scaleX(0);
    transition:.2s ease;
}

.categoria-btn:hover::after,
.categoria-btn.ativo::after{
    transform:scaleX(1);
}

.canais{
    grid-template-columns:repeat(auto-fill,minmax(205px,1fr));
    gap:18px;
}

.canal{
    min-height:205px;
    padding:20px;
    border-radius:21px;
}

.canal::after{
    height:2px;
}

.canal .nome::before{
    content:"AO VIVO";
    display:block;
    width:max-content;
    margin-bottom:9px;
    padding:4px 7px;
    border-radius:5px;
    background:rgba(229,9,20,.13);
    border:1px solid rgba(229,9,20,.25);
    color:rgba(255,255,255,.65);
    font-size:7px;
    font-weight:900;
    letter-spacing:1.4px;
}

.logo-canal{
    padding:22px;
    opacity:.58;
}

.canal:hover .logo-canal{
    opacity:.76;
}

.player-area{
    position:relative;
    border-color:rgba(229,9,20,.16);
}

.player-area::before{
    content:"";
    position:absolute;
    width:240px;
    height:140px;
    right:-90px;
    top:-80px;
    border-radius:50%;
    background:rgba(229,9,20,.14);
    filter:blur(55px);
    pointer-events:none;
}

.fechar{
    position:relative;
    z-index:2;
}

@media(max-width:700px){

    .iptv-hero{
        margin:24px 0 18px;
        padding:32px 22px 27px;
        border-radius:21px;
    }

    .iptv-kicker{
        margin-bottom:11px;
        font-size:9px;
        letter-spacing:2.4px;
    }

    .iptv-hero h1{
        font-size:clamp(42px,14vw,58px);
        letter-spacing:-3px;
    }

    .iptv-hero p{
        margin:17px 0 23px;
        font-size:13px;
        line-height:1.6;
    }

    .iptv-hero-meta{
        gap:13px;
    }

    .hero-meta-line{
        height:23px;
    }

    .hero-live{
        padding:7px 8px;
        font-size:8px;
    }

    .canais{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:12px;
    }

    .canal{
        min-height:175px;
        padding:14px;
        border-radius:18px;
    }

    .logo-canal{
        padding:15px;
        border-radius:18px;
    }

    .canal .nome::before{
        margin-bottom:7px;
        font-size:6px;
    }
}

</style>

<body>

<header class="topo">
    <a class="logo" href="/">LUKAFILMES</a>
    <span class="titulo">IPTV</span>
    <input
        id="buscaIPTV"
        class="busca"
        type="search"
        placeholder="Buscar canal..."
        autocomplete="off">
</header>

<main class="conteudo">

    <section class="iptv-hero">
        <div class="iptv-kicker">LUKAFILMES ORIGINAL</div>
        <h1>IPTV <span>AO VIVO</span></h1>
        <p>
            Assista aos seus canais favoritos em um só lugar,
            com acesso rápido e reprodução em tela cheia.
        </p>

        <div class="iptv-hero-meta">
            <div class="hero-meta-item">
                <strong id="heroStatus">CANAIS</strong>
                <small>TRANSMISSÃO</small>
            </div>

            <div class="hero-meta-line"></div>

            <div class="hero-meta-item">
                <strong>HD</strong>
                <small>QUALIDADE</small>
            </div>

            <div class="hero-live">
                <i></i>
                AO VIVO
            </div>
        </div>
    </section>

    <div id="statusIPTV" class="status">
        Carregando canais...
    </div>

    <section id="playerArea" class="player-area">
        <div class="player-topo">
            <div id="playerTitulo" class="player-titulo"></div>
            <button id="fecharPlayer" class="fechar">Fechar</button>
        </div>

        <div class="player">
            <div class="live-indicador">AO VIVO</div>
            <video
                id="playerIPTV"
                controls
                playsinline
                autoplay
                preload="metadata"
                style="width:100%;height:100%;background:#000;">
            </video>

            <iframe
                id="playerIframeIPTV"
                title="Player IPTV"
                allow="autoplay; encrypted-media; picture-in-picture"
                allowfullscreen
                style="display:none;width:100%;height:100%;border:0;background:#000;">
            </iframe>
        </div>
    </section>

    <section class="secao">
        <h2>📺 Canais</h2>
        <div id="categoriasIPTV" class="categorias-iptv"></div>
        <div id="listaCanais" class="canais">
            <div class="aviso">Carregando...</div>
        </div>

function escapar(valor){
    return String(valor ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
}

function logoFallback(){
    return 'data:image/svg+xml;charset=UTF-8,' +
        encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150">' +
            '<rect width="100%" height="100%" fill="#111"/>' +
            '<text x="50%" y="50%" fill="#777" font-size="22" text-anchor="middle" dominant-baseline="middle">LUKAFILMES</text>' +
            '</svg>'
        );
}

function obterLogo(item){
    return item?.poster || item?.logo ||
           item?.teams?.home?.logo ||
           logoFallback();
}

function obterEmbed(item){
    if(!Array.isArray(item?.embeds)) return '';

    const embed = item.embeds.find(x =>
        x && typeof x.embed_url === 'string' && x.embed_url.trim()
    );

    return embed ? embed.embed_url.trim() : '';
}

async function abrirPlayer(item){
    const canaisEróticos = {
        "Venus Hot": "https://streambetter.shop/canal/venus-hot",
        "Sextreme": "https://streambetter.shop/canal/sextreme",
        "Sexy Hot 2": "https://streambetter.shop/canal/sexy-hot-2",
        "Playboy TV": "https://streambetter.shop/canal/playboy-tv",
        "Dream Sex": "https://streambetter.shop/canal/dream-sex"
    };

    const nomeCanal = item?.name || item?.title || "";

    const iframe = document.getElementById("playerIframeIPTV");
    const player = document.getElementById("playerIPTV");
    const playerArea = document.getElementById("playerArea");
    const playerTitulo = document.getElementById("playerTitulo");

    if (!playerArea || !playerTitulo) {
        alert("Player IPTV não encontrado.");
        return;
    }

    if (window.lukaHlsPlayer) {
        try { window.lukaHlsPlayer.destroy(); } catch(e) {}
        window.lukaHlsPlayer = null;
    }

    if (iframe) {
        iframe.src = "";
        iframe.style.display = "none";
    }

    if (player) {
        player.pause();
        player.removeAttribute("src");
        player.load();
        player.style.display = "none";
    }

    if (canaisEróticos[nomeCanal]) {
        if (!iframe) {
            alert("Player iframe não encontrado.");
            return;
        }

        iframe.src = canaisEróticos[nomeCanal];
        iframe.style.display = "block";
        playerTitulo.textContent = nomeCanal;
        playerArea.classList.add("ativo");

        window.scrollTo({
            top: playerArea.offsetTop - 10,
            behavior: "smooth"
        });

        return;
    }

    const streamId =
        item?.stream_id ??
        item?.streamId ??
        item?.xtream_stream_id ??
        "";

    if (/^\d+$/.test(String(streamId))) {
        if (!player) {
            alert("Player de vídeo não encontrado.");
            return;
        }

        const hlsUrl =
            "/api/xtream/iptv/hls/" +
            encodeURIComponent(String(streamId));

        player.style.display = "block";
        playerTitulo.textContent = nomeCanal || "IPTV";
        playerArea.classList.add("ativo");

        if (window.Hls && Hls.isSupported()) {
            const hls = new Hls({
                enableWorker: true,
                lowLatencyMode: true
            });

            window.lukaHlsPlayer = hls;

            hls.loadSource(hlsUrl);
            hls.attachMedia(player);

            hls.on(Hls.Events.MANIFEST_PARSED, function() {
                player.play().catch(() => {});
            });

            hls.on(Hls.Events.ERROR, function(event, data) {
                console.error("[LUKAFILMES IPTV XTREAM]", data);

                if (data && data.fatal) {
                    try { hls.destroy(); } catch(e) {}
                    window.lukaHlsPlayer = null;

                    alert("Não foi possível iniciar a transmissão deste canal.");
                }
            });

        } else if (player.canPlayType("application/vnd.apple.mpegurl")) {
            player.src = hlsUrl;
            player.play().catch(() => {});
        } else {
            alert("Seu navegador não suporta reprodução HLS.");
            return;
        }

        window.scrollTo({
            top: playerArea.offsetTop - 10,
            behavior: "smooth"
        });

        return;
    }

    const embedUrl = obterEmbed(item);

    if (embedUrl && iframe) {
        iframe.src = embedUrl;
        iframe.style.display = "block";

        playerTitulo.textContent = nomeCanal || "IPTV";
        playerArea.classList.add("ativo");

        window.scrollTo({
            top: playerArea.offsetTop - 10,
            behavior: "smooth"
        });

        return;
    }

    alert("Este canal não possui uma transmissão válida.");
}

let lukaQRCodePromise = null;

function carregarQRCodeLuka() {

    if (typeof QRCode !== "undefined") {
        return Promise.resolve();
    }

    if (lukaQRCodePromise) {
        return lukaQRCodePromise;
    }

    lukaQRCodePromise = new Promise(function(resolve, reject) {

        const script = document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";

        script.onload = function() {
            resolve();
        };

        script.onerror = function() {
            lukaQRCodePromise = null;
            reject(new Error("Não foi possível carregar o QR Code."));
        };

        document.head.appendChild(script);
    });

    return lukaQRCodePromise;
}

function criarCard(item){

    const div = document.createElement('div');
    div.className = 'canal';

    const nome = item.title || item.name || 'Canal';
    const categoria = item.category || item.competition || 'IPTV';
    const logo = obterLogo(item);

    div.innerHTML = `
        <img
            class="logo-canal"
            src="${escapar(logo)}"
            alt="${escapar(nome)}"
            onerror="this.src='${escapar(logoFallback())}'">
        <div class="nome">${escapar(nome)}</div>
        <div class="categoria">${escapar(categoria)}</div>
    `;

    div.addEventListener('click', async () => {
        try {
            const resposta = await fetch("/api/acesso-assistir", {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });

            const acesso = await resposta.json();

            console.log("[LUKAFILMES IPTV] Resultado do acesso:", acesso);

            if (acesso.motivo === "nao_logado") {
                const retorno =
                    window.location.pathname +
                    window.location.search;

                window.location.href =
                    "/cadastro?retorno=" +
                    encodeURIComponent(retorno);

                return;
            }

            /*
             * Acesso pago, admin ou isento:
             * mantém acesso normal.
             */
            if (acesso.permitido && !acesso.teste_gratis) {
                abrirPlayer(item);
                return;
            }

            /*
             * Conta recém-criada:
             * libera o canal por 1 minuto, sem contador visível.
             */
            if (acesso.teste_gratis) {
                if (iniciarAcessoIPTV1Minuto()) {
                    abrirPlayer(item);
                } else {
                    await mostrarPagamentoIPTV({
                        permitido: false,
                        logado: true,
                        motivo: "acesso_1min_expirado",
                        mensagem: "Seu acesso temporário terminou."
                    });
                }
                return;
            }

            if (!acesso.permitido) {
                if (
                    acesso.logado &&
                    acesso.motivo === "expirado"
                ) {
                    if (iniciarAcessoIPTV1Minuto()) {
                        abrirPlayer(item);
                    } else {
                        await mostrarPagamentoIPTV(acesso);
                    }
                    return;
                }

                await mostrarPagamentoIPTV(acesso);
                return;
            }

            abrirPlayer(item);

        } catch (erro) {
            console.error(
                "[LUKAFILMES IPTV] Erro ao verificar acesso:",
                erro
            );

            alert(
                "Não foi possível verificar seu acesso. Tente novamente."
            );
        }
    });

    return div;
}



let lukaIPTVAcesso1MinutoAtivo = false;
let lukaIPTVAcesso1MinutoUsado = false;
let lukaIPTVTimer1Minuto = null;

function iniciarAcessoIPTV1Minuto() {

    if (lukaIPTVAcesso1MinutoAtivo || lukaIPTVAcesso1MinutoUsado) {
        return false;
    }

    lukaIPTVAcesso1MinutoAtivo = true;
    lukaIPTVAcesso1MinutoUsado = true;

    console.log("[LUKAFILMES IPTV] Acesso temporário de 1 minuto iniciado.");

    if (lukaIPTVTimer1Minuto) {
        clearTimeout(lukaIPTVTimer1Minuto);
    }

    lukaIPTVTimer1Minuto = setTimeout(async function() {

        lukaIPTVTimer1Minuto = null;
        lukaIPTVAcesso1MinutoAtivo = false;

        if (window.LukaAcessoModerno &&
            typeof window.LukaAcessoModerno.bloquearPlayer === "function") {

            window.LukaAcessoModerno.bloquearPlayer();

        } else {

            const iframe = document.getElementById("playerIframeIPTV");
            const video = document.getElementById("playerIPTV");
            const area = document.getElementById("playerArea");

            if (window.lukaHlsPlayer) {
                try { window.lukaHlsPlayer.destroy(); } catch(e) {}
                window.lukaHlsPlayer = null;
            }

            if (video) {
                try { video.pause(); } catch(e) {}
                video.removeAttribute("src");
                video.load();
                video.style.display = "none";
            }

            if (iframe) {
                iframe.src = "";
                iframe.style.display = "none";
            }

            if (area) {
                area.classList.remove("ativo");
            }
        }

        console.log("[LUKAFILMES IPTV] Acesso temporário encerrado.");

        await mostrarPagamentoIPTV({
            permitido: false,
            logado: true,
            motivo: "acesso_1min_expirado",
            mensagem: "Seu acesso temporário terminou."
        });

    }, 60000);

    return true;
}

function classificarCategoria(item){
    const nome = String(item.title || item.name || '').toLowerCase().trim();

    if(/^24h\s/.test(nome)){
        return '24 Horas';
    }

    if(
        /fortaleza x|portland thorns|san francisco giants|new york giants/.test(nome) ||
        /espn|sportv|sportv|premiere|combate|ufc|sports|sportynet|sporty|eleven|sporttv|benfica tv|canal 11|a bola|xsports/.test(nome)
    ){
        return 'Esportes';
    }

    if(
        /cnn|news|globo news|band news/.test(nome)
    ){
        return 'Notícias';
    }

    if(
        /cartoon|cartoonito|discovery kids|gloob|pica pau|dragon ball|naruto|simpsons|chaves|friends|todo mundo odeia/.test(nome)
    ){
        return 'Infantil';
    }

    if(
        /animal planet|discovery channel|discovery h&h|discovery id|discovery science|discovery theater|discovery turbo|discovery world|history|history 2|t.l.c|tlc/.test(nome)
    ){
        return 'Documentários';
    }

    if(
        /hbo|cinemax|megapix|telecine|tcm|tnt$|space|sony channel|studio universal|universal|warner|amc|axn|star channel/.test(nome)
    ){
        return 'Filmes';
    }

    if(
        /tnt series|tnt novelas|globo novelas|multishow|gnt|mtv|off|food network|hgtv|master chef|cazetv/.test(nome)
    ){
        return 'Variedades';
    }

    if(
        /disney plus|paramount plus|prime video|max -|prime video/.test(nome)
    ){
        return 'Streaming';
    }

    if(
        /globo |band |record |sbt |cultura|aparecida|canção nova|rede vida|tv pai eterno/.test(nome)
    ){
        return 'Canais Abertos';
    }

    return 'Outros';
}

function renderizarCategorias(lista){
    console.log('[CATEGORIAS IPTV] executando:', lista.length, 'canais');
    const area = document.getElementById('categoriasIPTV');
    if(!area) return;

    const categorias = [...new Set(
        lista
            .map(item => String(item.category || item.competition || 'IPTV').trim())
            .filter(Boolean)
    )].sort((a,b) => a.localeCompare(b, 'pt-BR'));

    area.innerHTML = '';

    const todas = document.createElement('button');
    todas.type = 'button';
    todas.className = 'categoria-btn ativo';
    todas.textContent = 'Todos';
    todas.dataset.categoria = '__todos__';
    area.appendChild(todas);

    categorias.forEach(categoria => {
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'categoria-btn';
        botao.textContent = categoria;
        botao.dataset.categoria = categoria;
        area.appendChild(botao);
    });

    area.querySelectorAll('.categoria-btn').forEach(botao => {
        botao.addEventListener('click', () => {
            area.querySelectorAll('.categoria-btn')
                .forEach(b => b.classList.remove('ativo'));

            botao.classList.add('ativo');

            const categoriaSelecionada = botao.dataset.categoria;

            if(categoriaSelecionada === '__todos__'){
                renderizarCanais(ordenarPorCategoria(canais));
                return;
            }

            renderizarCanais(
                canais.filter(item =>
                    String(
                        item.category ||
                        item.competition ||
                        'IPTV'
                    ).trim() === categoriaSelecionada
                )
            );
        });
    });
}

function normalizarCategoria(item){
    const id = String(item?.id || '').toLowerCase();
    const nome = String(
        item?.title ||
        item?.name ||
        ''
    ).toLowerCase();

    const texto = id + ' ' + nome;

    if(
        /nick|cartoon|kids|infantil|gospelcartoon|sbckids/.test(texto)
    ){
        return 'Infantil';
    }

    if(
        /anime|otaku/.test(texto)
    ){
        return 'Anime';
    }

    if(
        /trace|kpop|musica|música|music/.test(texto)
    ){
        return 'Música';
    }

    if(
        /gospel|despertar/.test(texto)
    ){
        return 'Gospel';
    }

    if(
        /news|not[ií]cia|noticias|sbtnews|recordnews|metropolitano/.test(texto)
    ){
        return 'Notícias';
    }

    if(
        /filme|cinema|cine|pipoca|sess[aã]o trash|sony one|sonyone|rakuten/.test(texto)
    ){
        return 'Filmes';
    }

    if(
        /chaves|s[eé]ries|series|classique|retro/.test(texto)
    ){
        return 'Séries e Clássicos';
    }

    if(
        /sbt|band|redetv|rede tv|cultura|tv brasil|tvbrasil|tvers|araruna|awtv|stz|tcm|folha|tvi portugal|tvportugal/.test(texto)
    ){
        return 'TV Aberta';
    }

    if(
        /bem mais|bemmais|mega one|megaonetv|fora t[eé]dio|foratedio|channel|studio|entretenimento/.test(texto)
    ){
        return 'Entretenimento';
    }

    if(
        /portugal|internacional|my time|mytime|lg channels|lgchannels/.test(texto)
    ){
        return 'Internacionais';
    }

    return 'Outros';
}

const ORDEM_CATEGORIAS = [
    'TV Aberta',
    'Notícias',
    'Filmes',
    'Séries e Clássicos',
    'Infantil',
    'Anime',
    'Gospel',
    'Música',
    'Entretenimento',
    'Internacionais',
    'Outros'
];

function ordenarPorCategoria(lista){
    return [...lista].sort((a, b) => {
        const ca = normalizarCategoria(a);
        const cb = normalizarCategoria(b);

        const ia = ORDEM_CATEGORIAS.indexOf(ca);
        const ib = ORDEM_CATEGORIAS.indexOf(cb);

        if(ia !== ib) return ia - ib;

        return String(a.title || a.name || '')
            .localeCompare(
                String(b.title || b.name || ''),
                'pt-BR'
            );
    });
}

    const termo = this.value.trim().toLowerCase();

    if(!termo){
        renderizarCanais(canais);
        return;
    }

    const filtrar = item => {
        const texto = [
            item.title,
            item.name,
            item.description,
            item.category,
            item.competition,
            item.teams?.home?.name,
            item.teams?.away?.name
        ].filter(Boolean).join(' ').toLowerCase();

        return texto.includes(termo);
    };

    renderizarCanais(canais.filter(filtrar));
});

document.getElementById('fecharPlayer').addEventListener('click', () => {
    if(window.lukaHlsPlayer){
        try{
            window.lukaHlsPlayer.destroy();
        }catch(e){}
        window.lukaHlsPlayer = null;
    }

    const player = document.getElementById('playerIPTV');

    player.pause();
    player.removeAttribute('src');
    player.load();

    document.getElementById('playerArea').classList.remove('ativo');
});

carregarIPTV();
</script>

<script id="lukafilmes-acesso-moderno-v1">
(function(){
"use strict";

window.LukaAcessoModerno = {

overlay:null,
timer:null,
expira:null,
pagamentoAberto:false,

criar:function(titulo,descricao){

if(this.overlay)return this.overlay;

var o=document.createElement("div");
o.className="lukaAcessoModal";
o.innerHTML=
"<div class="lukaAcessoCard">"+
"<div class="lukaAcessoKicker">LUKAFILMES</div>"+
"<h2>"+(titulo||"Acesso ao LUKAFILMES")+"</h2>"+
"<p>"+(descricao||"Realize o pagamento para continuar assistindo.")+"</p>"+

"<div class="lukaAcessoPixBox" id="lukaAcessoPixBox">"+
"<div class="lukaAcessoQr" id="lukaAcessoQr"></div>"+
"<textarea class="lukaAcessoPix" id="lukaAcessoPix" readonly></textarea>"+
"<button class="lukaAcessoBtn" id="lukaAcessoCopiar">COPIAR PIX</button>"+
"<div class="lukaAcessoStatus" id="lukaAcessoStatus">Preparando pagamento...</div>"+
"</div>"+
"</div>";

document.body.appendChild(o);
this.overlay=o;
return o;
},

bloquearPlayer:function(){

var iframe=document.getElementById("playerIframeIPTV");
var video=document.getElementById("playerIPTV");
var area=document.getElementById("playerArea");

if(window.lukaHlsPlayer){
try{window.lukaHlsPlayer.destroy();}catch(e){}
window.lukaHlsPlayer=null;
}

if(video){
try{video.pause();}catch(e){}
video.removeAttribute("src");
video.load();
video.style.display="none";
}

if(iframe){
iframe.src="";
iframe.style.display="none";
}

if(area){
area.classList.remove("ativo");
}

console.log("[LUKAFILMES IPTV] Player bloqueado.");

},

abrirPagamento:async function(){

if(this.pagamentoAberto)return;

this.pagamentoAberto=true;

var o=this.criar(
"Acesso bloqueado",
"Continue no LUKAFILMES realizando o pagamento do seu acesso."
);

o.classList.add("ativo");

this.bloquearPlayer();

var box=document.getElementById("lukaAcessoPixBox");
var status=document.getElementById("lukaAcessoStatus");

if(box)box.style.display="block";

try{

var resposta=await fetch("/api/pagamentos/criar",{
method:"POST",
headers:{"Content-Type":"application/json"},
credentials:"same-origin",
body:JSON.stringify({renovacao:false})
});

var dados=await resposta.json();

if(!resposta.ok||!dados||!dados.sucesso){
throw new Error(dados&&dados.mensagem?dados.mensagem:"Não foi possível preparar o pagamento.");
}

var pix=String(dados.pix||"").trim();

if(!pix)throw new Error("PIX não foi disponibilizado.");

document.getElementById("lukaAcessoPix").value=pix;

if(typeof QRCode==="undefined"){
await new Promise(function(resolve,reject){
var sc=document.createElement("script");
sc.src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js";
sc.onload=resolve;
sc.onerror=reject;
document.head.appendChild(sc);
});
}

new QRCode(document.getElementById("lukaAcessoQr"),{
text:pix,width:190,height:190
});

document.getElementById("lukaAcessoCopiar").onclick=async function(){

try{
await navigator.clipboard.writeText(pix);
}catch(e){
var a=document.getElementById("lukaAcessoPix");
a.focus();
a.select();
document.execCommand("copy");
}

this.textContent="PIX COPIADO";
setTimeout(()=>this.textContent="COPIAR PIX",2000);

};

if(status)status.textContent="Escaneie o QR Code ou copie o PIX para realizar o pagamento.";

}catch(e){

console.error("[LUKAFILMES] Pagamento moderno:",e);

if(status)status.textContent=e.message||"Erro ao preparar pagamento.";

}

}

};

})();
</script>
