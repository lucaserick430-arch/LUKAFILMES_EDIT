<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
}

.topo{
    position:sticky;
    top:0;
    z-index:1000;
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 16px;
    background:rgba(8,8,8,.97);

}

.logo{
    color:#e50914;
    font-size:22px;
    font-weight:900;
    text-decoration:none;

}

.titulo{
    font-size:18px;
    font-weight:700;
}

.busca{
    margin-left:auto;
    width:min(320px,45vw);
    padding:9px 12px;
    border-radius:7px;
    border:1px solid #333;
    outline:none;
    background:#151515;
    color:#fff;
}

.busca::placeholder{

}

.conteudo{

}

.status{
    margin-bottom:15px;
    color:#aaa;
    font-size:14px;
}

.secao{

}

.secao h2{
    margin:0 0 12px;

}


.categorias-iptv{

    overflow-x:auto;
    padding:4px 2px 14px;
    margin-bottom:8px;

.categorias-iptv::-webkit-scrollbar{

.categoria-btn.ativo{

.canais{

.canal{

.logo-canal{

.nome{

.categoria{

.player-area{

.player-topo{

    margin-bottom:10px;
}

.player-titulo{
    font-size:18px;
    font-weight:700;

.fechar{
    border:0;
    border-radius:6px;
    padding:8px 12px;
    background:#252525;
    color:#fff;
    cursor:pointer;
}

.player{
    width:100%;

    min-height:300px;
    background:#000;
    border-radius:9px;
    overflow:hidden;
}

.player iframe{
    width:100%;
    height:100%;
    border:0;
}

.aviso{
    padding:20px;
    border-radius:8px;
    background:#111;
    color:#999;

.erro{

.player{

.player video::-webkit-media-controls-timeline{

.player video::-webkit-media-controls-current-time-display,
.player video::-webkit-media-controls-time-remaining-display{

function escapar(valor){
    return String(valor ?? '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');

            '</svg>'

}

function obterLogo(item){
    return item?.poster || item?.logo ||
           item?.teams?.home?.logo ||
           logoFallback();
}

function obterEmbed(item){
    if(!Array.isArray(item?.embeds)) return '';

    const embed = item.embeds.find(x =>
        x && typeof x.embed_url === 'string' && x.embed_url.trim()
    );

    return embed ? embed.embed_url.trim() : '';
}

let lukaQRCodePromise = null;

function carregarQRCodeLuka() {

    if (typeof QRCode !== "undefined") {
        return Promise.resolve();
    }

    if (lukaQRCodePromise) {
        return lukaQRCodePromise;
    }

    lukaQRCodePromise = new Promise(function(resolve, reject) {

        const script = document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";

        script.onload = function() {
            resolve();
        };

        script.onerror = function() {
            lukaQRCodePromise = null;
            reject(new Error("Não foi possível carregar o QR Code."));
        };

        document.head.appendChild(script);
    });

    return lukaQRCodePromise;
}

                        },

                    );
                };

        );

    } catch (erro) {

        );

        );

}

function classificarCategoria(item){
    const nome = String(item.title || item.name || '').toLowerCase().trim();

    if(/^24h\s/.test(nome)){
        return '24 Horas';
    }

    if(
        /fortaleza x|portland thorns|san francisco giants|new york giants/.test(nome) ||
        /espn|sportv|sportv|premiere|combate|ufc|sports|sportynet|sporty|eleven|sporttv|benfica tv|canal 11|a bola|xsports/.test(nome)
    ){
        return 'Esportes';
    }

    if(
        /cnn|news|globo news|band news/.test(nome)
    ){
        return 'Notícias';
    }

    if(
        /cartoon|cartoonito|discovery kids|gloob|pica pau|dragon ball|naruto|simpsons|chaves|friends|todo mundo odeia/.test(nome)
    ){
        return 'Infantil';
    }

    if(
        /animal planet|discovery channel|discovery h&h|discovery id|discovery science|discovery theater|discovery turbo|discovery world|history|history 2|t.l.c|tlc/.test(nome)
    ){
        return 'Documentários';
    }

    if(
        /hbo|cinemax|megapix|telecine|tcm|tnt$|space|sony channel|studio universal|universal|warner|amc|axn|star channel/.test(nome)
    ){
        return 'Filmes';
    }

    if(
        /tnt series|tnt novelas|globo novelas|multishow|gnt|mtv|off|food network|hgtv|master chef|cazetv/.test(nome)
    ){
        return 'Variedades';
    }

    if(
        /disney plus|paramount plus|prime video|max -|prime video/.test(nome)
    ){
        return 'Streaming';
    }

    if(
        /globo |band |record |sbt |cultura|aparecida|canção nova|rede vida|tv pai eterno/.test(nome)
    ){
        return 'Canais Abertos';
    }

    return 'Outros';
}

function renderizarCategorias(lista){
    console.log('[CATEGORIAS IPTV] executando:', lista.length, 'canais');
    const area = document.getElementById('categoriasIPTV');
    if(!area) return;

    const categorias = [...new Set(
        lista
            .map(item => String(item.category || item.competition || 'IPTV').trim())
            .filter(Boolean)
    )].sort((a,b) => a.localeCompare(b, 'pt-BR'));

    area.innerHTML = '';

    const todas = document.createElement('button');
    todas.type = 'button';
    todas.className = 'categoria-btn ativo';
    todas.textContent = 'Todos';
    todas.dataset.categoria = '__todos__';
    area.appendChild(todas);

    categorias.forEach(categoria => {
        const botao = document.createElement('button');
        botao.type = 'button';
        botao.className = 'categoria-btn';
        botao.textContent = categoria;
        botao.dataset.categoria = categoria;
        area.appendChild(botao);
    });

    area.querySelectorAll('.categoria-btn').forEach(botao => {
        botao.addEventListener('click', () => {
            area.querySelectorAll('.categoria-btn')
                .forEach(b => b.classList.remove('ativo'));

            botao.classList.add('ativo');

            const categoriaSelecionada = botao.dataset.categoria;

            if(categoriaSelecionada === '__todos__'){
                renderizarCanais(canais);
                return;
            }

            renderizarCanais(
                canais.filter(item =>
                    String(
                        item.category ||
                        item.competition ||
                        'IPTV'
                    ).trim() === categoriaSelecionada
                )
            );
        });
    });
}


function renderizarCanais(lista){
    const area = document.getElementById('listaCanais');
    area.innerHTML = '';

    if(!lista.length){
        area.innerHTML =
            '<div class="aviso">Nenhum canal encontrado.</div>';
        return;
    }

    lista.forEach(item => area.appendChild(criarCard(item)));
}

async function carregarIPTV(){
    const status = document.getElementById('statusIPTV');

    try{
        const [respostaCanais, respostaEsportes] =
            await Promise.all([
                fetch(API + '/channels', {
                    cache:'no-store'
                }),
                fetch(API + '/sports?status=live', {
                    cache:'no-store'
                })
            ]);

        if(!respostaCanais.ok){
            throw new Error(
                'Erro HTTP ' + API + '/channels: ' +
                respostaCanais.status
            );
        }

        if(!respostaEsportes.ok){
            throw new Error(
                'Erro HTTP ' + API + '/sports?status=live: ' +
                respostaEsportes.status
            );
        }

        const jsonCanais = await respostaCanais.json();
        const jsonEsportes = await respostaEsportes.json();

        const listaCanaisAPI = Array.isArray(jsonCanais?.data)
            ? jsonCanais.data
            : [];

        const listaEsportesAPI = Array.isArray(jsonEsportes?.data)
            ? jsonEsportes.data
            : [];

        const canaisAPI = listaCanaisAPI.map(item => ({
            id: item.id || '',
            title: item.name || 'Canal',
            name: item.name || 'Canal',
            description: item.description || '',
            category: item.category || 'TV',
            logo: item.logo_url || '',
            embeds: Array.isArray(item.embeds) ? item.embeds : [],
            epg: item.epg || null,
            stream_type: 'live'
        }));

        const esportesAPI = listaEsportesAPI.map(item => ({
            id: item.id || '',
            title: item.title || 'Evento ao vivo',
            name: item.title || 'Evento ao vivo',
            description: item.description || '',
            category: item.category || 'Esportes',
            competition: item.competition || '',
            logo: item.poster || item.teams?.home?.logo || '',
            teams: item.teams || null,
            embeds: Array.isArray(item.embeds) ? item.embeds : [],
            start_time: item.start_time || '',
            start_timestamp: item.start_timestamp || '',
            status: item.status || 'live',
            stream_type: 'live'
        }));

        // Os 5 canais adultos permanecem intocados.
        canais = [
            ...canaisAPI,
            ...esportesAPI,
            ...canaisManuais
        ];

        renderizarCategorias(canais);
        renderizarCanais(canais);
        status.textContent = `${canais.length} canais carregados`;

    }catch(erro){
        console.error('IPTV:', erro);

        status.innerHTML =
            '<span class="erro">Não foi possível carregar os canais.</span>';

        document.getElementById('listaCanais').innerHTML =
            '<div class="aviso erro">Erro ao consultar a API IPTV.</div>';
    }
}

document.getElementById('buscaIPTV').addEventListener('input', function(){
    const termo = this.value.trim().toLowerCase();

    if(!termo){
        renderizarCanais(canais);
        return;
    }

    const filtrar = item => {
        const texto = [
            item.title,
            item.name,
            item.description,
            item.category,
            item.competition,
            item.teams?.home?.name,
            item.teams?.away?.name
        ].filter(Boolean).join(' ').toLowerCase();

        return texto.includes(termo);
    };

    renderizarCanais(canais.filter(filtrar));
});

document.getElementById('fecharPlayer').addEventListener('click', () => {
    if(window.lukaHlsPlayer){
