<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUKAFILMES - Séries</title>

<link rel="stylesheet" href="../css/style.css">

<style>
body {
    margin: 0;
    background: #050505;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.topo-series {
    max-width: 1200px;
    margin: auto;
    padding: 30px 20px;
}

.voltar {
    display: inline-block;
    padding: 11px 18px;
    border-radius: 25px;
    background: rgba(255,255,255,.08);
    color: #fff;
    text-decoration: none;
    margin-bottom: 35px;
}

.voltar:hover {
    background: #e50914;
}

.titulo-series {
    text-align: center;
    font-size: clamp(35px, 5vw, 55px);
    margin: 10px 0;
    font-weight: 900;
}

.subtitulo-series {
    text-align: center;
    color: #aaa;
    margin-bottom: 45px;
}

.categoria {
    margin-bottom: 45px;
}

.categoria h2 {
    font-size: 25px;
    margin-bottom: 18px;
    border-left: 4px solid #e50914;
    padding-left: 12px;
}

.lista-series {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 20px;
}

.card-serie {
    background: #111;
    border-radius: 14px;
    overflow: hidden;
    transition: .25s;
}

.card-serie:hover {
    transform: translateY(-7px);
    box-shadow: 0 15px 40px rgba(229,9,20,.25);
}

.card-serie img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
}

.card-serie-info {
    padding: 12px;
}

.card-serie h3 {
    margin: 0 0 7px;
    font-size: 16px;
}

.card-serie p {
    margin: 0;
    color: #aaa;
    font-size: 13px;
}

@media (max-width: 600px) {
    .lista-series {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
    }

    .categoria h2 {
        font-size: 21px;
    }
}
</style>
</head>

<body>

<main class="topo-series">

    <a href="../index.html" class="voltar">
        ← Voltar
    </a>

    <h1 class="titulo-series">
        📺 Séries
    </h1>

    <p class="subtitulo-series">
        Descubra séries populares, novidades e muito mais.
    </p>

    <section class="categoria">
        <h2>🔥 Séries Populares</h2>

        <div class="lista-series" id="populares">
        </div>
    </section>

    <section class="categoria">
        <h2>⭐ Mais Bem Avaliadas</h2>

        <div class="lista-series" id="avaliadas">
        </div>
    </section>

    <section class="categoria">
        <h2>🆕 Lançamentos</h2>

        <div class="lista-series" id="lancamentos">
        </div>
    </section>

</main>

<script>

function criarCard(serie) {

    const card = document.createElement("div");

    card.className = "card-serie";

    const imagem = serie.poster_path
        ? "https://image.tmdb.org/t/p/w500" + serie.poster_path
        : "";

    card.innerHTML = `
        <img src="${imagem}" alt="${serie.name || ""}">
        <div class="card-serie-info">
            <h3>${serie.name || "Sem título"}</h3>
            <p>⭐ ${Number(serie.vote_average || 0).toFixed(1)}</p>
        </div>
    `;

    return card;
}

</script>

</body>
</html>
