<script id="lukafilmes-loader-js">
(function(){

    function mostrarLukaLoader(){
        var overlay=document.getElementById("lukaLoaderOverlay");
        if(!overlay)return;

        overlay.classList.add("ativo");
        overlay.setAttribute("aria-hidden","false");
    }

    function esconderLukaLoader(){
        var overlay=document.getElementById("lukaLoaderOverlay");
        if(!overlay)return;

        overlay.classList.remove("ativo");
        overlay.setAttribute("aria-hidden","true");
    }

    window.mostrarLukaLoader=mostrarLukaLoader;

    window.LukaLoader={
        show:mostrarLukaLoader,
        hide:esconderLukaLoader
    };

})();
</script>


<script id="lukafilmes-loader-page-ready">
(function(){
    function esconderQuandoPronta(){
        if(window.LukaLoader && typeof window.LukaLoader.hide === "function"){
            window.LukaLoader.hide();
        }
    }

    if(document.readyState === "complete"){
        esconderQuandoPronta();
    }else{
        window.addEventListener("load", esconderQuandoPronta, {once:true});
    }
})();
</script>






<script id="lukafilmes-notificacao-automatica">
(function(){
    "use strict";

    const CHAVE = "lukafilmes_notificacoes_filmes_v1";
    const MAX = 10;

    function lerIds(){
        try {
            return JSON.parse(localStorage.getItem(CHAVE) || "[]");
        } catch(e) {
            return [];
        }
    }

    function salvarIds(ids){
        localStorage.setItem(
            CHAVE,
            JSON.stringify(ids.slice(0, MAX))
        );
    }

    function atualizarPainel(filmes){
        const painel = document.getElementById("lukaNotificationPanel");
        if(!painel) return;

        let lista = painel.querySelector(".luka-notificacoes-lista");

        if(!lista){
            lista = document.createElement("div");
            lista.className = "luka-notificacoes-lista";
            painel.appendChild(lista);
        }

        lista.innerHTML = "";

        if(!filmes || !filmes.length){
            const vazio = document.createElement("div");
            vazio.textContent = "Nenhum filme novo no momento.";
            vazio.style.cssText =
                "padding:16px 0;color:#aaa;font-size:14px;";
            lista.appendChild(vazio);
            return;
        }

        filmes.forEach(function(filme){

            const item = document.createElement("a");

            item.href = "#";
            item.className = "lukafilmes-notificacao-item";

            item.style.cssText =
                "display:flex;" +
                "align-items:center;" +
                "gap:12px;" +
                "padding:10px 0;" +
                "border-bottom:1px solid rgba(255,255,255,.10);" +
                "color:#fff;" +
                "text-decoration:none;" +
                "cursor:pointer;";

            item.addEventListener("click", function(event){
                event.preventDefault();

                const id =
                    filme.id ||
                    filme.tmdb_id ||
                    filme.id_tmdb;

                if(!id) return;

                const dadosFilme = {
                    id: Number(id),
                    tmdb_id: Number(id),
                    titulo: filme.titulo || "",
                    title: filme.titulo || "",
                    poster: filme.poster || "",
                    poster_path: filme.poster
                        ? filme.poster.replace(
                            "https://image.tmdb.org/t/p/w500",
                            ""
                          )
                        : "",
                    release_date: filme.data || "",
                    data: filme.data || ""
                };

                try{
                    localStorage.setItem(
                        "filmeSelecionado",
                        JSON.stringify(dadosFilme)
                    );

                    localStorage.setItem(
                        "filmeSelecionadoHome_" + String(id),
                        JSON.stringify(dadosFilme)
                    );
                }catch(e){}

                window.location.href =
                    "/paginas/filme.html?id=" +
                    encodeURIComponent(id);
            });

            if(filme.poster){

                const imagem = document.createElement("img");

                imagem.src = filme.poster;
                imagem.alt =
                    "Capa de " + (filme.titulo || "filme");

                imagem.loading = "lazy";

                imagem.style.cssText =
                    "width:58px;" +
                    "height:82px;" +
                    "object-fit:cover;" +
                    "border-radius:7px;" +
                    "flex:none;" +
                    "background:#111;";

                item.appendChild(imagem);

            }else{

                const semImagem = document.createElement("div");

                semImagem.textContent = "🎬";

                semImagem.style.cssText =
                    "width:58px;" +
                    "height:82px;" +
                    "display:flex;" +
                    "align-items:center;" +
                    "justify-content:center;" +
                    "border-radius:7px;" +
                    "background:#151515;" +
                    "font-size:24px;" +
                    "flex:none;";

                item.appendChild(semImagem);
            }

            const texto = document.createElement("div");

            texto.style.cssText =
                "min-width:0;" +
                "display:flex;" +
                "flex-direction:column;" +
                "gap:5px;";

            const titulo = document.createElement("strong");

            titulo.textContent =
                "🎬 " + (filme.titulo || "Novo filme");

            titulo.style.cssText =
                "font-size:14px;" +
                "line-height:1.3;" +
                "display:block;";

            texto.appendChild(titulo);

            const descricao = document.createElement("span");

            descricao.textContent =
                "Novo filme disponível • Toque para assistir";

            descricao.style.cssText =
                "font-size:11px;" +
                "color:#aaa;" +
                "line-height:1.3;";

            texto.appendChild(descricao);

            item.appendChild(texto);
            lista.appendChild(item);
        });
    }

    async function verificarNovidades(){
        try{
            const resposta = await fetch(
                "/api/notificacoes/novos-filmes",
                { cache:"no-store" }
            );

            if(!resposta.ok) return;

            const dados = await resposta.json();
            const filmes = Array.isArray(dados.filmes)
                ? dados.filmes
                : [];

            if(!filmes.length) return;

            const vistos = lerIds();

            const novos = filmes.filter(function(filme){
                return !vistos.includes(Number(filme.id));
            });

            const badge = document.getElementById(
                "lukaNotificationBadge"
            );

            if(badge){
                if(novos.length){
                    badge.textContent =
                        novos.length > 9 ? "9+" : String(novos.length);
                    badge.style.display = "flex";
                }else{
                    badge.textContent = "";
                    badge.style.display = "none";
                }
            }

            atualizarPainel(novos.length ? novos : []);

            if(novos.length){
                salvarIds(
                    filmes.map(function(f){ return Number(f.id); })
                );
            }

        }catch(e){
            console.warn(
                "[LUKAFILMES] Não foi possível verificar novidades.",
                e
            );
        }
    }

    function iniciar(){
        verificarNovidades();
    }

    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", iniciar);
    }else{
        iniciar();
    }
})();
</script>

<script>
async function carregarHeroSeries(){
    try{
        const resposta=await fetch("/api/catalogo-series?pagina=1");
        const dados=await resposta.json();

        const lista=Array.isArray(dados.series)?dados.series:[];

        if(!lista.length)return;

        const serie=lista[Math.floor(Math.random()*lista.length)];

        const fundo=serie.fundo||serie.backdrop_path||serie.capa||"";

        const hero=document.getElementById("heroSeries");

        if(fundo){
            hero.style.backgroundImage='url("'+fundo.replace(/"/g,"%22")+'")';
        }

        hero.innerHTML=`
            <div class="hero-conteudo">
                <div class="hero-tag">LUKAFILMES</div>

                <h1 id="heroTituloSeries">
                    ${serie.titulo||"Série"}
                </h1>

                <div class="hero-meta">
                    <span>${serie.ano||""}</span>
                    <span>${serie.nota?"⭐ "+Number(serie.nota).toFixed(1):""}</span>
                </div>

                <p id="heroSinopseSeries">
                    ${serie.sinopse||""}
                </p>

                <div class="hero-botoes">
                    <button class="hero-btn hero-assistir" id="heroAssistirSeries">
                        ▶ Assistir
                    </button>

                    <button class="hero-btn hero-lista" id="heroListaSeries">
                        ＋ Adicionar aos favoritos
                    </button>
                    <a
                        href="/paginas/minha-lista"
                        id="heroMinhaListaSeries"
                        class="hero-btn hero-lista"
                        style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:8px;"
                    >♥ Meus Favoritos</a>
                </div>
            </div>
        `;

        document.getElementById("heroAssistirSeries").onclick=function(){
            localStorage.setItem(
                "serieSelecionada",
                JSON.stringify(serie)
            );
            location.href="serie.html";
        };

        const botaoListaSeries =
            document.getElementById("heroListaSeries");

        if (botaoListaSeries) {

            function atualizarBotaoListaSeries(){

                let lista = [];

                try {
                    lista = JSON.parse(
                        localStorage.getItem("lukafilmes_minhalista") || "[]"
                    );
                } catch(e) {
                    lista = [];
                }

                const id = String(
                    serie.id ||
                    serie.tmdb_id ||
                    serie.titulo ||
                    serie.nome ||
                    ""
                );

                const existe = lista.some(function(item){

                    return String(
                        item.id ||
                        item.tmdb_id ||
                        item.titulo ||
                        item.nome ||
                        ""
                    ) === id;

                });

                botaoListaSeries.textContent =
                    existe
                    ? "✓ Na minha lista"
                    : "＋ Adicionar aos favoritos";
            }

            botaoListaSeries.onclick = function(){

                let lista = [];

                try {
                    lista = JSON.parse(
                        localStorage.getItem("lukafilmes_minhalista") || "[]"
                    );
                } catch(e) {
                    lista = [];
                }

                if (!Array.isArray(lista))
                    lista = [];

                const id = String(
                    serie.id ||
                    serie.tmdb_id ||
                    serie.titulo ||
                    serie.nome ||
                    ""
                );

                const indice = lista.findIndex(function(item){

                    return String(
                        item.id ||
                        item.tmdb_id ||
                        item.titulo ||
                        item.nome ||
                        ""
                    ) === id;

                });

                if (indice === -1) {

                    const item = Object.assign({}, serie, {
                        tipo: "serie",
                        media_type: "tv"
                    });

                    lista.push(item);

                    localStorage.setItem(
                        "lukafilmes_minhalista",
                        JSON.stringify(lista)
                    );

                } else {

                    lista.splice(indice, 1);

                    localStorage.setItem(
                        "lukafilmes_minhalista",
                        JSON.stringify(lista)
                    );
                }

                atualizarBotaoListaSeries();

                console.log(
                    "[MINHA LISTA SERIES]",
                    serie.titulo
                );
            };

            atualizarBotaoListaSeries();
        }


        console.log(
            "[HERO SERIES] OK:",
            serie.titulo,
            "| FUNDO:",
            fundo
        );

    }catch(erro){
        console.error("[HERO SERIES] ERRO:",erro);
    }
}

carregarHeroSeries();
</script>

<script>
const listaSeries=document.getElementById("conteudo");

listaSeries.innerHTML=`
    <div class="pesquisa-series">
        <input
            id="pesquisaSeries"
            type="search"
            placeholder="Pesquisar séries..."
            autocomplete="off">
    </div>

    <h2 class="titulo-catalogo">Séries</h2>

    <div id="listaSeries">
        <div class="estado-series"></div>
    </div>
`;

const gradeSeries=document.getElementById("listaSeries");
const campoPesquisa=document.getElementById("pesquisaSeries");

const TOTAL_PAGINAS_CATALOGO_SERIES = 1000;

/*
 * =========================================================
 * LUKAFILMES — CATÁLOGO DE SÉRIES REALMENTE MISTURADO
 * =========================================================
 *
 * A API organiza as páginas em sequência.
 *
 * Para evitar:
 *
 * 2026 → 2025 → 2024 → 2023...
 *
 * criamos uma fila contendo todas as páginas disponíveis
 * e embaralhamos essa fila antes do primeiro carregamento.
 *
 * Cada página é usada no máximo uma vez durante a abertura.
 *
 * O infinite scroll continua normalmente:
 *
 * página aleatória → página aleatória → página aleatória...
 *
 * Quando uma página estiver vazia, a próxima da fila é
 * consultada imediatamente.
 */

function criarFilaPaginasSeries(){

    const paginas =
        Array.from(
            {
                length:
                    TOTAL_PAGINAS_CATALOGO_SERIES
            },
            (_, indice) =>
                indice + 1
        );

    for(
        let i = paginas.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            paginas[i],
            paginas[j]
        ] = [
            paginas[j],
            paginas[i]
        ];
    }

    return paginas;
}

const filaPaginasSeries =
    criarFilaPaginasSeries();

let indiceFilaPaginasSeries = 0;

function proximaPaginaSeries(){

    if(
        indiceFilaPaginasSeries >=
        filaPaginasSeries.length
    ){
        return null;
    }

    const pagina =
        filaPaginasSeries[
            indiceFilaPaginasSeries
        ];

    indiceFilaPaginasSeries++;

    return pagina;
}

/*
 * Primeira página também é aleatória.
 */
let paginaSeries =
    proximaPaginaSeries();

console.log(
    "[SÉRIES] Página inicial aleatória:",
    paginaSeries,
    "/",
    TOTAL_PAGINAS_CATALOGO_SERIES
);

let carregandoSeries=false;
let fimSeries=false;
let idsSeries=new Set();

function criarCardSerie(serie){

    const card=document.createElement("article");

    card.className="card-serie";

    const imagem=
        serie.capa||
        serie.poster_path||
        "";

    const titulo=
        serie.titulo||
        serie.name||
        "Sem título";

    const nota=
        serie.nota?
        "⭐ "+Number(serie.nota).toFixed(1):
        "";

    const ano=
        serie.ano||
        "";

    card.innerHTML=`
        <img
            src="${imagem}"
            alt="${titulo.replace(/"/g,"&quot;")}"
            loading="lazy">

        <div class="card-info">
            <h3>${titulo}</h3>
            <p>${nota}${ano?" • "+ano:""}</p>
        </div>
    `;

    card.onclick=function(){

        localStorage.setItem(
            "serieSelecionada",
            JSON.stringify(serie)
        );

        window.location.href="serie.html";
    };

    return card;
}

async function carregarCatalogoSeries(){

    if(carregandoSeries||fimSeries){
        return;
    }

    carregandoSeries=true;

    try{

        /*
         * LUKAFILMES — BUSCA DE PÁGINAS VÁLIDAS
         *
         * A página inicial continua aleatória entre 1 e 1000.
         * Se uma página estiver vazia, ela é ignorada e a próxima
         * página é consultada automaticamente.
         */

        while(!fimSeries){

            if(paginaSeries > TOTAL_PAGINAS_CATALOGO_SERIES){
                fimSeries=true;
                break;
            }

            const paginaAtual=paginaSeries;

            console.log(
                "[SÉRIES] Consultando página:",
                paginaAtual,
                "/",
                TOTAL_PAGINAS_CATALOGO_SERIES
            );

            const resposta=
                await fetch(
                    "/api/catalogo-series?pagina="+
                    paginaAtual
                );

            if(!resposta.ok){
                throw new Error(
                    "HTTP "+resposta.status+
                    " na página "+paginaAtual
                );
            }

            const dados=
                await resposta.json();

            const series=
                Array.isArray(dados.series)?
                dados.series:
                [];

            /*
             * A página 1 limpa o estado inicial.
             * Nas páginas aleatórias, o catálogo existente é preservado.
             */
            if(paginaAtual===1){
                gradeSeries.innerHTML="";
            }

            let adicionadas=0;

            for(const serie of series){

                const id=
                    String(
                        serie.id||
                        serie.tmdb_id||
                        serie.titulo||
                        ""
                    );

                if(!id||idsSeries.has(id)){
                    continue;
                }

                idsSeries.add(id);

                gradeSeries.appendChild(
                    criarCardSerie(serie)
                );

                adicionadas++;
            }

            /*
             * IMPORTANTE:
             *
             * A próxima página NÃO é paginaSeries + 1.
             *
             * A próxima página vem da fila embaralhada.
             *
             * Isso mantém o catálogo realmente misturado
             * e impede a sequência cronológica da API.
             */
            paginaSeries =
                proximaPaginaSeries();

            if(paginaSeries === null){
                fimSeries=true;
            }

            console.log(
                "[SÉRIES] Página:",
                paginaAtual,
                "| Novas:",
                adicionadas,
                "| Total:",
                idsSeries.size,
                "| Próxima:",
                paginaSeries
            );

            /*
             * Encontrou conteúdo: encerra esta execução.
             * O infinite scroll continuará quando o usuário rolar.
             *
             * Se estava vazia, o while continua imediatamente
             * procurando outra página.
             */
            if(adicionadas>0){
                break;
            }

            if(fimSeries){
                break;
            }

        }

    }catch(erro){

        console.error(
            "[SÉRIES] ERRO:",
            erro
        );

        if(!idsSeries.size){

            gradeSeries.innerHTML=
                '<div class="estado-series">'+
                'Erro ao carregar séries.'+
                '</div>';

        }

    }finally{

        carregandoSeries=false;

    }
}

let timerPesquisaSeries=null;

campoPesquisa.addEventListener(
    "input",
    function(){

        clearTimeout(
            timerPesquisaSeries
        );

        timerPesquisaSeries=
            setTimeout(
                function(){

                    pesquisarSeries(
                        campoPesquisa.value.trim()
                    );

                },
                300
            );

    }
);

async function pesquisarSeries(texto){

    if(!texto){

        gradeSeries.innerHTML="";
        paginaSeries=1;
        fimSeries=false;
        idsSeries.clear();

        carregarCatalogoSeries();

        return;
    }

    try{

        const resposta=
            await fetch(
                "/api/pesquisar-series?q="+
                encodeURIComponent(texto)
            );

        const dados=
            await resposta.json();

        const series=
            Array.isArray(dados.series)?
            dados.series:
            Array.isArray(dados.resultados)?
            dados.resultados:
            [];

        gradeSeries.innerHTML="";

        if(!series.length){

            gradeSeries.innerHTML=
                '<div class="estado-series">'+
                'Nenhuma série encontrada.'+
                '</div>';

            return;
        }

        series.forEach(
            function(serie){

                gradeSeries.appendChild(
                    criarCardSerie(serie)
                );

            }
        );

    }catch(erro){

        console.error(
            "[PESQUISA SERIES] ERRO:",
            erro
        );

    }
}

window.addEventListener(
    "scroll",
    function(){

        if(
            window.innerHeight+
            window.scrollY>=
            document.body.offsetHeight-700
        ){

            carregarCatalogoSeries();

        }

    }
);

carregarCatalogoSeries();
</script>
