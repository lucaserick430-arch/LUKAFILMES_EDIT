<script id="lukafilmes-cache-catalogo">
(function(){

    if (window.__LUKAFILMES_FETCH_CACHE_ATIVO__) return;

    window.__LUKAFILMES_FETCH_CACHE_ATIVO__ = true;

    const fetchOriginal = window.fetch.bind(window);

    const cache = new Map();
    const pendentes = new Map();

    const TTL = 30000;

    function ehCatalogo(url){

        return /^\/api\/catalogo-(filmes|series|acao)(?:[?\/]|$)/i.test(url);
    }

    window.fetch = async function(input, init){

        let url = "";

        try {
            url =
                typeof input === "string"
                    ? input
                    : input.url;
        } catch(e) {
            return fetchOriginal(input, init);
        }

        const metodo =
            String(
                (init && init.method) ||
                (typeof input !== "string" && input.method) ||
                "GET"
            ).toUpperCase();

        if (
            metodo !== "GET" ||
            !ehCatalogo(url)
        ){
            return fetchOriginal(input, init);
        }

        const agora = Date.now();

        const salvo = cache.get(url);

        if (
            salvo &&
            agora - salvo.tempo < TTL
        ){

            return new Response(
                salvo.texto,
                {
                    status: salvo.status,
                    headers: salvo.headers
                }
            );
        }

        if (pendentes.has(url)){
            const resultado =
                await pendentes.get(url);

            return new Response(
                resultado.texto,
                {
                    status: resultado.status,
                    headers: resultado.headers
                }
            );
        }

        const promessa = fetchOriginal(
            input,
            init
        ).then(async resposta => {

            const texto =
                await resposta.clone().text();

            const headers = {};

            resposta.headers.forEach(
                (valor, chave) => {
                    headers[chave] = valor;
                }
            );

            const resultado = {
                texto: texto,
                status: resposta.status,
                headers: headers
            };

            if (resposta.ok){

                cache.set(url, {
                    texto: texto,
                    status: resposta.status,
                    headers: headers,
                    tempo: Date.now()
                });

            }

            return resultado;

        });

        pendentes.set(url, promessa);

        try {

            const resultado =
                await promessa;

            return new Response(
                resultado.texto,
                {
                    status: resultado.status,
                    headers: resultado.headers
                }
            );

        } finally {

            pendentes.delete(url);

        }
    };

    window.__LUKAFILMES_LIMPAR_CACHE_CATALOGO__ =
        function(){
            cache.clear();
        };

    console.log(
        "[LUKAFILMES] Cache REAL do catálogo ativado."
    );

})();
</script>

<script id="lukafilmes-loader-js">
(function(){

    function mostrarLukaLoader(){
        var overlay=document.getElementById("lukaLoaderOverlay");
        if(!overlay)return;

        overlay.classList.add("ativo");
        overlay.setAttribute("aria-hidden","false");

        var overlay=document.getElementById("lukaLoaderOverlay");

        overlay.classList.remove("ativo");
        overlay.setAttribute("aria-hidden","true");
    }

    window.mostrarLukaLoader=mostrarLukaLoader;

    window.LukaLoader={
        show:mostrarLukaLoader,
        hide:esconderLukaLoader
    };

})();
</script>


<script id="lukafilmes-loader-page-ready">

})();

<script id="lukafilmes-notificacao-automatica">
(function(){
    "use strict";

    const CHAVE = "lukafilmes_notificacoes_filmes_v1";
    const MAX = 10;

    function lerIds(){
        try {
            return JSON.parse(localStorage.getItem(CHAVE) || "[]");
        } catch(e) {
            return [];
        }
    }

    function salvarIds(ids){
        localStorage.setItem(
            CHAVE,
            JSON.stringify(ids.slice(0, MAX))
        );
    }

    function atualizarPainel(filmes){
        const painel = document.getElementById("lukaNotificationPanel");
        if(!painel) return;

        let lista = painel.querySelector(".luka-notificacoes-lista");

        if(!lista){
            lista = document.createElement("div");
            lista.className = "luka-notificacoes-lista";
            painel.appendChild(lista);
        }

        lista.innerHTML = "";

        if(!filmes || !filmes.length){
            const vazio = document.createElement("div");
            vazio.textContent = "Nenhum filme novo no momento.";
            vazio.style.cssText =
                "padding:16px 0;color:#aaa;font-size:14px;";
            lista.appendChild(vazio);
            return;
        }

        filmes.forEach(function(filme){

            const item = document.createElement("a");

            item.href = "#";
            item.className = "lukafilmes-notificacao-item";

            item.style.cssText =
                "display:flex;" +
                "align-items:center;" +
                "gap:12px;" +
                "padding:10px 0;" +
                "border-bottom:1px solid rgba(255,255,255,.10);" +
                "color:#fff;" +
                "text-decoration:none;" +
                "cursor:pointer;";

            item.addEventListener("click", function(event){
                event.preventDefault();

                const id =
                    filme.id ||
                    filme.tmdb_id ||
                    filme.id_tmdb;

                if(!id) return;

                const dadosFilme = {
                    id: Number(id),
                    tmdb_id: Number(id),
                    titulo: filme.titulo || "",
                    title: filme.titulo || "",
                    poster: filme.poster || "",
                    poster_path: filme.poster
                        ? filme.poster.replace(
                            "https://image.tmdb.org/t/p/w500",
                            ""
                          )
                        : "",
                    release_date: filme.data || "",
                    data: filme.data || ""
                };

                try{
                    localStorage.setItem(
                        "filmeSelecionado",
                        JSON.stringify(dadosFilme)
                    );

                    localStorage.setItem(
                        "filmeSelecionadoHome_" + String(id),
                        JSON.stringify(dadosFilme)
                    );
                }catch(e){}

                window.location.href =
                    "/paginas/filme.html?id=" +
                    encodeURIComponent(id);
            });

            if(filme.poster){

                const imagem = document.createElement("img");

                imagem.src = filme.poster;
                imagem.alt =
                    "Capa de " + (filme.titulo || "filme");

                imagem.loading = "lazy";

                imagem.style.cssText =
                    "width:58px;" +
                    "height:82px;" +
                    "object-fit:cover;" +
                    "border-radius:7px;" +
                    "flex:none;" +
                    "background:#111;";

                item.appendChild(imagem);

            }else{

                const semImagem = document.createElement("div");

                semImagem.textContent = "🎬";

                semImagem.style.cssText =
                    "width:58px;" +
                    "height:82px;" +
                    "display:flex;" +
                    "align-items:center;" +
                    "justify-content:center;" +
                    "border-radius:7px;" +
                    "background:#151515;" +
                    "font-size:24px;" +
                    "flex:none;";

                item.appendChild(semImagem);
            }

            const texto = document.createElement("div");

            texto.style.cssText =
                "min-width:0;" +
                "display:flex;" +
                "flex-direction:column;" +
                "gap:5px;";

            const titulo = document.createElement("strong");

            titulo.textContent =
                "🎬 " + (filme.titulo || "Novo filme");

            titulo.style.cssText =
                "font-size:14px;" +
                "line-height:1.3;" +
                "display:block;";

            texto.appendChild(titulo);

            const descricao = document.createElement("span");

            descricao.textContent =
                "Novo filme disponível • Toque para assistir";

            descricao.style.cssText =
                "font-size:11px;" +
                "color:#aaa;" +
                "line-height:1.3;";

            texto.appendChild(descricao);

            item.appendChild(texto);
            lista.appendChild(item);
        });
    }

    async function verificarNovidades(){
        try{
            const resposta = await fetch(
                "/api/notificacoes/novos-filmes",
                { cache:"no-store" }
            );

            if(!resposta.ok) return;

            const dados = await resposta.json();
            const filmes = Array.isArray(dados.filmes)
                ? dados.filmes
                : [];

            if(!filmes.length) return;

            const vistos = lerIds();

            const novos = filmes.filter(function(filme){
                return !vistos.includes(Number(filme.id));
            });

            const badge = document.getElementById(
                "lukaNotificationBadge"
            );

            if(badge){
                if(novos.length){
                    badge.textContent =
                        novos.length > 9 ? "9+" : String(novos.length);
                    badge.style.display = "flex";
                }else{
                    badge.textContent = "";
                    badge.style.display = "none";
                }
            }

            atualizarPainel(novos.length ? novos : []);

            if(novos.length){
                salvarIds(
                    filmes.map(function(f){ return Number(f.id); })
                );
            }

        }catch(e){
            console.warn(
                "[LUKAFILMES] Não foi possível verificar novidades.",
                e
            );
        }
    }

    function iniciar(){
        verificarNovidades();
    }

    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", iniciar);
    }else{
        iniciar();
    }
})();
</script>

     LUKAFILMES — HERO SÉRIES
     ATÉ 100 CAPAS DIFERENTES — SEM REPETIÇÃO
     ============================================================ -->
<script id="lukafilmes-hero-series-100-unicas">
(function(){

    const LIMITE_HERO = 100;
    const CHAVE_USADAS = "lukafilmes_hero_series_100_unicas_v1";

    function carregarUsadas(){
        try {
            const lista = JSON.parse(sessionStorage.getItem(CHAVE_USADAS) || "[]");
            return new Set(Array.isArray(lista) ? lista : []);
        } catch(e){
            return new Set();
        }
    }

    function salvarUsadas(set){
        try {
            sessionStorage.setItem(
                CHAVE_USADAS,
                JSON.stringify(Array.from(set).slice(-LIMITE_HERO))
            );
        } catch(e){}
    }

    function idSerie(serie){
        if(!serie) return null;

        return String(
            serie.id ??
            serie.tmdb_id ??
            serie.id_tmdb ??
            serie.name ??
            serie.title ??
            serie.original_name ??
            serie.original_title ??
            ""
        ).trim().toLowerCase();
    }

    function capaSerie(serie){
        if(!serie) return "";

        return (
            serie.backdrop_path ||
            serie.backdrop ||
            serie.poster_path ||
            serie.poster ||
            serie.capa ||
            ""
        );
    }

    /*
     * Intercepta a seleção do hero.
     * Quando existir uma lista de séries disponível,
     * prioriza sempre uma série que ainda não foi utilizada.
     */
    window.__LUKAFILMES_HERO_SERIES_UNICAS__ = {
        LIMITE: LIMITE_HERO,

        escolher(lista){
            if(!Array.isArray(lista) || !lista.length) return null;

            const usadas = carregarUsadas();

            const validas = lista.filter(serie => {
                const id = idSerie(serie);
                const capa = capaSerie(serie);
                return id && capa;
            });

            if(!validas.length) return null;

            let disponiveis = validas.filter(serie => {
                return !usadas.has(idSerie(serie));
            });

            /*
             * Chegou às 100 utilizadas?
             * Começa um novo ciclo, mas continua evitando
             * repetições dentro do novo ciclo.
             */
            if(!disponiveis.length){
                sessionStorage.removeItem(CHAVE_USADAS);
                usadas.clear();
                disponiveis = validas.slice();
            }

            const escolhida =
                disponiveis[Math.floor(Math.random() * disponiveis.length)];

            const id = idSerie(escolhida);

            if(id){
                usadas.add(id);
                salvarUsadas(usadas);
            }

            return escolhida;
        }
    };

    /*
     * Guarda também as capas já apresentadas nesta sessão.
     * Isso impede que a mesma imagem seja reutilizada
     * imediatamente pelo hero.
     */
    window.__LUKAFILMES_HERO_CAPAS_USADAS__ =
        window.__LUKAFILMES_HERO_CAPAS_USADAS__ || new Set();

    console.log(
        "[LUKAFILMES HERO SÉRIES] Sistema de até 100 capas únicas ativado."
    );

})();
</script>

<script>
async function carregarHeroSeries(){

    try{

        /*
         * PRIMEIRO: mostra imediatamente uma série da página 1.
         * Não espera as outras páginas carregarem.
         */
        const primeiraResposta =
            await fetch("/api/catalogo-series?pagina=1");

        const primeiroDados =
            await primeiraResposta.json();

        const primeiraLista =
            Array.isArray(primeiroDados.series)
            ? primeiroDados.series
            : [];

        if(!primeiraLista.length){
            console.error("[HERO SERIES] Catálogo vazio.");
            return;
        }

        /*
         * Monta imediatamente o Hero.
         */
        let catalogoHero =
            primeiraLista.filter(function(serie){

                return serie &&
                    (
                        serie.fundo ||
                        serie.backdrop_path ||
                        serie.capa
                    );

            });

        if(!catalogoHero.length){
            console.error("[HERO SERIES] Nenhuma capa na página 1.");
            return;
        }

        catalogoHero.sort(function(){
            return Math.random()-0.5;
        });

        let indice=0;

        function mostrarHeroSerie(){

            const serie=catalogoHero[indice];

            indice++;

            if(indice>=catalogoHero.length){
                indice=0;

                catalogoHero.sort(function(){
                    return Math.random()-0.5;
                });
            }

            const fundo =
                serie.fundo ||
                serie.backdrop_path ||
                serie.capa ||
                "";

            const hero =
                document.getElementById("heroSeries");

            if(!hero)return;

            if(fundo){

                hero.style.backgroundImage =
                    'url("' +
                    fundo.replace(/"/g,"%22") +
                    '")';

            }

            hero.innerHTML=`
                <div class="hero-conteudo">

                    <div class="hero-tag">
                        LUKAFILMES
                    </div>

                    <h1 id="heroTituloSeries">
                        ${serie.titulo||"Série"}
                    </h1>

                    <div class="hero-meta">
                        <span>${serie.ano||""}</span>
                        <span>
                            ${serie.nota
                                ?"⭐ "+Number(serie.nota).toFixed(1)
                                :""
                            }
                        </span>
                    </div>

                    <p id="heroSinopseSeries">
                        ${serie.sinopse||""}
                    </p>

                    <div class="hero-botoes">

                        <button
                            class="hero-btn hero-assistir"
                            id="heroAssistirSeries">
                            ▶ Assistir
                        </button>

                        <button
                            class="hero-btn hero-lista"
                            id="heroListaSeries">
                            ＋ Adicionar aos favoritos
                        </button>

                        <a
                            href="/paginas/minha-lista"
                            id="heroMinhaListaSeries"
                            class="hero-btn hero-lista"
                            style="display:inline-flex;align-items:center;justify-content:center;text-decoration:none;margin-left:8px;"
                        >
                            ♥ Meus Favoritos
                        </a>

                    </div>
                </div>
            `;

            document.getElementById(
                "heroAssistirSeries"
            ).onclick=function(){

                localStorage.setItem(
                    "serieSelecionada",
                    JSON.stringify(serie)
                );

                location.href="serie.html";

            };

            const botaoListaSeries =
                document.getElementById("heroListaSeries");

            if(botaoListaSeries){

                function atualizar(){

                    let lista=[];

                    try{
                        lista=JSON.parse(
                            localStorage.getItem(
                                "lukafilmes_minhalista"
                            )||"[]"
                        );
                    }catch(e){
                        lista=[];
                    }

                    const id=String(
                        serie.id ||
                        serie.tmdb_id ||
                        serie.titulo ||
                        serie.nome ||
                        ""
                    );

                    const existe=lista.some(function(item){

                        return String(
                            item.id ||
                            item.tmdb_id ||
                            item.titulo ||
                            item.nome ||
                            ""
                        )===id;

                    });

                    botaoListaSeries.textContent=
                        existe
                        ?"✓ Na minha lista"
                        :"＋ Adicionar aos favoritos";

                }

                botaoListaSeries.onclick=function(){

                    let lista=[];

                    try{
                        lista=JSON.parse(
                            localStorage.getItem(
                                "lukafilmes_minhalista"
                            )||"[]"
                        );
                    }catch(e){
                        lista=[];
                    }

                    if(!Array.isArray(lista))
                        lista=[];

                    const id=String(
                        serie.id ||
                        serie.tmdb_id ||
                        serie.titulo ||
                        serie.nome ||
                        ""
                    );

                    const pos=lista.findIndex(function(item){

                        return String(
                            item.id ||
                            item.tmdb_id ||
                            item.titulo ||
                            item.nome ||
                            ""
                        )===id;

                    });

                    if(pos===-1){

                        lista.push(
                            Object.assign(
                                {},
                                serie,
                                {
                                    tipo:"serie",
                                    media_type:"tv"
                                }
                            )
                        );

                    }else{

                        lista.splice(pos,1);

                    }

                    localStorage.setItem(
                        "lukafilmes_minhalista",
                        JSON.stringify(lista)
                    );

                    atualizar();

                };

                atualizar();

            }

        }

        /*
         * MOSTRA A CAPA AGORA.
         */
        mostrarHeroSerie();

        /*
         * Depois carrega o restante em segundo plano.
         */
        (async function(){

            const mapa=new Map();

            primeiraLista.forEach(function(serie){

                const id=String(
                    serie.id ||
                    serie.tmdb_id ||
                    serie.titulo ||
                    serie.nome ||
                    ""
                );

                if(id) mapa.set(id,serie);

            });

            for(let pagina=2;pagina<=100;pagina++){

                try{

                    const resposta=
                        await fetch(
                            "/api/catalogo-series?pagina="+pagina
                        );

                    if(!resposta.ok)continue;

                    const dados=
                        await resposta.json();

                    const lista=
                        Array.isArray(dados.series)
                        ?dados.series
                        :[];

                    if(!lista.length)break;

                    lista.forEach(function(serie){

                        const id=String(
                            serie.id ||
                            serie.tmdb_id ||
                            serie.titulo ||
                            serie.nome ||
                            ""
                        );

                        const fundo=
                            serie.fundo ||
                            serie.backdrop_path ||
                            serie.capa ||
                            "";

                        if(id && fundo && !mapa.has(id)){
                            mapa.set(id,serie);
                        }

                    });

                }catch(e){}

            }

            const novas=
                Array.from(mapa.values()).filter(function(serie){

                    return (
                        serie.fundo ||
                        serie.backdrop_path ||
                        serie.capa
                    );

                }).slice(0,2000);

            if(novas.length){

                catalogoHero=novas;

                catalogoHero.sort(function(){
                    return Math.random()-0.5;
                });

                console.log(
                    "[HERO SERIES] Catálogo ampliado:",
                    catalogoHero.length,
                    "capas"
                );

            }

        })();

        /*
         * Troca automática.
         */
        setInterval(
            mostrarHeroSerie,
            10000
        );

    }catch(erro){

        console.error(
            "[HERO SERIES] ERRO:",
            erro
        );

    }
}

carregarHeroSeries();
</script>

<script>
const listaSeries=document.getElementById("conteudo");

listaSeries.innerHTML=`
    <section class="series-pesquisa">
        <div class="series-pesquisa-topo">
            <button
                type="button"
                class="series-search-btn"
                id="seriesSearchBtn"
                aria-label="Pesquisar séries"
                aria-expanded="false"
                onclick="togglePesquisaSeries()"
            >⌕</button>
        </div>

        <div
            class="series-pesquisa-box"
            id="seriesPesquisaBox"
        >
            <input
                id="pesquisaSeries"
                type="search"
                placeholder="Pesquisar séries..."
                autocomplete="off"
                aria-label="Pesquisar séries">
        </div>
    </section>

<div id="listaSeries">
        <div class="estado-series"></div>
    </div>
`;

const gradeSeries=document.getElementById("listaSeries");
const campoPesquisa=document.getElementById("pesquisaSeries");

const TOTAL_PAGINAS_CATALOGO_SERIES = 500;

/*
 * =========================================================
 * LUKAFILMES — SÉRIES COM CARREGAMENTO ALEATÓRIO + INFINITO
 * =========================================================
 *
 * Igual ao catálogo de FILMES:
 *
 * 1. A fila de páginas é embaralhada a cada abertura.
 * 2. A primeira página muda a cada atualização.
 * 3. Nenhuma página é repetida durante esta sessão.
 * 4. Ao descer, novas páginas continuam sendo carregadas.
 * 5. O infinite scroll continua funcionando normalmente.
 */

function embaralharFilaSeries(lista){

    const resultado = [...lista];

    for(let i = resultado.length - 1; i > 0; i--){

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            resultado[i],
            resultado[j]
        ] = [
            resultado[j],
            resultado[i]
        ];
    }

    return resultado;
}

function criarFilaPaginasSeries(){

    const paginasIniciais =
        Array.from(
            {
                length:
                    Math.min(
                        50,
                        TOTAL_PAGINAS_CATALOGO_SERIES
                    )
            },
            (_, i) => i + 1
        );

    const paginasRestantes =
        Array.from(
            {
                length:
                    Math.max(
                        0,
                        TOTAL_PAGINAS_CATALOGO_SERIES - 50
                    )
            },
            (_, i) => i + 51
        );

    return [
        ...embaralharFilaSeries(
            paginasIniciais
        ),
        ...embaralharFilaSeries(
            paginasRestantes
        )
    ];
}

const filaPaginasSeries =
    criarFilaPaginasSeries();

let indiceFilaPaginasSeries = 0;

function proximaPaginaSeries(){

    if(
        indiceFilaPaginasSeries >=
        filaPaginasSeries.length
    ){
        return null;
    }

    const pagina =
        filaPaginasSeries[
            indiceFilaPaginasSeries
        ];

    indiceFilaPaginasSeries++;

    return pagina;
}

/*
 * A PRIMEIRA página agora vem da fila
 * embaralhada, igual aos filmes.
 */
let paginaSeries =
    proximaPaginaSeries();

let carregandoSeries = false;
let fimSeries = false;

const idsSeries = new Set();

/* =========================================================
   CRIAÇÃO DO CARD
   ========================================================= */

function criarCardSerie(serie){

    const card = document.createElement("article");

    card.className = "card-serie";

    const imagem =
        serie.capa ||
        serie.poster_path ||
        "";

    const titulo =
        serie.titulo ||
        serie.name ||
        "Sem título";

    const nota =
        serie.nota
        ? "⭐ " + Number(serie.nota).toFixed(1)
        : "";

    const ano =
        serie.ano ||
        "";

    card.innerHTML = `
        <img
            src="${imagem}"
            alt="${String(titulo).replace(/"/g,"&quot;")}"
            loading="lazy"
            decoding="async">

        <div class="card-info">
            <h3>${titulo}</h3>
            <p>${nota}${ano ? " • " + ano : ""}</p>
        </div>
    `;

    card.onclick = function(){

        localStorage.setItem(
            "serieSelecionada",
            JSON.stringify(serie)
        );

        window.location.href = "serie.html";
    };

    return card;
}

/* =========================================================
   CATEGORIA
   ========================================================= */

const categoriaSeries =
    new URLSearchParams(window.location.search)
        .get("categoria") || "";

/* =========================================================
   CARREGAR MAIS SÉRIES
   ========================================================= */

async function carregarCatalogoSeries(){

    if(
        carregandoSeries ||
        fimSeries
    ){
        return;
    }

    carregandoSeries = true;

    try{

        /*
         * Continua procurando até encontrar
         * uma página com conteúdo.
         */
        while(
            !fimSeries &&
            paginaSeries <= TOTAL_PAGINAS_CATALOGO_SERIES
        ){

            const paginaAtual = paginaSeries;

            console.log(
                "[SÉRIES] Carregando página:",
                paginaAtual,
                "/",
                TOTAL_PAGINAS_CATALOGO_SERIES
            );

            let url =
                "/api/catalogo-series?pagina=" +
                paginaAtual;

            if(categoriaSeries){

                url +=
                    "&categoria=" +
                    encodeURIComponent(
                        categoriaSeries
                    );

            }

            const resposta =
                await fetch(url);

            if(!resposta.ok){

                throw new Error(
                    "HTTP " +
                    resposta.status +
                    " na página " +
                    paginaAtual
                );

            }

            const dados =
                await resposta.json();

            const series =
                Array.isArray(dados)
                    ? dados
                    : Array.isArray(dados.series)
                        ? dados.series
                        : Array.isArray(dados.resultados)
                            ? dados.resultados
                            : [];

            let adicionadas = 0;

            for(const serie of series){

                const id =
                    String(
                        serie.id ||
                        serie.tmdb_id ||
                        serie.titulo ||
                        serie.name ||
                        ""
                    ).trim();

                if(
                    !id ||
                    idsSeries.has(id)
                ){
                    continue;
                }

                idsSeries.add(id);

                gradeSeries.appendChild(
                    criarCardSerie(serie)
                );

                adicionadas++;

            }

            /*
             * SEMPRE avança para a próxima página.
             */
            paginaSeries++;

            console.log(
                "[SÉRIES] Página:",
                paginaAtual,
                "| Novas:",
                adicionadas,
                "| Total:",
                idsSeries.size,
                "| Próxima:",
                paginaSeries
            );

            /*
             * Se encontrou séries, termina esta execução.
             * O scroll chama novamente quando necessário.
             *
             * Se não encontrou nenhuma, o while continua
             * imediatamente para a próxima página.
             */
            if(adicionadas > 0){
                break;
            }

        }

        if(
            paginaSeries >
            TOTAL_PAGINAS_CATALOGO_SERIES
        ){

            fimSeries = true;

            console.log(
                "[SÉRIES] Fim real do catálogo."
            );

        }

    }catch(erro){

        console.error(
            "[SÉRIES] ERRO:",
            erro
        );

        if(!idsSeries.size){

            gradeSeries.innerHTML =
                '<div class="estado-series">' +
                'Erro ao carregar séries.' +
                '</div>';

        }

    }finally{

        carregandoSeries = false;

    }

}

/* =========================================================
   PESQUISA
   ========================================================= */

let timerPesquisaSeries = null;

campoPesquisa.addEventListener(
    "input",
    function(){

        clearTimeout(
            timerPesquisaSeries
        );

        timerPesquisaSeries =
            setTimeout(
                function(){

                    pesquisarSeries(
                        campoPesquisa.value.trim()
                    );

                },
                300
            );

    }
);

async function pesquisarSeries(texto){

    if(!texto){

        gradeSeries.innerHTML = "";

        idsSeries.clear();

        paginaSeries = 1;

        fimSeries = false;

        carregarCatalogoSeries();

        return;

    }

    try{

        const resposta =
            await fetch(
                "/api/pesquisar-series?q=" +
                encodeURIComponent(texto)
            );

        const dados =
            await resposta.json();

        const series =
            Array.isArray(dados.series)
                ? dados.series
                : Array.isArray(dados.resultados)
                    ? dados.resultados
                    : [];

        gradeSeries.innerHTML = "";

        if(!series.length){

            gradeSeries.innerHTML =
                '<div class="estado-series">' +
                'Nenhuma série encontrada.' +
                '</div>';

            return;

        }

        series.forEach(
            function(serie){

                gradeSeries.appendChild(
                    criarCardSerie(serie)
                );

            }
        );

    }catch(erro){

        console.error(
            "[PESQUISA SERIES] ERRO:",
            erro
        );

    }

}

/* =========================================================
   INFINITE SCROLL
   ========================================================= */

window.addEventListener(
    "scroll",
    function(){

        const distancia =
            document.documentElement.scrollHeight -
            (
                window.innerHeight +
                window.scrollY
            );

        /*
         * Quando faltar aproximadamente 700px,
         * já busca a próxima página.
         */
        if(distancia <= 700){

            carregarCatalogoSeries();

        }

    },
    {
        passive: true
    }
);

/* =========================================================
   PRIMEIRO CARREGAMENTO

<script id="lukafilmes-pesquisa-series-ui">
(function(){

    window.togglePesquisaSeries = function(){

        const box =
            document.getElementById("seriesPesquisaBox");

        const btn =
            document.getElementById("seriesSearchBtn");

        const input =
            document.getElementById("pesquisaSeries");

        if(!box || !input) return;

        const aberta =
            box.classList.toggle("aberta");

        if(btn){
            btn.setAttribute(
                "aria-expanded",
                aberta ? "true" : "false"
            );
        }

        if(aberta){

            setTimeout(function(){
                input.focus();
            },120);

        }else{

            input.blur();

        }

    };

    document.addEventListener(
        "click",
        function(event){

            const box =
                document.getElementById("seriesPesquisaBox");

            const btn =
                document.getElementById("seriesSearchBtn");

            if(!box || !btn) return;

            if(
                !box.contains(event.target) &&
                !btn.contains(event.target) &&
                box.classList.contains("aberta")
            ){

                box.classList.remove("aberta");

                btn.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }

        }
    );

})();
</script>

<script id="lukafilmes-series-search-FINAL">
(function(){

    function inicializarPesquisaSeries(){

        const box =
            document.getElementById("seriesPesquisaBox");

        const btn =
            document.getElementById("seriesSearchBtn");

        const input =
            document.getElementById("pesquisaSeries");

        if(!box || !btn || !input){
            return;
        }

        window.togglePesquisaSeries = function(){

            const aberta =
                box.classList.toggle("aberta");

            btn.setAttribute(
                "aria-expanded",
                aberta ? "true" : "false"
            );

            if(aberta){

                setTimeout(function(){
                    input.focus();
                },80);

            }else{

                input.blur();

            }
        };

        document.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key === "Escape" &&
                    box.classList.contains("aberta")
                ){

                    box.classList.remove("aberta");

                    btn.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    input.blur();
                }

            }
        );

        document.addEventListener(
            "click",
            function(event){

                if(
                    !box.classList.contains("aberta")
                ){
                    return;
                }

                if(
                    event.target === btn ||
                    btn.contains(event.target) ||
                    box.contains(event.target)
                ){
                    return;
                }

                box.classList.remove("aberta");

                btn.setAttribute(
                    "aria-expanded",
                    "false"
                );

            }
        );

        console.log(
            "[LUKAFILMES] Pesquisa de séries visual inicializada."
        );
    }

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",

<script id="lukafilmes-series-lupa-original-final-script">
(function(){

    function corrigirLupaSeries(){

        const pesquisa =
            document.querySelector(".series-pesquisa");

        if(!pesquisa){
            return;
        }

        /*
         * Retira a pesquisa de dentro do #conteudo.
         * Assim ela não fica atrás do Hero/header.
         */
        if(pesquisa.parentElement !== document.body){
            document.body.appendChild(pesquisa);
        }

        /*
         * Garante que o texto fique exatamente igual ao Filmes.
         */
        const tag =
            document.querySelector("#heroSeries .hero-tag");

        if(tag){
            tag.textContent = "LUKAFILMES ORIGINAL";
        }

        console.log(
            "[LUKAFILMES] Lupa de Séries corrigida."
        );
    }

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            corrigirLupaSeries,
            {once:true}
        );

    }else{

        corrigirLupaSeries();

    }

    /*
     * O Hero é carregado dinamicamente.
     * Reaplica somente o texto quando necessário.
     */
    const observador =
        new MutationObserver(function(){

            const tag =
                document.querySelector("#heroSeries .hero-tag");

            if(tag && tag.textContent.trim() !== "LUKAFILMES ORIGINAL"){
                tag.textContent = "LUKAFILMES ORIGINAL";
            }

        });

    observador.observe(
        document.documentElement,
        {
            childList:true,
            subtree:true
        }
    );

})();

</script>

            document.querySelector("body > .series-pesquisa");

        function atualizar(){

            if(window.scrollY > 20){

                pesquisa.classList.add("lupa-escondida");

            }else{

                pesquisa.classList.remove("lupa-escondida");

            }

        }

        window.addEventListener(
            "scroll",
            atualizar,
            {passive:true}
        );

        atualizar();
    }

    if(document.readyState === "loading"){

        document.addEventListener(
            "DOMContentLoaded",
            configurarLupaScroll,
            {once:true}
        );

    }else{

        configurarLupaScroll();

})();
