<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Continuar Assistindo — LUKAFILMES</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100%;
}

body{
    overflow-x:hidden;
}

.header{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:72px;
    z-index:1000;
    display:flex;
    align-items:center;
    padding:0 4%;
    background:rgba(5,5,5,.96);
    box-shadow:0 5px 25px rgba(0,0,0,.45);
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:-1px;
    color:#e50914;
    margin-right:35px;
    white-space:nowrap;
}

.logo span{
    color:#fff;
}
main{
    padding:110px 5% 50px;
}

h1{
    font-size:28px;
    margin-bottom:28px;
}

#listaContinuar{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:24px 16px;
}

.continuar-card{
    min-width:0;
    color:#fff;
}

.continuar-capa{
    width:100%;
    aspect-ratio:2 / 3;
    object-fit:cover;
    display:block;
    border-radius:10px;
    background:#151515;
}

.continuar-info{
    padding-top:9px;
}

.continuar-titulo{
    font-size:14px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.continuar-progresso{
    width:100%;
    height:4px;
    margin-top:8px;
    background:#333;
    border-radius:4px;
    overflow:hidden;
}

.continuar-progresso > div{
    height:100%;
    background:#e50914;
}

.continuar-btn{
    display:block;
    width:100%;
    margin-top:9px;
    padding:10px 8px;
    border:0;
    border-radius:7px;
    background:#e50914;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.continuar-btn:active{
    transform:scale(.98);
}

.continuar-remover-btn{
    display:block;
    width:100%;
    margin-top:7px;
    padding:9px 8px;
    border:1px solid #555;
    border-radius:7px;
    background:#222;
    color:#fff;
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
}

.continuar-remover-btn:hover{
    background:#333;
}

.vazio{
    color:#aaa;
    font-size:16px;
    padding:30px 0;
}

@media(max-width:600px){

    .header{
        height:60px;
        padding:0 15px;
    }

    .logo{
        font-size:20px;
        margin-right:15px;
    }
main{
        padding:85px 14px 40px;
    }

    h1{
        font-size:23px;
        margin-bottom:22px;
    }

    #listaContinuar{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:20px 12px;
    }

    .continuar-btn{
        padding:11px 6px;
        font-size:13px;
    }
}
</style>


<style id="continuar-inicio-header">
.inicio-header{
    margin-left:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:9px 18px;
    min-width:78px;
    height:40px;
    box-sizing:border-box;
    background:#e50914;
    color:#fff;
    border:0;
    border-radius:8px;
    text-decoration:none;
    font-size:15px;
    font-weight:800;
    line-height:1;
    cursor:pointer;
    pointer-events:auto;
    position:relative;
    z-index:1001;
    transition:.2s ease;
}

.inicio-header:hover{
    background:#ff1724;
    color:#fff;
    transform:translateY(-1px);
}

@media(max-width:700px){
    .inicio-header{
        min-width:70px;
        height:38px;
        padding:0 14px;
        font-size:14px;
    }
}
</style>

</head>

<body>
<header class="header">

    <div class="logo">
        LUKA<span>FILMES</span>
    </div>
    <a class="inicio-header" href="../index.html">Início</a></header>




<main>

    <h1>▶ Continuar Assistindo</h1>

    <div id="listaContinuar"></div>

</main>

<script src="../js/conta-storage.js"></script>
<script src="../js/continuar-assistindo.js"></script>

<script>
(function(){

    const container =
        document.getElementById("listaContinuar");

    if(!container){
        console.error("[CONTINUAR] Container não encontrado.");
        return;
    }

    function lerHistorico(){

        try{
            const bruto =
                localStorage.getItem("lukafilmes_continuar");

            const lista =
                bruto ? JSON.parse(bruto) : [];

            return Array.isArray(lista) ? lista : [];

        }catch(e){

            console.error(
                "[CONTINUAR] Erro ao ler histórico:",
                e
            );

            return [];
        }
    }

    function escapar(valor){

        return String(valor || "")
            .replace(/&/g,"&amp;")
            .replace(/</g,"&lt;")
            .replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;")
            .replace(/'/g,"&#039;");
    }

    function abrirConteudo(item){

        if(!item || !item.id){
            console.error(
                "[CONTINUAR] Item sem ID:",
                item
            );
            return;
        }

        try{

            localStorage.setItem(
                "filmeSelecionadoHome_" + String(item.id),
                JSON.stringify(item)
            );

            localStorage.setItem(
                "filmeSelecionado",
                JSON.stringify(item)
            );

        }catch(e){

            console.error(
                "[CONTINUAR] Erro ao preparar filme:",
                e
            );

            return;
        }

        const tipo =
            item.tipo === "serie" ||
            item.tipo === "series" ||
            item.media_type === "tv"
                ? "serie"
                : "filme";

        const pagina =
            tipo === "serie"
                ? "/paginas/serie.html"
                : "/paginas/filme.html";

        console.log(
            "[CONTINUAR] Abrindo:",
            pagina,
            "ID:",
            item.id,
            "tempo:",
            item.tempo
        );

        window.location.href =
            pagina +
            "?id=" +
            encodeURIComponent(item.id);
    }

    function carregar(){

        let lista = lerHistorico();

        /*
         * Só aparecem conteúdos que realmente possuem
         * algum progresso e ainda não chegaram ao fim.
         */
        lista = lista.filter(function(item){

            if(!item || !item.id){
                return false;
            }

            const progresso =
                Number(item.progresso) || 0;

            const tempo =
                Number(item.tempo) || 0;

            return (tempo > 0 || item.player) && progresso < 99.5;
        });

        console.log(
            "[CONTINUAR] Itens encontrados:",
            lista.length,
            lista
        );

        if(!lista.length){

            container.innerHTML =
                '<div class="vazio">' +
                'Você ainda não tem filmes ou séries para continuar assistindo.' +
                '</div>';

            return;
        }

        container.innerHTML = "";

        lista.forEach(function(item){

            const progresso =
                Math.min(
                    100,
                    Math.max(
                        0,
                        Number(item.progresso) || 0
                    )
                );

            const card =
                document.createElement("div");

            card.className =
                "continuar-card";

            card.innerHTML = `
                <img
                    class="continuar-capa"
                    src="${escapar(item.capa || "")}"
                    alt="${escapar(item.titulo || "Conteúdo")}"
                    draggable="false"
                >

                <div class="continuar-info">

                    <div class="continuar-titulo">
                        ${escapar(item.titulo || "Conteúdo")}
                    </div>

                    <div class="continuar-progresso">
                        <div style="width:${progresso}%"></div>
                    </div>

                    <button
                        type="button"
                        class="continuar-btn"
                    >
                        ▶ Continuar
                    </button>

                    <button
                        type="button"
                        class="continuar-remover-btn"
                    >
                        🗑 Remover
                    </button>

                </div>
            `;

            const botao =
                card.querySelector(".continuar-btn");

            botao.addEventListener(
                "click",
                function(){
                    abrirConteudo(item);
                }
            );

            const remover =
                card.querySelector(".continuar-remover-btn");

            remover.addEventListener(
                "click",
                function(e){

                    e.preventDefault();
                    e.stopPropagation();

                    if(window.LukaContinuar){
                        LukaContinuar.remover(
                            item.id,
                            item.tipo || "filme"
                        );
                    }

                    carregar();
                }
            );

            container.appendChild(card);
        });
    }

    function iniciar(){
        carregar();
    }

    if(window.LukaContaPronta){
        window.LukaContaPronta.then(iniciar);
    }else{
        window.addEventListener(
            "lukafilmes:conta-pronta",
            iniciar,
            {once:true}
        );
    }

})();
</script>
</body>
</html>
