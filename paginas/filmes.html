<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="color-scheme" content="dark">

<title>Filmes - LUKALUKAFILMES ORIGINAL</title>

<style>
:root{
    --red:#e50914;
    --red-dark:#8b0008;
    --black:#050505;
    --white:#ffffff;
    --muted:rgba(255,255,255,.58);
    --border:rgba(255,255,255,.10);
}

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    min-height:100%;
    background:#050505;
    scroll-behavior:smooth;
}

body{
    margin:0;
    min-height:100vh;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 50% -15%,rgba(229,9,20,.30),transparent 38%),
        radial-gradient(circle at 0% 50%,rgba(120,0,8,.16),transparent 30%),
        radial-gradient(circle at 100% 70%,rgba(120,0,8,.14),transparent 30%),
        linear-gradient(180deg,#090909 0%,#050505 100%);
    overflow-x:hidden;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,.012) 50%,
            transparent 100%
        );
}

a{
    color:inherit;
    text-decoration:none;
}

/* ================= CONTAINER ================= */

.page{
    width:min(1280px,100%);
    margin:auto;
    padding:0 24px 60px;
}

/* ================= HEADER ================= */

.header{
    position:relative;
    height:76px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.07);
}

.logo{
    font-size:24px;
    font-weight:900;
    letter-spacing:-1px;
}

.logo-luka{
    color:#fff;
}

.logo-filmes{
    color:var(--red);
}

.back{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:0 18px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:11px;
    background:rgba(255,255,255,.045);
    color:#fff;
    font-size:13px;
    font-weight:700;
    transition:.2s ease;
}

.back:hover{
    border-color:rgba(229,9,20,.65);
    background:rgba(229,9,20,.10);
}

.back:active{
    transform:scale(.96);
}

/* ================= HERO ================= */

.hero{
    padding:78px 0 52px;
}

.kicker{
    margin:0 0 13px;
    color:var(--red);
    font-size:11px;
    font-weight:800;
    letter-spacing:3px;
    text-transform:uppercase;
}

.title{
    margin:0;
    max-width:900px;
    font-size:clamp(45px,7vw,78px);
    line-height:.95;
    letter-spacing:-4px;
    font-weight:900;
}

.title-red{
    color:var(--red);
}

.description{
    max-width:680px;
    margin:22px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.65;
}

/* ================= SECTION ================= */

.section-header{
    display:flex;
    align-items:end;
    justify-content:space-between;
    gap:20px;
    margin:0 0 20px;
}

.section-header h2{
    margin:0;
    font-size:19px;
    font-weight:800;
}

.section-header span{
    color:rgba(255,255,255,.35);
    font-size:12px;
}

/* ================= CATEGORIES ================= */

.categories{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:18px;
}

.category{
    --accent:rgba(229,9,20,.70);

    position:relative;
    min-height:190px;
    display:flex;
    align-items:flex-end;
    overflow:hidden;

    padding:28px;

    border:1px solid var(--border);
    border-radius:21px;

    background:
        radial-gradient(
            circle at 90% 10%,
            var(--accent),
            transparent 38%
        ),
        linear-gradient(
            135deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.018)
        );

    box-shadow:
        0 18px 45px rgba(0,0,0,.28);

    isolation:isolate;

    transition:
        transform .22s ease,
        border-color .22s ease,
        box-shadow .22s ease;
}

.category::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;

    background:
        linear-gradient(
            135deg,
            rgba(229,9,20,.18),
            transparent 50%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.38),
            transparent 65%
        );
}

.category::after{
    content:"";
    position:absolute;
    width:210px;
    height:210px;
    right:-100px;
    top:-100px;

    border-radius:50%;
    background:var(--accent);
    filter:blur(50px);
    opacity:.40;

    transition:.3s ease;
}

.category-line{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--red),
            transparent
        );

    opacity:.75;
}

.category-content{
    position:relative;
    z-index:2;
}

.category-label{
    display:block;
    margin-bottom:8px;

    color:rgba(255,255,255,.40);
    font-size:10px;
    font-weight:800;
    letter-spacing:2px;
}

.category-name{
    display:block;

    color:#fff;
    font-size:28px;
    line-height:1.05;
    font-weight:800;
    letter-spacing:-.7px;
}

.category-arrow{
    position:absolute;
    z-index:2;
    right:24px;
    bottom:21px;

    color:rgba(255,255,255,.45);
    font-size:40px;
    line-height:1;

    transition:.2s ease;
}

.category:hover{
    transform:translateY(-5px);
    border-color:rgba(229,9,20,.55);

    box-shadow:
        0 25px 55px rgba(0,0,0,.38),
        0 0 35px rgba(229,9,20,.08);
}

.category:hover::after{
    transform:scale(1.35);
    opacity:.60;
}

.category:hover .category-arrow{
    color:#fff;
    transform:translateX(5px);
}

.category:active{
    transform:scale(.985);
}


/* ================================================= */
/* ================ CAPAS DOS CARDS ================ */
/* ================================================= */

.category-bg{
    position:absolute;
    inset:0;
    z-index:-3;

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    opacity:0;
    transform:scale(1.03);

    transition:
        opacity .45s ease,
        transform .55s ease;
}

.category-bg.carregada{
    opacity:1;
}

.category::before{
    content:"";
    position:absolute;
    inset:0;
    z-index:-2;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.94) 0%,
            rgba(0,0,0,.70) 38%,
            rgba(0,0,0,.35) 70%,
            rgba(0,0,0,.62) 100%
        ),
        linear-gradient(
            0deg,
            rgba(0,0,0,.82) 0%,
            rgba(0,0,0,.20) 65%,
            rgba(229,9,20,.16) 100%
        );
}

.category::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:-1;

    width:auto;
    height:auto;

    right:auto;
    top:auto;

    border-radius:0;
    background:
        linear-gradient(
            135deg,
            rgba(229,9,20,.18),
            transparent 55%
        );

    filter:none;
    opacity:1;

    transition:opacity .25s ease;
}

.category:hover .category-bg{
    transform:scale(1.08);
}

.category:hover::after{
    transform:none;
    opacity:1;
}

.category-content{
    text-shadow:
        0 2px 10px rgba(0,0,0,.75),
        0 4px 22px rgba(0,0,0,.65);
}

.category-arrow{
    text-shadow:0 2px 12px rgba(0,0,0,.85);
}

@media(max-width:700px){

    .category::before{
        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,.90),
                rgba(0,0,0,.45)
            ),
            linear-gradient(
                0deg,
                rgba(0,0,0,.78),
                rgba(0,0,0,.12)
            );
    }

    .category-bg{
        transform:scale(1.04);
    }

    .category:hover .category-bg{
        transform:scale(1.06);
    }
}

@media(min-width:1600px){

    .category::before{
        background:
            linear-gradient(
                90deg,
                rgba(0,0,0,.91),
                rgba(0,0,0,.58) 48%,
                rgba(0,0,0,.30)
            ),
            linear-gradient(
                0deg,
                rgba(0,0,0,.78),
                transparent
            );
    }
}

/* ================= FOOTER ================= */

.footer{
    margin-top:55px;
    padding-top:25px;

    border-top:1px solid rgba(255,255,255,.06);

    color:rgba(255,255,255,.25);
    text-align:center;

    font-size:11px;
    letter-spacing:2px;
}

/* ================================================= */
/* ================= CELULAR ======================= */
/* ================================================= */

@media(max-width:700px){

    .page{
        width:100%;
        padding:
            0
            12px
            calc(30px + env(safe-area-inset-bottom));
    }

    .header{
        height:62px;
    }

    .logo{
        font-size:19px;
        letter-spacing:-.7px;
    }

    .back{
        min-height:37px;
        padding:0 13px;
        border-radius:10px;
        font-size:12px;
    }

    .hero{
        padding:48px 3px 32px;
    }

    .kicker{
        margin-bottom:11px;
        font-size:9px;
        letter-spacing:2.3px;
    }

    .title{
        font-size:40px;
        line-height:.97;
        letter-spacing:-2.5px;
    }

    .description{
        margin-top:15px;
        font-size:13px;
        line-height:1.55;
    }

    .section-header{
        margin:0 2px 14px;
    }

    .section-header h2{
        font-size:16px;
    }

    .section-header span{
        font-size:10px;
    }

    /*
       CELULAR:
       exatamente 2 categorias por linha
    */

    .categories{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .category{
        min-height:125px;
        padding:16px;

        border-radius:15px;
    }

    .category-label{
        margin-bottom:6px;
        font-size:7px;
        letter-spacing:1.2px;
    }

    .category-name{
        font-size:17px;
        line-height:1.08;
        letter-spacing:-.3px;
    }

    .category-arrow{
        right:11px;
        top:10px;
        bottom:auto;
        font-size:25px;
    }

    .category-line{
        height:2px;
    }

    .footer{
        margin-top:38px;
        padding-top:20px;
    }
}

/* ================================================= */
/* ================= TABLET ======================== */
/* ================================================= */

@media(min-width:701px) and (max-width:1100px){

    .page{
        padding-left:28px;
        padding-right:28px;
    }

    .hero{
        padding-top:65px;
    }

    .categories{
        gap:15px;
    }

    .category{
        min-height:175px;
        padding:24px;
    }

    .category-name{
        font-size:23px;
    }
}

/* ================================================= */
/* ================= COMPUTADOR ==================== */
/* ================================================= */

@media(min-width:1101px){

    .categories{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:22px;
    }

    .category{
        min-height:220px;
        padding:32px;
        border-radius:23px;
    }

    .category-name{
        font-size:31px;
    }

    .category-label{
        font-size:10px;
    }

    .category-arrow{
        right:28px;
        bottom:25px;
        font-size:44px;
    }
}

/* ================================================= */
/* ================= SMART TV ====================== */
/* ================================================= */

@media(min-width:1600px){

    .page{
        width:min(1540px,92vw);
    }

    .header{
        height:88px;
    }

    .logo{
        font-size:29px;
    }

    .back{
        min-height:50px;
        padding:0 23px;
        font-size:15px;
        border-radius:13px;
    }

    .hero{
        padding:105px 0 65px;
    }

    .kicker{
        font-size:13px;
        letter-spacing:3.5px;
    }

    .title{
        font-size:88px;
        letter-spacing:-5px;
    }

    .description{
        max-width:820px;
        font-size:19px;

    }

    .section-header{
        margin-bottom:27px;
    }

    .section-header h2{
        font-size:25px;
    }

    .section-header span{
        font-size:14px;
    }

    .categories{
        gap:28px;
    }

    .category{
        min-height:285px;
        padding:42px;
        border-radius:28px;
    }

    }

    .category-name{

/* ================================================= */
/* ================= TV 4K ========================= */
/* ================================================= */

@media(min-width:2200px){

    .page{
        width:min(1750px,90vw);
    }

    .categories{
        gap:32px;
    }

    .category{
        min-height:330px;

    }

    .category-name{

    }

    }
}

/* ================================================= */
/* ================ ACESSIBILIDADE ================= */
/* ================================================= */

.category:focus-visible,
.back:focus-visible,
.logo:focus-visible{
    outline:3px solid var(--red);
    outline-offset:5px;
}

@media(prefers-reduced-motion:reduce){

    html{
        scroll-behavior:auto;
    }

    .category{
        transition:none;
    }
}
</style>

<style id="lukafilmes-filmes-nova-pagina">

   LUKAFILMES — PÁGINA FILMES V2
   Base visual: página Categorias
   ========================================================= */

.page{
    padding-bottom:100px;
}

.filmes-hero{
    padding:78px 0 35px;
}

.filmes-hero .kicker{
    margin:0 0 13px;

    font-weight:800;

}

.filmes-hero h1{
    margin:0;

    font-size:clamp(45px,7vw,78px);

}

.filmes-hero h1 span{
    color:var(--red);
}

.filmes-hero p{
    max-width:680px;

    line-height:1.65;
}

/* ================= PESQUISA ================= */

.filmes-pesquisa{
    position:sticky;
    top:0;
    z-index:100;
    padding:14px 0;
    background:rgba(5,5,5,.90);
    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
}

.filmes-pesquisa-box{
    position:fixed !important;

    /* Espaço vazio acima de LUKAFILMES ORIGINAL */
    top:92px !important;
    left:50% !important;
    right:auto !important;

    width:min(440px,calc(100vw - 40px)) !important;
    max-width:none !important;

    margin:0 !important;
    padding:0 !important;

    opacity:0 !important;
    visibility:hidden !important;
    pointer-events:none !important;

    transform:translate(-50%,-8px) scale(.98) !important;
    transform-origin:center center !important;

    transition:
        opacity .18s ease,
        visibility .18s ease,
        transform .18s ease !important;
}

.filmes-pesquisa-box.aberta{
    opacity:1 !important;
    visibility:visible !important;
    pointer-events:auto !important;

    transform:translate(-50%,0) scale(1) !important;
}

#pesquisaFilmes{
    width:100%;
    height:54px;
    padding:0 20px;

    border:1px solid rgba(255,255,255,.12);
    border-radius:14px;

    outline:none;

    background:rgba(255,255,255,.055);
    color:#fff;

    font-size:15px;
    font-weight:600;

    box-sizing:border-box;

    transition:
        border-color .2s ease,
        background .2s ease,
        box-shadow .2s ease;
}

#pesquisaFilmes{
    text-align:center;
}

#pesquisaFilmes::placeholder{
    text-align:center;
}

#pesquisaFilmes:focus{
    border-color:rgba(229,9,20,.75);
    background:rgba(255,255,255,.075);
    box-shadow:0 0 0 3px rgba(229,9,20,.10);
}

/* ================= CABEÇALHO DA GRADE ================= */

.filmes-section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin:34px 0 20px;
}

.filmes-section-header h2{
    margin:0;
    font-size:22px;
    letter-spacing:-.5px;
}

#contadorFilmes{
    color:rgba(255,255,255,.50);
    font-size:12px;
    font-weight:700;
}

/* ================= GRADE ================= */

#gradeFilmes{
    display:grid;
    grid-template-columns:repeat(6,minmax(0,1fr));
    gap:20px 14px;
}

.filme-card{
    min-width:0;
    cursor:pointer;
    text-decoration:none;
    color:#fff;
}

.filme-capa{
    position:relative;
    width:100%;
    aspect-ratio:2 / 3;
    overflow:hidden;
    border-radius:10px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.08),
            rgba(255,255,255,.02)
        );

    transition:
        transform .2s ease,
        box-shadow .2s ease;

.filme-capa img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    transition:transform .25s ease;
}

.filme-card:hover .filme-capa{
    transform:translateY(-4px);
    box-shadow:0 14px 35px rgba(0,0,0,.48);
}

.filme-card:hover .filme-capa img{

}

.filme-titulo{

    font-size:13px;
    line-height:1.3;

    overflow:hidden;
}

.filme-ano{

/* ================= CARREGAMENTO ================= */

    font-size:13px;

}

    font-size:12px;

#semFilmes{
    display:none;
    padding:60px 20px;
    text-align:center;
    color:rgba(255,255,255,.55);

/* ================= RESPONSIVO ================= */

<script>
function togglePesquisaFilmes(){
    const box = document.getElementById("filmesPesquisaBox");
    const btn = document.querySelector(".filmes-search-btn");
    const input = document.getElementById("pesquisaFilmes");

    if(!box || !input) return;

    const aberta = box.classList.toggle("aberta");

    if(btn){
        btn.setAttribute("aria-expanded", aberta ? "true" : "false");
    }

    if(aberta){
        setTimeout(() => input.focus(), 120);
    }else{
        input.blur();
    }
}
</script>

<script id="lukafilmes-bloqueio-flash-inicial-js">
(function () {
    document.documentElement.classList.add("lukafilmes-carregando");

    function liberarHeroFilmes() {
        document.documentElement.classList.remove("lukafilmes-carregando");

        var hero = document.getElementById("heroFilmes");
        if (hero) {
            hero.style.visibility = "visible";
            hero.style.opacity = "1";
        }
    }

    window.addEventListener("load", function () {
        requestAnimationFrame(function () {
            requestAnimationFrame(liberarHeroFilmes);
        });
    }, { once: true });
})();
</script>


<style id="lukafilmes-flash-zero">
/* =========================================================
   BLOQUEIO ABSOLUTO DO HERO NO PRIMEIRO PAINT
   Impede "LUKAFILMES ORIGINAL" e "Filmes em destaque"
   de aparecerem antes do Hero real estar pronto.
   ========================================================= */

html.lukafilmes-flash-zero #heroFilmes {
    visibility: hidden !important;
    opacity: 0 !important;
    pointer-events: none !important;
}

/* Em páginas filtradas por categoria, remover somente o logo LUKAFILMES do topo */
html.lukafilmes-pagina-categoria .header .logo {
    display: none !important;
}
</style>

<script id="lukafilmes-flash-zero-js">
(function () {
    var html = document.documentElement;

    /* Em páginas de categoria, remove imediatamente o logo do topo */
    if (new URLSearchParams(window.location.search).get("categoria")) {
        html.classList.add("lukafilmes-pagina-categoria");
    }

    /* Executa imediatamente, antes da montagem do Hero */
    html.classList.add("lukafilmes-flash-zero");

    function liberar() {
        html.classList.remove("lukafilmes-flash-zero");

        var hero = document.getElementById("heroFilmes");

        if (hero) {
            hero.style.visibility = "visible";
            hero.style.opacity = "1";
            hero.style.pointerEvents = "";
        }
    }

    /*
     * Aguarda a página terminar de carregar.
     * Dois frames evitam revelar o HTML intermediário.
     */
    if (document.readyState === "complete") {
        requestAnimationFrame(function () {
            requestAnimationFrame(liberar);
        });
    } else {
        window.addEventListener("load", function () {
            requestAnimationFrame(function () {
                requestAnimationFrame(liberar);
            });
        }, { once: true });
    }
})();
</script>

                    let lista=[];

                    try{
                        lista=JSON.parse(
                            localStorage.getItem(
                                "lukafilmes_minhalista"
                            )||"[]"
                        );
                    }catch(e){
                        lista=[];
                    }

                    if(!Array.isArray(lista))
                        lista=[];

                    const id=String(
                        filme.id ||
                        filme.tmdb_id ||
                        filme.titulo ||
                        filme.nome ||
                        ""
                    );

                    const pos=lista.findIndex(function(item){

                        return String(
                            item.id ||
                            item.tmdb_id ||
                            item.titulo ||
                            item.nome ||
                            ""
                        )===id;

                    });

                    if(pos===-1){

                        lista.push(
                            Object.assign(
                                {},
                                filme,
                                {
                                    tipo:"filme",
                                    media_type:"tv"
                                }
                            )
                        );

                    }else{

                        lista.splice(pos,1);

                    }

                    localStorage.setItem(
                        "lukafilmes_minhalista",
                        JSON.stringify(lista)
                    );

                    atualizar();

                };

                atualizar();

            }

        }

        /*
         * MOSTRA A CAPA AGORA.
         */
        mostrarHeroSerie();

        /*
         * Depois carrega o restante em segundo plano.
         */
        (async function(){

            const mapa=new Map();

            primeiraLista.forEach(function(filme){

                const id=String(
                    filme.id ||
                    filme.tmdb_id ||
                    filme.titulo ||
                    filme.nome ||
                    ""
                );

                if(id) mapa.set(id,filme);

            });

            for(let pagina=2;pagina<=100;pagina++){

                try{

                    const resposta=
                        await fetch(
                            "/api/catalogo-filmes?pagina="+pagina
                        );

                    if(!resposta.ok)continue;

                    const dados=
                        await resposta.json();

                    const lista=
                        Array.isArray(dados.filmes)
                        ?dados.filmes
                        :[];

                    if(!lista.length)break;

                    lista.forEach(function(filme){

                        const id=String(
                            filme.id ||
                            filme.tmdb_id ||
                            filme.titulo ||
                            filme.nome ||
                            ""
                        );

                        const fundo=
                            filme.fundo ||
                            filme.backdrop_path ||
                            filme.capa ||
                            "";

                        if(id && fundo && !mapa.has(id)){
                            mapa.set(id,filme);
                        }

                    });

                }catch(e){}

            }

            const novas=
                Array.from(mapa.values()).filter(function(filme){

                    return (
                        filme.fundo ||
                        filme.backdrop_path ||
                        filme.capa
                    );

                }).slice(0,2000);

            if(novas.length){

                catalogoHero=novas;

                catalogoHero.sort(function(){
                    return Math.random()-0.5;
                });

                console.log(
                    "[HERO SERIES] Catálogo ampliado:",
                    catalogoHero.length,
                    "capas"
                );

            }

        })();

        /*
         * Troca automática.
         */
        setInterval(
            mostrarHeroSerie,
            10000
        );

    }catch(erro){

        console.error(
            "[HERO SERIES] ERRO:",
            erro
        );

    }
}

<script>
(function(){

    const grade =
        document.getElementById("gradeFilmes");

    const pesquisa =
        document.getElementById("pesquisaFilmes");

    const carregando =
        document.getElementById("carregandoFilmes");

    const semFilmes =
        document.getElementById("semFilmes");

    const fimFilmes =
        document.getElementById("fimFilmes");

    const contador =
        document.getElementById("contadorFilmes");

    if(!grade || !pesquisa){
        return;
    }

    const FILMES_POR_PAGINA = 20;
    const MAX_FILMES = 10000;

    /*
     * A cada atualização começamos em uma página
     * aleatória do catálogo.
     *
     * Assim a primeira sequência de 20 filmes
     * não é sempre a mesma.
     */
    let paginaAtual =
        Math.floor(Math.random() * 100) + 1 - 1;

    let totalCarregado = 0;
    let carregandoAgora = false;
    let acabou = false;

    let todosFilmes = [];

    const ids =
        new Set();

    const params =
        new URLSearchParams(
            window.location.search
        );

    const categoria =
        String(
            params.get("categoria") || ""
        ).trim();

    const tituloGrade =
        document.getElementById(
            "tituloGradeFilmes"
        );

    if(
        categoria &&
        tituloGrade
    ){

        const nomesCategorias = {
            acao:"Filmes de Ação",
            aventura:"Filmes de Aventura",
            comedia:"Filmes de Comédia",
            terror:"Filmes de Terror",
            romance:"Filmes de Romance",
            fantasia:"Filmes de Fantasia",
            suspense:"Filmes de Suspense",
            drama:"Filmes de Drama",
            "ficcao-cientifica":
                "Filmes de Ficção Científica",
            animacao:"Filmes de Animação"
        };

        tituloGrade.textContent =
            nomesCategorias[categoria] ||
            "Filmes";
    }

    function obterId(filme){

        return String(
            filme?.id ||
            filme?.tmdb_id ||
            filme?.movie_id ||
            ""
        ).trim();
    }

    function obterTitulo(filme){

        return String(
            filme?.titulo ||
            filme?.title ||
            filme?.nome ||
            filme?.name ||
            "Filme"
        ).trim();
    }

    function obterImagem(filme){

        return String(
            filme?.capa ||
            filme?.poster ||
            filme?.poster_path ||
            filme?.imagem ||
            filme?.poster_url ||
            filme?.imagem_capa ||
            filme?.fundo ||
            ""
        ).trim();
    }

    function obterAno(filme){

        return String(
            filme?.ano ||
            filme?.release_year ||
            filme?.release_date ||
            ""
        ).slice(0,4);
    }

    function obterUrl(filme){

        const id =
            obterId(filme);

        if(!id){
            return "#";
        }

        return (
            "/paginas/filme.html?id=" +
            encodeURIComponent(id)
        );
    }

    function criarCard(filme){

        const link =
            document.createElement("a");

        link.className =
            "filme-card";

        link.href =
            obterUrl(filme);

        /*
         * GUARDA O FILME EXATO DO CARD.
         * O filme.html usa este mesmo ID para
         * recuperar o objeto correto.
         */
        link.addEventListener("click", function(){
            try{
                const id = obterId(filme);

                if(id){
                    localStorage.setItem(
                        "filmeSelecionadoHome_" + String(id),
                        JSON.stringify(filme)
                    );

                    localStorage.setItem(
                        "filmeSelecionado",
                        JSON.stringify(filme)
                    );
                }

                console.log(
                    "[FILMES] Filme selecionado:",
                    obterTitulo(filme),
                    id
                );

            }catch(e){
                console.warn(
                    "[FILMES] Erro ao salvar filme selecionado:",
                    e
                );
            }
        });

        const capa =
            document.createElement("div");

        capa.className =
            "filme-capa";

        const imagem =
            obterImagem(filme);

        if(imagem){

            const img =
                document.createElement("img");

            img.loading = "lazy";

            img.decoding = "async";

            img.src = imagem;

            img.alt =
                obterTitulo(filme);

            img.onerror =
                function(){

                    this.style.display =
                        "none";

                };

            capa.appendChild(img);

        }

        const titulo =
            document.createElement("div");

        titulo.className =
            "filme-titulo";

        titulo.textContent =
            obterTitulo(filme);

        link.appendChild(capa);
        link.appendChild(titulo);

        const ano =
            obterAno(filme);

        if(ano){

            const anoEl =
                document.createElement("div");

            anoEl.className =
                "filme-ano";

            anoEl.textContent =
                ano;

            link.appendChild(anoEl);
        }

        return link;
    }

    function atualizarContador(){

        contador.textContent =
            todosFilmes.length.toLocaleString(
                "pt-BR"
            ) +
            " filmes";
    }

    function renderizar(){

        grade.innerHTML = "";

        const termo =
            pesquisa.value
                .trim()
                .toLowerCase();

        const lista =
            termo
                ? todosFilmes.filter(filme => {

                    const titulo =
                        obterTitulo(filme)
                            .toLowerCase();

                    return titulo.includes(termo);

                })
                : todosFilmes;

        semFilmes.style.display =
            lista.length
                ? "none"
                : "block";

        for(const filme of lista){

            grade.appendChild(
                criarCard(filme)
            );
        }

        atualizarContador();
    }

    async function carregarProximaPagina(){

        if(
            carregandoAgora ||
            acabou ||
            totalCarregado >= MAX_FILMES
        ){
            return;
        }

        carregandoAgora = true;

        carregando.style.display =
            "block";

        const proximaPagina =
            paginaAtual + 1;

        try{

            let url =
                "/api/catalogo-filmes?pagina=" +
                proximaPagina;

            if(categoria){

                url +=
                    "&categoria=" +
                    encodeURIComponent(
                        categoria
                    );
            }

            const resposta =
                await fetch(
                    url,
                    {
                        cache:"no-store"
                    }
                );

            if(!resposta.ok){
                throw new Error(
                    "HTTP " +
                    resposta.status
                );
            }

            const dados =
                await resposta.json();

            let filmes =
                Array.isArray(
                    dados.filmes
                )
                    ? dados.filmes
                    : [];

            /*
             * Embaralha os filmes recebidos para que
             * a ordem também varie a cada atualização.
             */
            for(
                let i = filmes.length - 1;
                i > 0;
                i--
            ){
                const j =
                    Math.floor(
                        Math.random() * (i + 1)
                    );

                [filmes[i], filmes[j]] =
                    [filmes[j], filmes[i]];
            }

            let adicionados = 0;

            for(const filme of filmes){

                const id =
                    obterId(filme);

                if(
                    id &&
                    ids.has(id)
                ){
                    continue;
                }

                if(id){
                    ids.add(id);
                }

                todosFilmes.push(filme);

                adicionados++;
            }

            paginaAtual =
                proximaPagina;

            totalCarregado =
                Math.min(
                    MAX_FILMES,
                    todosFilmes.length
                );

            if(
                dados.acabou ||
                !filmes.length ||
                totalCarregado >= MAX_FILMES
            ){
                acabou = true;
                fimFilmes.style.display =
                    "block";
            }

            renderizar();

            console.log(
                "[FILMES] Página:",
                paginaAtual,
                "| Recebidos:",
                filmes.length,
                "| Novos:",
                adicionados,
                "| Total:",
                totalCarregado
            );

        }catch(erro){

            console.error(
                "[FILMES] Erro:",
                erro
            );

        }finally{

            carregandoAgora =
                false;

            carregando.style.display =
                "none";
        }
    }

    let pesquisaNumero = 0;
    let pesquisaTimer = null;

    async function pesquisarFilmesHome(termo){

        const numeroAtual =
            ++pesquisaNumero;

        termo =
            String(termo || "").trim();

        if(!termo){

            todosFilmes = [];
            ids.clear();

            acabou = false;
            totalCarregado = 0;

            paginaAtual =
                Math.floor(Math.random() * 100) + 1 - 1;

            fimFilmes.style.display =
                "none";

            semFilmes.style.display =
                "none";

            renderizar();

            carregarProximaPagina();

            return;
        }

        carregando.style.display =
            "block";

        semFilmes.style.display =
            "none";

        fimFilmes.style.display =
            "none";

        try{

            const resposta =
                await fetch(
                    "/api/pesquisar?q=" +
                    encodeURIComponent(termo),
                    {
                        cache: "no-store"
                    }
                );

            if(!resposta.ok){
                throw new Error(
                    "HTTP " + resposta.status
                );
            }

            const dados =
                await resposta.json();

            if(numeroAtual !== pesquisaNumero){
                return;
            }

            const resultados =
                Array.isArray(dados.resultados)
                    ? dados.resultados
                    : [];

            todosFilmes = [];
            ids.clear();

            for(const filme of resultados){

                const id =
                    obterId(filme);

                if(
                    id &&
                    ids.has(id)
                ){
                    continue;
                }

                if(id){
                    ids.add(id);
                }

                todosFilmes.push(filme);
            }

            totalCarregado =
                todosFilmes.length;

            acabou = true;

            renderizar();

            if(!todosFilmes.length){
                semFilmes.style.display =
                    "block";
            }

        }catch(erro){

            console.error(
                "[PESQUISA FILMES]",
                erro
            );

            if(
                numeroAtual ===
                pesquisaNumero
            ){

                todosFilmes = [];
                ids.clear();

                totalCarregado = 0;
                acabou = true;

                renderizar();

                semFilmes.style.display =
                    "block";
            }

        }finally{

            if(
                numeroAtual ===
                pesquisaNumero
            ){

                carregando.style.display =
                    "none";
            }
        }
    }

    pesquisa.addEventListener(
        "input",
        function(){

            clearTimeout(
                pesquisaTimer
            );

            const termo =
                pesquisa.value.trim();

            if(!termo){

                pesquisaNumero++;

                pesquisaTimer =
                    setTimeout(
                        () => {
                            pesquisarFilmesHome("");
                        },
                        150
                    );

                return;
            }

            pesquisaTimer =
                setTimeout(
                    () => {
                        pesquisarFilmesHome(
                            termo
                        );
                    },
                    350
                );
        }
    );

    /*
     * Pesquisa recebida da Home:
     * /paginas/filmes.html?busca=...
     */
    const buscaInicial =
        String(
            new URLSearchParams(
                window.location.search
            ).get("busca") || ""
        ).trim();

    if(buscaInicial){

        pesquisa.value =
            buscaInicial;

        setTimeout(
            () => {
                pesquisarFilmesHome(
                    buscaInicial
                );
            },
            100
        );
    }

    /*
     * Infinite scroll.
     *
     * Quando faltar aproximadamente
     * 900px para o final da página,
     * buscamos mais 20 filmes.
     */

    let ultimoScroll =
        0;

    window.addEventListener(
        "scroll",
        function(){

            const altura =
                document.documentElement.scrollHeight;

            const posicao =
                window.scrollY +
                window.innerHeight;

            if(
                posicao >= altura - 900 &&
                posicao >= ultimoScroll
            ){

                ultimoScroll =
                    posicao;

                carregarProximaPagina();
            }

        },
        {
            passive:true
        }
    );

    /*
     * Também usamos IntersectionObserver.
     * Isso torna o carregamento mais confiável
     * no celular e no touch.
     */

    const observador =
        new IntersectionObserver(
            function(entradas){

                if(
                    entradas.some(
                        entrada =>
                            entrada.isIntersecting
                    )
                ){

                    carregarProximaPagina();

                }

            },
            {
                root:null,
                rootMargin:"900px",
                threshold:0
            }
        );

    observador.observe(
        fimFilmes
    );

    /*
     * Primeiros 20 filmes.
     */

    carregarProximaPagina();

})();
</script>
