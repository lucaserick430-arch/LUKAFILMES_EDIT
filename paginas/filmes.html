/* ==========================================
   FUNDO CINEMATOGRÁFICO
   IGUAL AO LOGIN
   ========================================== */

html,
body {
    min-height: 100%;
}

body {
    position: relative;
    background: #000 !important;
}

/* VÍDEO */
#fundoFilmes {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    z-index: 0;
    pointer-events: none;
}

/* IFRAME DO TRAILER */
#trailerFilmes {
    position: absolute;
    top: 50%;
    left: 50%;

    width: 120vw;
    height: 67.5vw;

    min-width: 177.78vh;
    min-height: 100vh;

    transform:
        translate(-50%, -50%)
        scale(1.12);

    border: 0;
    pointer-events: none;
}

/* ESCURECIMENTO */
#fundoFilmesEscuro {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    z-index: 1;
    pointer-events: none;

    background:
        linear-gradient(
            90deg,
            rgba(0,0,0,.90),
            rgba(0,0,0,.58),
            rgba(0,0,0,.82)
        ),
        linear-gradient(
            180deg,
            rgba(0,0,0,.65),
            transparent 40%,
            rgba(0,0,0,.95)
        );
}

/* CONTEÚDO DA PÁGINA NA FRENTE */
.pagina {
    position: relative;
    z-index: 2;
}

/* TOPO TRANSPARENTE */
.topo {
    position: relative;
    z-index: 3;

    background: linear-gradient(180deg, rgba(20,20,20,.92), rgba(20,20,20,.55));

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    border-radius: 0;
    padding: 18px 24px;

    border: 1px solid rgba(255,255,255,.08);
}

/* CARDS NA FRENTE */
.grade {
    position: relative;
    z-index: 3;
}

.grade .filme {
    position: relative;
    z-index: 3;

    background: rgba(18,18,18,.88);

    box-shadow:
        0 12px 35px rgba(0,0,0,.60);

    transition:
        transform .3s ease,
        box-shadow .3s ease;
}

.grade .filme:hover {
    transform:
        translateY(-8px)
        scale(1.03);

    box-shadow:
        0 20px 50px rgba(0,0,0,.80),
        0 0 20px rgba(229,9,20,.20);
}

.grade .filme img {
    transition: transform .45s ease;
}

.grade .filme:hover img {
    transform: scale(1.06);
}

@media (max-width: 700px) {

    #trailerFilmes {
        transform:
            translate(-50%, -50%)
            scale(1.35);
    }

}

                id="trailerFilmes"
                title="Trailer do filme"

            </iframe>
        </div>

                Escolha um filme para começar a assistir.
            </p>

                <button id="heroAssistir" class="btn-assistir">
                    ▶ Assistir
                </button>

                </button>

        <div id="grade" class="lista-series filmes-grade-series"></div>

<script>

let paginaFilmes = 1;
let carregandoFilmes = false;
let acabouFilmes = false;

const filmesCarregados = new Set();

async function carregarFilmes() {

    if (carregandoFilmes || acabouFilmes) {
        return;
    }

    carregandoFilmes = true;

    const grade = document.getElementById("grade");

    try {

        const resposta = await fetch(
            "/api/catalogo-filmes?pagina=" + paginaFilmes
        );

        const dados = await resposta.json();

        if (!dados.sucesso) {
            throw new Error(
                dados.mensagem || "Erro no catálogo"
            );
        }

        const filmes = Array.isArray(dados.filmes)
            ? dados.filmes
            : [];

        let adicionados = 0;
        const primeiroLote = [];

        for (const filme of filmes) {

            const id = String(
                filme.id ||
                filme.tmdb_id ||
                filme.titulo ||
                ""
            ).trim();

            if (!id || filmesCarregados.has(id)) {
                continue;
            }

            filmesCarregados.add(id);

            primeiroLote.push(filme);

            const criarCard = function(filme) {

                const card = document.createElement("div");

                card.className = "filme";

                card.innerHTML =
                    '<img src="' +
                    (filme.capa || "") +
                    '" alt="' +
                    (filme.titulo || "Filme") +
                    '">' +
                    '<div class="info">' +
                    '<h3>' +
                    (filme.titulo || "Sem título") +
                    '</h3>' +
                    '<p>' +
                    (filme.ano || "") +
                    '</p>' +
                    '</div>';

                card.onclick = function() {

                    localStorage.setItem(
                        "filmeSelecionado",
                        JSON.stringify(filme)
                    );

                    sessionStorage.setItem(
                        "lukafilmes_estado_filmes",
                        JSON.stringify({
                            pagina: paginaFilmes,
                            scroll: window.scrollY
                        })
                    );

                    location.href =
                        "/paginas/filme.html";
                };

                return card;
            };

            /*
             * Todos os filmes continuam
             * aparecendo no catálogo completo.
             */
            grade.appendChild(
                criarCard(filme)
            );

            adicionados++;
        }

        /*
         * Envia o primeiro lote para o Hero Netflix.
         */
        if (
            paginaFilmes === 1 &&
            primeiroLote.length
        ) {

            window.dispatchEvent(
                new CustomEvent(
                    "filmes-primeiro-lote",
                    {
                        detail: primeiroLote
                    }
                )
            );
        }

        if (paginaFilmes === 1 && adicionados === 0) {

            grade.innerHTML =
                '<div class="carregando">' +
                'Nenhum filme encontrado.' +
                '</div>';

        }

        if (dados.acabou || filmes.length === 0) {

            acabouFilmes = true;

            const fim = document.createElement("div");

            fim.className = "carregando";

            fim.textContent =
                "Você chegou ao fim do catálogo.";

            grade.appendChild(fim);

        } else {

            paginaFilmes++;
        }

    } catch (erro) {

        console.error(
            "[FILMES]",
            erro
        );

    } finally {

        carregandoFilmes = false;
    }
}

/*
 * Primeiros 40 filmes:
 * duas páginas do nosso endpoint.
 */

async function carregarPrimeirosFilmes() {

    await carregarFilmes();

    if (!acabouFilmes) {
        await carregarFilmes();
    }
}


/*
 * Carrega mais filmes quando o usuário
 * chega perto do final da página.
 */

window.addEventListener(
    "scroll",
    function() {

        if (carregandoFilmes || acabouFilmes) {
            return;
        }

        const distancia =
            document.documentElement.scrollHeight -
            (
                window.scrollY +
                window.innerHeight
            );

        if (distancia < 1000) {
            carregarFilmes();
        }
    },
    {
        passive: true
    }
);


async function iniciarFilmesComEstado() {

    const salvo = sessionStorage.getItem(
        "lukafilmes_estado_filmes"
    );

    if (!salvo) {
        await carregarPrimeirosFilmes();
        return;
    }

    let estado;

    try {
        estado = JSON.parse(salvo);
    } catch (e) {
        sessionStorage.removeItem(
            "lukafilmes_estado_filmes"
        );
        await carregarPrimeirosFilmes();
        return;
    }

    const paginasSalvas = Math.max(
        1,
        Number(estado.pagina || 1)
    );

    paginaFilmes = 1;

    for (let i = 0; i < paginasSalvas; i++) {
        await carregarFilmes();
    }

    sessionStorage.removeItem(
        "lukafilmes_estado_filmes"
    );

    setTimeout(function () {
        window.scrollTo({
            top: Number(estado.scroll || 0),
            behavior: "instant"
        });
    }, 700);
}

iniciarFilmesComEstado();

</script>

<script id="hero-filmes-js">
(function(){

    /*
     * =========================================================
     * HERO DINÂMICO — TRAILER AUTOMÁTICO DOS FILMES
     * =========================================================
     *
     * A cada atualização:
     * 1. busca a primeira página do catálogo;
     * 2. escolhe um filme aleatório;
     * 3. procura o trailer no TMDB;
     * 4. o TMDB devolve o vídeo do YouTube;
     * 5. autoplay + mute + loop;
     * 6. mantém título, ano, nota, sinopse e Assistir.
     *
     * NÃO altera o carregamento infinito.
     * NÃO altera a pesquisa.
     */

    let filmeHeroAtual = null;


    function configurarTextoHero(filme){

        if(!filme) return;

        filmeHeroAtual = filme;

        const titulo =
            filme.titulo ||
            filme.nome ||
            filme.title ||
            "Filme";

        const ano =
            filme.ano ||
            (
                filme.release_date
                    ? String(filme.release_date).substring(0,4)
                    : ""
            );

        const nota =
            filme.nota ??
            filme.avaliacao ??
            filme.vote_average ??
            "";

        const sinopse =
            filme.sinopse ||
            filme.overview ||
            filme.descricao ||
            "Assista agora no LUKAFILMES.";

        const tituloEl =
            document.getElementById("heroTitulo");

        const anoEl =
            document.getElementById("heroAno");

        const notaEl =
            document.getElementById("heroNota");

        const sinopseEl =
            document.getElementById("heroSinopse");

        if(tituloEl)
            tituloEl.textContent = titulo;

        if(anoEl)
            anoEl.textContent = ano || "";

        if(notaEl)
            notaEl.textContent =
                nota
                    ? "★ " + Number(nota).toFixed(1)
                    : "";

        if(sinopseEl)
            sinopseEl.textContent = sinopse;
    }


    function colocarCapaFallback(filme){

        const hero =
            document.getElementById("heroFilme");

        if(!hero) return;

        const imagem =
            filme?.fundo ||
            filme?.backdrop ||
            filme?.capa ||
            "";

        if(!imagem) return;

        hero.style.backgroundImage =
            "linear-gradient(90deg," +
            "rgba(0,0,0,.97) 0%," +
            "rgba(0,0,0,.55) 52%," +
            "rgba(0,0,0,.80) 100%)," +
            "linear-gradient(0deg,#050505 0%,transparent 65%)," +
            "url('" +
            String(imagem).replace(/'/g,"\\'") +
            "')";

        hero.style.backgroundSize = "cover";
        hero.style.backgroundPosition = "center top";
    }


    function limparCapaQuandoTrailerEntrar(){

        const hero =
            document.getElementById("heroFilme");

        if(hero){
            hero.style.backgroundImage = "none";
        }
    }


    function colocarTrailer(trailer){

        const iframe =
            document.getElementById("trailerFilmes");

        if(!iframe || !trailer) {
            return false;
        }

        /*
         * A rota dos filmes usa "chave".
         * Aceitamos também "key" por segurança.
         */

        const chave =
            trailer.chave ||
            trailer.key ||
            "";

        if(!chave) {
            return false;
        }

        const key =
            encodeURIComponent(String(chave));

        iframe.src =
            "https://www.youtube.com/embed/" +
            key +
            "?autoplay=1" +
            "&mute=1" +
            "&controls=0" +
            "&loop=1" +
            "&playlist=" +
            key +
            "&rel=0" +
            "&modestbranding=1" +
            "&playsinline=1" +
            "&iv_load_policy=3";

        limparCapaQuandoTrailerEntrar();

        console.log(
            "[HERO FILMES] TRAILER OK:",
            filmeHeroAtual?.titulo ||
            filmeHeroAtual?.nome ||
            "",
            chave
        );

        return true;
    }


    async function buscarTrailer(filme){

        const id =
            filme?.id ||
            filme?.tmdb_id;

        if(!id) {
            return null;
        }

        try{

            const resposta =
                await fetch(
                    "/api/filme/" +
                    encodeURIComponent(id) +
                    "/videos"
                );

            if(!resposta.ok){

                console.warn(
                    "[HERO FILMES] API trailer HTTP:",
                    resposta.status,
                    id
                );

                return null;
            }

            const dados =
                await resposta.json();

            if(!dados?.sucesso){

                console.warn(
                    "[HERO FILMES] API sem sucesso:",
                    id,
                    dados
                );

                return null;
            }

            return dados.trailer || null;

        }catch(erro){

            console.warn(
                "[HERO FILMES] Erro trailer:",
                erro
            );

            return null;
        }
    }


    function configurarBotoes(){

        const botaoAssistir =
            document.getElementById(
                "heroAssistir"
            );

        if(botaoAssistir){

            botaoAssistir.onclick =
                function(){

                    if(!filmeHeroAtual)
                        return;

                    localStorage.setItem(
                        "filmeSelecionado",
                        JSON.stringify(
                            filmeHeroAtual
                        )
                    );

                    window.location.href =
                        "/paginas/filme.html";
                };
        }


        const botaoLista =
            document.getElementById(
                "heroLista"
            );

        if(!botaoLista)
            return;

        botaoLista.onclick =
            function(){

                if(!filmeHeroAtual)
                    return;

                let lista = [];

                try{

                    lista =
                        JSON.parse(
                            localStorage.getItem(
                                "lukafilmes_minhalista"
                            ) || "[]"
                        );

                }catch(e){

                    lista = [];
                }

                const id =
                    String(
                        filmeHeroAtual.id ||
                        filmeHeroAtual.tmdb_id ||
                        filmeHeroAtual.titulo ||
                        filmeHeroAtual.nome ||
                        ""
                    );

                const existe =
                    lista.some(
                        function(item){

                            return String(
                                item.id ||
                                item.tmdb_id ||
                                item.titulo ||
                                item.nome ||
                                ""
                            ) === id;

                        }
                    );

                if(!existe){

                    lista.push(
                        filmeHeroAtual
                    );

                    localStorage.setItem(
                        "lukafilmes_minhalista",
                        JSON.stringify(lista)
                    );
                }

                botaoLista.textContent =
                    existe
                        ? "✓ Na minha lista"
                        : "✓ Adicionada";
            };
    }


    async function iniciarHeroFilmes(){

        try{

            /*
             * Busca os primeiros filmes do mesmo
             * catálogo usado pela página.
             */

            const resposta =
                await fetch(
                    "/api/catalogo-filmes?pagina=1"
                );

            if(!resposta.ok){

                console.warn(
                    "[HERO FILMES] Catálogo HTTP:",
                    resposta.status
                );

                return;
            }

            const dados =
                await resposta.json();

            const filmes =
                Array.isArray(dados.filmes)
                    ? dados.filmes
                    : Array.isArray(dados.resultados)
                        ? dados.resultados
                        : [];

            if(!filmes.length){

                console.warn(
                    "[HERO FILMES] Nenhum filme recebido."
                );

                return;
            }

            /*
             * Embaralha para trocar o destaque
             * a cada atualização.
             */

            const embaralhados =
                filmes
                    .slice()
                    .sort(
                        () => Math.random() - 0.5
                    );

            /*
             * Evita repetir o último destaque
             * quando houver outras opções.
             */

            const ultimo =
                sessionStorage.getItem(
                    "lukafilmes_ultimo_hero_filme"
                );

            let candidatos =
                embaralhados.filter(
                    filme =>
                        String(
                            filme.id ||
                            filme.tmdb_id ||
                            ""
                        ) !== String(ultimo || "")
                );

            if(!candidatos.length)
                candidatos = embaralhados;


            /*
             * Tenta vários filmes até encontrar
             * um que realmente tenha trailer.
             */

            for(const filme of candidatos){

                configurarTextoHero(filme);

                configurarBotoes();

                colocarCapaFallback(filme);

                const trailer =
                    await buscarTrailer(filme);

                if(
                    trailer &&
                    (
                        trailer.chave ||
                        trailer.key
                    )
                ){

                    const colocado =
                        colocarTrailer(
                            trailer
                        );

                    if(colocado){

                        sessionStorage.setItem(
                            "lukafilmes_ultimo_hero_filme",
                            String(
                                filme.id ||
                                filme.tmdb_id ||
                                ""
                            )
                        );

                        return;
                    }
                }
            }


            /*
             * Se nenhum filme tiver trailer,
             * mantém a capa do primeiro candidato.
             */

            const fallback =
                candidatos[0];

            if(fallback){

                configurarTextoHero(
                    fallback
                );

                configurarBotoes();
                colocarCapaFallback(
                    fallback
                );
            }

            console.warn(
                "[HERO FILMES] Nenhum trailer encontrado."
            );

        }catch(erro){

            console.error(
                "[HERO FILMES] Erro:",
                erro
            );
        }
    }


    /*
     * Espera o HTML terminar de carregar.
     */

    if(
        document.readyState === "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            iniciarHeroFilmes
        );

    }else{

        iniciarHeroFilmes();
    }

})();
</script>

</html>
