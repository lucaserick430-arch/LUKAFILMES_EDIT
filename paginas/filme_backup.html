<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>LUKAFILMES</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <style>

        .pagina-filme {
            min-height: 100vh;
            padding: 50px 8%;
            background: #080808;
        }

        .barra-navegacao { display:flex; align-items:center; gap:15px; margin-bottom:35px; } .voltar { border:0; cursor:pointer; font-size:16px;
            display: inline-block;
            margin-bottom: 35px;
            color: white;
            text-decoration: none;
            background: #222;
            padding: 12px 18px;
            border-radius: 5px;
        }

        .voltar:hover {
            background: #e50914;
        }

        .detalhes {
            display: flex;
            gap: 40px;
            max-width: 1100px;
        }

        .poster {
            width: 280px;
            flex-shrink: 0;
        }

        .poster img {
            width: 100%;
            display: block;
            border-radius: 8px;
        }

        .informacoes {
            max-width: 700px;
        }

        .informacoes h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .informacoes p {
            color: #ccc;
            line-height: 1.7;
            margin: 15px 0;
        }

        .assistir {
            display: inline-block;
            margin-top: 20px;
            padding: 15px 30px;
            background: #e50914;
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
        }

        .assistir:hover {
            background: #b20710;
        }

        @media (max-width: 700px) {

            .detalhes {
                flex-direction: column;
            }

            .poster {
                width: 200px;
            }

            .informacoes h1 {
                font-size: 32px;
            }

        }

    </style>

</head>

<body>

<div class="pagina-filme">

    <a
        href="../index.html"
        class="voltar"
    >
        ← Voltar
    </a>


    <div class="detalhes">

        <div class="poster">

            <img
                id="poster"
                src=""
                alt=""
            >

        </div>


        <div class="informacoes">

            <h1 id="titulo">
                Carregando...
            </h1>

            <p id="dados"></p>

            <p id="sinopse"></p>

            <a
                href="#"
                class="assistir"
                id="botaoAssistir"
            >
                ▶ ASSISTIR
            </a>

        </div>

    </div>

</div>


<script>

    const filmeSalvo =
        localStorage.getItem("filmeSelecionado");

    if (filmeSalvo) {

        const filme =
            JSON.parse(filmeSalvo);

        document.getElementById("titulo")
            .textContent = filme.titulo;

        document.getElementById("poster")
            .src = filme.capa;

        document.getElementById("poster")
            .alt = filme.titulo;

        document.getElementById("dados")
            .textContent =
            "⭐ " +
            filme.nota +
            "  •  " +
            filme.ano +
            "  •  " +
            filme.genero;

        document.getElementById("sinopse")
            .textContent =
            filme.sinopse;

    }

function voltarPagina() { if (document.referrer && history.length > 1) { history.back(); } else { window.location.href = ../index.html; } }`r`n`r`n</script>

</body>

</html>
