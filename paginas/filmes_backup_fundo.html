<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LUKAFILMES - Filmes</title>
<link rel="stylesheet" href="../css/style.css">

<style>
body{
    margin:0;
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
}

.pagina{
    padding:25px 5%;
}

.topo{
    display:flex;
    align-items:center;
    gap:20px;
    margin-bottom:30px;
}

.voltar{
    background:#222;
    color:#fff;
    border:0;
    padding:10px 18px;
    border-radius:6px;
    cursor:pointer;
}

.grade{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:20px;
}

.filme{
    background:#151515;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:.2s;
}

.filme:hover{
    transform:scale(1.03);
}

.filme img{
    width:100%;
    height:240px;
    object-fit:cover;
    display:block;
}

.info{
    padding:10px;
}

.info h3{
    font-size:15px;
    margin:0 0 5px;
}

.info p{
    margin:0;
    color:#aaa;
    font-size:13px;
}

.carregando{
    text-align:center;
    padding:50px;
    color:#aaa;
}
</style>
</head>

<body>

<div class="pagina">

    <div class="topo">
        <button class="voltar" onclick="history.back()">← Voltar</button>
        <h1>🎬 Filmes</h1>
    </div>

    <div id="grade" class="grade">
        <div class="carregando">Carregando filmes...</div>
    </div>

</div>

<script>

async function carregarFilmes(){

    const grade = document.getElementById("grade");

    try{

        const resposta = await fetch("/api/catalogo");
        const dados = await resposta.json();

        if(!dados.sucesso){
            throw new Error("Erro no catálogo");
        }

        const vistos = new Set();

        grade.innerHTML = "";

        (dados.filmes || []).forEach(filme => {

            const id = String(filme.id);

            if(vistos.has(id)){
                return;
            }

            vistos.add(id);

            const card = document.createElement("div");

            card.className = "filme";

            card.innerHTML =
                '<img src="' + (filme.capa || "") + '" alt="">' +
                '<div class="info">' +
                '<h3>' + (filme.titulo || "Sem título") + '</h3>' +
                '<p>' + (filme.ano || "") + '</p>' +
                '</div>';

            card.onclick = function(){

                localStorage.setItem(
                    "filmeSelecionado",
                    JSON.stringify(filme)
                );

                location.href = "/paginas/filme.html";
            };

            grade.appendChild(card);

        });

    }catch(erro){

        console.error(erro);

        grade.innerHTML =
            '<div class="carregando">Não foi possível carregar os filmes.</div>';

    }

}

carregarFilmes();

</script>

</body>
</html>
