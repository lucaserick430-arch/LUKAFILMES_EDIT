    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .pagina-serie {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            padding-bottom: 80px;
            background: #050505;
        }

        /* ==========================================
           FUNDO
           ========================================== */

        .pagina-serie::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 780px;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(5, 5, 5, .15),
                    rgba(5, 5, 5, .30) 35%,
                    rgba(5, 5, 5, .65) 65%,
                    #050505 100%
                ),
                var(--fundo-serie);

            background-size: cover;

            background-position: center top;

            filter: blur(2px);

            transform: scale(1.03);

            opacity: .9;

            z-index: 0;
        }

        .pagina-serie::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 25%,
                    rgba(5, 5, 5, .25) 45%,
                    #050505 78%
                );

            z-index: 0;

            pointer-events: none;
        }


        /* ==========================================
           VOLTAR
           ========================================== */

        .voltar-area {

            position: relative;

            z-index: 5;

            max-width: 1200px;

            margin: auto;

            padding: 25px;
        }

        .voltar {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 11px 18px;

            color: #fff;

            text-decoration: none;

            background: rgba(0, 0, 0, .55);

            border: 1px solid rgba(255, 255, 255, .14);

            border-radius: 30px;

            backdrop-filter: blur(12px);

            font-weight: bold;

            transition: .25s;
        }

        .voltar:hover {

            background: #e50914;

            border-color: #e50914;

            transform: translateX(-3px);
        }


        /* ==========================================
           DETALHES
           ========================================== */

        .detalhes-serie {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1000px;

            margin: 40px auto 0;

            padding: 0 20px;

            text-align: center;
        }


        /* ==========================================
           CAPA
           ========================================== */

        .poster-serie {

            width: 270px;

            margin: 0 auto 25px;
        }

        .poster-serie img {

            width: 100%;

            display: block;

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, .18);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .9);
        }


        /* ==========================================
           TITULO
           ========================================== */

        #tituloSerie {

            margin: 0 0 15px;

            font-size: clamp(34px, 5vw, 58px);

            line-height: 1.05;

            font-weight: 900;

            text-shadow:
                0 8px 35px rgba(0, 0, 0, .95);
        }

        .dados-serie {

            color: #ddd;

            font-size: 15px;

            margin-bottom: 18px;
        }


        /* ==========================================
           SINOPSE
           ========================================== */

        .sinopse-box {

            width: 100%;

            max-width: 850px;

            margin: 25px auto 0;

            padding: 30px 35px;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 20px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55);
        }

        .sinopse-box h2 {

            margin: 0 0 15px;

            font-size: 22px;
        }

        .sinopse {

            margin: 0;

            color: #d1d1d1;

            font-size: 16px;

            line-height: 1.8;
        }


        /* ==========================================
           TEMPORADAS
           ========================================== */

        .temporadas {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);
        }

        .temporadas h2 {

            margin: 0 0 20px;

            font-size: 26px;
        }

        #selectTemporada {

            width: 100%;

            padding: 14px 16px;

            color: #fff;

            background: #151515;

            border: 1px solid rgba(255, 255, 255, .15);

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            cursor: pointer;
        }


        /* ==========================================
           EPISODIOS
           ========================================== */

        .episodios {

            margin-top: 25px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 14px;
        }

        .episodio {

    position: relative;

    padding: 20px 17px;

    text-align: center;

    color: #fff;

    background: rgba(0, 0, 0, .18);

    border: 1px solid rgba(255, 255, 255, .08);

    border-radius: 14px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    font-family: inherit;

    min-height: 145px;

    backdrop-filter: blur(4px);

    -webkit-backdrop-filter: blur(4px);
}

.episodio span {

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.episodio:hover {

    background: rgba(229, 9, 20, .18);

    border-color: rgba(229, 9, 20, .65);

    transform: translateY(-4px);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, .35);
}

.episodio:hover span {

    background: rgba(229, 9, 20, .9) !important;

    transform: scale(1.08);

    box-shadow:
        0 0 20px rgba(229, 9, 20, .35);
}

.episodio strong {

    display: block;

    margin-bottom: 6px;

    color: #fff;

    font-weight: 700;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, .8);
}

.episodio small {

    display: block;

    color: rgba(255, 255, 255, .58);

    line-height: 1.4;

    transition: color .25s ease;
}

.episodio:hover small {

    color: rgba(255, 255, 255, .9);
}
/* ==========================================
           PLAYER
           ========================================== */

        .player-serie {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);

            backdrop-filter: blur(16px);
        }

        .player-serie h2 {

            margin: 0 0 22px;

            font-size: 26px;
        }

        .player-video {

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #000;

            border-radius: 15px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .7);
        }

        .player-video iframe {

            width: 100%;

            height: 100%;

            border: 0;

            display: block;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 700px) {

            .voltar-area {

                padding: 18px 15px 0;
            }

            .detalhes-serie {

                margin-top: 35px;

                padding: 0 15px;
            }

            .poster-serie {

                width: 205px;
            }

            .sinopse-box {

                padding: 22px 20px;
            }

            .temporadas,
            .player-serie {

                width: calc(100% - 24px);

                padding: 18px 14px;

                border-radius: 17px;
            }

            .episodios {

                grid-template-columns: 1fr;
            }

            #tituloSerie {

                font-size: 36px;
            }

        }

    
/* =========================================================

<script>
/* LUKAFILMES — QR Code carregado somente quando necessário */
let lukaQRCodePromise = null;

function carregarQRCodeLuka() {

    if (typeof QRCode !== "undefined") {
        return Promise.resolve();
    }

    if (lukaQRCodePromise) {
        return lukaQRCodePromise;
    }

    lukaQRCodePromise = new Promise(function(resolve, reject) {

        const script = document.createElement("script");

        script.src =
            "https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js";

        script.onload = function() {
            resolve();
        };

        script.onerror = function() {
            lukaQRCodePromise = null;
            reject(new Error("Não foi possível carregar o QR Code."));
        };

        document.head.appendChild(script);
    });

    return lukaQRCodePromise;
}
</script>

<script>
async function mostrarPagamentoLuka(acesso, renovacao = false) {

                try {

                    let pagamento = null;

                    const respostaPagamento =
                        await fetch(
                            "/api/pagamentos/criar",
                            {
                                method: "POST",
                                credentials: "same-origin",
                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },
                                body: JSON.stringify(
                                    renovacao
                                        ? { renovacao: true }
                                        : {}
                                )
                            }
                        );

                    const dadosPagamento =
                        await respostaPagamento.json();

                    if (!respostaPagamento.ok ||
                        !dadosPagamento.sucesso) {

                        alert(
                            dadosPagamento.mensagem ||
                            "Não foi possível preparar o pagamento."
                        );

                        return;
                    }

                    if (
                        dadosPagamento.pagamento_necessario ===
                        false
                    ) {

                        playerSerie.style.display =
                            "block";

                        return;
                    }

                    pagamento =
                        dadosPagamento.pagamento ||
                        null;

                    const valor =
                        dadosPagamento.valor ||
                        Number(
                            acesso.valor || 18
                        ).toFixed(2);

                    const pix =
                        dadosPagamento.pix ||
                        "";

                    const antigo =
                        document.getElementById(
                            "lukafilmesPagamento"
                        );

                    if (antigo) {
                        antigo.remove();
                    }

                    const tela =
                        document.createElement("div");

                    tela.id =
                        "lukafilmesPagamento";

                    tela.style.cssText = `
                        width: min(92%, 520px);
                        margin: 24px auto;
                        padding: 24px;
                        box-sizing: border-box;
                        background: linear-gradient(180deg, #242424 0%, #111 100%);
                        border: 2px solid rgba(255,255,255,.16);
                        border-radius: 20px;
                        text-align: center;
                        color: #fff;
                        box-shadow: 0 15px 50px rgba(0,0,0,.75);
                        position: relative;
                        z-index: 20;
                    `;

                    tela.innerHTML = `
                        <h2 style="margin:0 0 10px;">
                            ${renovacao ? "🔄 Renovar acesso" : "🔒 Acesso expirado"}
                        </h2>

                        <p style="margin:8px 0 18px;">
                            ${renovacao
                                ? "Renove seu acesso ao LUKAFILMES por mais 30 dias."
                                : "Para assistir este filme, renove seu acesso."}
                        </p>

                        <div style="
                            font-size:30px;
                            font-weight:700;
                            margin:15px 0;
                        ">
                            R$ ${valor}
                        </div>

                        <p style="margin:8px 0;">
                            Acesso por 30 dias
                        </p>

                        <div
                            id="lukafilmesQrCode"
                            style="
                                width:220px;
                                min-height:220px;
                                margin:20px auto;
                                padding:10px;
                                box-sizing:border-box;
                                background:#fff;
                                border-radius:12px;
                                display:flex;
                                align-items:center;
                                justify-content:center;
                            ">
                        </div>

                        <p style="
                            font-size:14px;
                            margin:14px 0 6px;
                        ">
                            PIX copia e cola
                        </p>

                        <textarea
                            id="lukafilmesPix"
                            readonly
                            style="
                                width:100%;
                                min-height:90px;
                                box-sizing:border-box;
                                resize:none;
                                padding:10px;
                                border-radius:10px;
                                border:1px solid #444;
                                background:#fff;
                                color:#111;
                                font-size:13px;
                                font-weight:600;
                                line-height:1.45;
                                outline:none;
                            ">${pix}</textarea>

                        <button
                            type="button"
                            id="lukafilmesCopiarPix"
                            style="
                                width:100%;
                                margin-top:12px;
                                padding:15px;
                                border:2px solid #fff;
                                border-radius:12px;
                                cursor:pointer;
                                font-weight:800;
                                font-size:15px;
                                background:#fff;
                                color:#111;
                                box-shadow:0 5px 18px rgba(0,0,0,.35);
                                display:block;

            option.textContent =
                temporada.name ||

         */
        if (window.LukaRegistrarSerieContinuar) {

                titulo:
                    serie.name ||

                capa:

                          serie.poster_path
                        : "",

                temporada:

                episodio:

                    id: idSerie,
                    temporada: temporadaId,
                    episodio: episodioId,
                    player: "1"
                }
            );

        /*

         * EmbedMovies

         *

        const btnRedeFlixSerie =

            seriePlayerVideo.style.setProperty(

            );

                nome,
                url
            );
        }

        if (btnRedeFlixSerie) {

            btnRedeFlixSerie.onclick = function () {

                carregarPlayerSerie(
                    redeFlixUrl,
                    "RedeFlix"
                );

            };
        }

        if (btnStreamSerie) {

            btnStreamSerie.onclick = function () {

                const streamUrl =
                    "https://mgeb.top/embed/" +
                    encodeURIComponent(String(idSerie).trim()) +
                    "/" +
                    encodeURIComponent(String(temporadaId).trim()) +
                    "/" +
                    encodeURIComponent(String(episodioId).trim());

                carregarPlayerSerie(
                    streamUrl,
                    "Stream"
                );

            };
        }

        if (btnEmbedMoviesSerie) {

            btnEmbedMoviesSerie.onclick = function () {

                const embedMoviesUrl =
                    "https://myembed.biz/serie/" +
                    encodeURIComponent(String(idSerie).trim()) +

                    encodeURIComponent(String(temporadaId).trim()) +
                    "/" +
                    encodeURIComponent(String(episodioId).trim());

                carregarPlayerSerie(

        if (btnApiPlayerSerie) {

                    encodeURIComponent(String(idSerie).trim()) +

                    encodeURIComponent(String(temporadaId).trim()) +
                    "/" +
                    encodeURIComponent(String(episodioId).trim()) +
                    "?lang=pt";

                carregarPlayerSerie(
                    apiPlayerUrl,
                    "APIPlayer"
                );

        /*

        playerSerie.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        console.log(
            "[SERIES PLAYER] RedeFlix carregado:",
            redeFlixUrl
        );

    }


    /* ==========================================
       VOLTAR PARA A LISTAGEM PRESERVANDO POSIÇÃO
       ========================================== */

    const botaoVoltarSerie =
        document.getElementById("voltarSerie");

    if (botaoVoltarSerie) {

        botaoVoltarSerie.addEventListener(

            function (e) {

                e.preventDefault();

                window.location.href = "series.html";

            }
        );

    }

    /* ==========================================
       INICIAR
       ========================================== */

    carregarDetalhes();


})();

<script id="serie-favoritos-topo-script">
(function(){

    "use strict";

    console.log("[FAVORITOS SÉRIE] Sistema iniciado.");

    function obterSerie(){

        try{

            const salvo =
                localStorage.getItem("serieSelecionada");

            if(!salvo){
                console.warn(
                    "[FAVORITOS SÉRIE] serieSelecionada não encontrada."
                );
                return null;
            }

            const serie = JSON.parse(salvo);

            if(!serie || typeof serie !== "object"){
                return null;
            }

            return serie;

        }catch(e){

            console.error(
                "[FAVORITOS SÉRIE] Erro ao obter série:",
                e
            );

            return null;
        }
    }


    function obterLista(){

        try{

            const salvo =
                localStorage.getItem("lukafilmes_minhalista");

            if(!salvo){
                return [];
            }

            const lista = JSON.parse(salvo);

            return Array.isArray(lista)
                ? lista
                : [];

        }catch(e){

            console.error(
                "[FAVORITOS SÉRIE] Erro ao ler lista:",
                e
            );

            return [];
        }
    }


    function salvarLista(lista){

        localStorage.setItem(
            "lukafilmes_minhalista",
            JSON.stringify(lista)
        );

        console.log(
            "[FAVORITOS SÉRIE] Lista salva:",
            lista
        );
    }


    function idDaSerie(serie){

        return String(
            serie &&
            (
                serie.id ||
                serie.tmdb_id ||
                serie.tv_id ||
                serie.titulo ||
                serie.name ||
                serie.nome
            )
            || ""
        ).trim();
    }


    function normalizarSerie(serie){

        if(!serie){
            return null;
        }

        const id =
            idDaSerie(serie);

        const titulo =
            serie.titulo ||
            serie.title ||
            serie.name ||
            serie.nome ||
            document.getElementById("tituloSerie")?.textContent?.trim() ||
            "Série";

        const capa =
            serie.capa ||
            serie.poster ||
            serie.poster_path ||
            document.getElementById("posterSerie")?.src ||
            "";

        return {
            ...serie,

            id: id,

            titulo: titulo,

            capa: capa,

            tipo: "serie",

            media_type: "tv",

            nome: serie.nome || serie.name || titulo
        };
    }


    function atualizarBotao(){

        const botao =
            document.getElementById(
                "serieAdicionarFavorito"
            );

        if(!botao){
            console.warn(
                "[FAVORITOS SÉRIE] Botão não encontrado."
            );
            return;
        }

        const serie =
            normalizarSerie(
                obterSerie()
            );

        if(!serie){

            botao.style.display =
                "none";

            return;
        }

        const id =
            idDaSerie(serie);

        if(!id){

            botao.style.display =
                "none";

            return;
        }

        botao.style.display =
            "inline-flex";

        const lista =
            obterLista();

        const existe =
            lista.some(function(item){

                return String(
                    item &&
                    (
                        item.id ||
                        item.tmdb_id ||
                        item.tv_id ||
                        item.titulo ||
                        item.name ||
                        item.nome
                    )
                ).trim() === id;

            });

        if(existe){

            botao.textContent =
                "♥ Remover dos favoritos";

            botao.classList.add(
                "favorito-ativo"
            );

        }else{

            botao.textContent =
                "＋ Adicionar aos favoritos";

            botao.classList.remove(
                "favorito-ativo"
            );
        }
    }


    function alternarFavorito(){

        const serie =
            normalizarSerie(
                obterSerie()
            );

        if(!serie){

            console.error(
                "[FAVORITOS SÉRIE] Série não encontrada."
            );

            return;
        }

        const id =
            idDaSerie(serie);

        if(!id){

            console.error(
                "[FAVORITOS SÉRIE] ID da série não encontrado."
            );

            return;
        }

        let lista =
            obterLista();

        const indice =
            lista.findIndex(function(item){

                return String(
                    item &&
                    (
                        item.id ||
                        item.tmdb_id ||
                        item.tv_id ||
                        item.titulo ||
                        item.name ||
                        item.nome
                    )
                ).trim() === id;

            });


        if(indice >= 0){

            lista.splice(
                indice,
                1
            );

            console.log(
                "[FAVORITOS SÉRIE] Série removida:",
                serie
            );

        }else{

            lista.unshift(
                serie
            );

            console.log(
                "[FAVORITOS SÉRIE] Série adicionada:",
                serie
            );
        }


        salvarLista(lista);

        atualizarBotao();
    }


    function instalar(){

        const botao =
            document.getElementById(
                "serieAdicionarFavorito"
            );

        if(!botao){
            return;
        }

        if(
            botao.dataset.favoritoSerieLigado === "1"
        ){
            atualizarBotao();
            return;
        }

        botao.dataset.favoritoSerieLigado =
            "1";

        botao.addEventListener(
            "click",
            function(evento){

                evento.preventDefault();
                evento.stopPropagation();

                alternarFavorito();

            },
            true
        );

        atualizarBotao();

        console.log(
            "[FAVORITOS SÉRIE] Botão conectado."
        );
    }


    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            instalar
        );

    }else{

        instalar();
    }


    setTimeout(
        instalar,
        500
    );

    setTimeout(
        instalar,
        1500
    );

    setTimeout(
        instalar,
        3000
    );


})();
</script>

<!-- LUKAFILMES-CONTINUAR-SERIE-RESUME -->
<script>
(function () {

    "use strict";

    /*
     * LUKAFILMES
     * CONTINUAR ASSISTINDO — SÉRIES
     *
     * A fonte oficial da retomada é:
     * lukafilmes_continuar
     *
     * Não usa mais serieSelecionada para descobrir
     * qual episódio deve ser retomado.
     */

    function obterSerieContinuar() {

        try {

            const salvo =
                localStorage.getItem("lukafilmes_continuar");

            if (!salvo) {
                console.log(
                    "[CONTINUAR SÉRIE] Nenhum histórico encontrado."
                );
                return null;
            }

            const lista = JSON.parse(salvo);

            if (!Array.isArray(lista)) {
                return null;
            }

            const serie =
                lista.find(function (item) {

                    return (
                        item &&
                        String(item.tipo || "").toLowerCase() === "serie" &&
                        item.id != null &&
                        item.temporada != null &&
                        item.episodio != null
                    );

                });

            if (!serie) {

                console.log(
                    "[CONTINUAR SÉRIE] Nenhuma série com episódio salvo.",
                    lista
                );

                return null;
            }

            return serie;

        } catch (erro) {

            console.error(
                "[CONTINUAR SÉRIE] Erro ao ler histórico:",
                erro
            );

            return null;
        }
    }


    function restaurarContinuarSerie() {

        if (window.__lukafilmesContinuarSerieExecutado) {
            return true;
        }

        const item =
            obterSerieContinuar();

        if (!item) {
            return false;
        }

        if (
            typeof window.assistirEpisodio !== "function"
        ) {
            return false;
        }

        const temporada =
            String(item.temporada).trim();

        const episodio =
            String(item.episodio).trim();

        if (!temporada || !episodio) {
            return false;
        }

        window.__lukafilmesContinuarSerieExecutado = true;

        console.log(
            "[CONTINUAR SÉRIE] RETOMANDO:",
            {
                id: item.id,
                titulo: item.titulo,
                temporada: temporada,
                episodio: episodio,
                player: item.player || "1"
            }
        );

        /*
         * Mantém serieSelecionada sincronizada com o item
         * que realmente veio do Continuar Assistindo.
         */
        try {

            localStorage.setItem(
                "serieSelecionada",
                JSON.stringify(item)
            );

            localStorage.setItem(
                "seriePlayerId",
                String(item.id)
            );

            localStorage.setItem(
                "seriePlayerTemporada",
                temporada
            );

            localStorage.setItem(
                "seriePlayerEpisodio",
                episodio
            );

            if (item.player != null) {

                localStorage.setItem(
                    "seriePlayer",
                    String(item.player)
                );

            }

        } catch (erro) {

            console.warn(
                "[CONTINUAR SÉRIE] Não foi possível sincronizar dados:",
                erro
            );
        }

        /*
         * Abre exatamente a temporada e o episódio salvos.
         */
        window.assistirEpisodio(
            temporada,
            episodio,
            item.titulo || "Série"
        );

        /*
         * assistirEpisodio() inicia no PLAY 1.
         *
         * Se o usuário estava no PLAY 2,
         * restauramos o mesmo player.
         */
        const playerSalvo =
            String(item.player || "1");

        if (playerSalvo !== "1") {

            let tentativasPlayer = 0;

            const intervaloPlayer =
                setInterval(function () {

                    tentativasPlayer++;

                    const botao =
                        document.querySelector(
                            '.players-serie-opcoes .serie-player-btn[data-player="' +
                            playerSalvo +
                            '"]'
                        );

                    if (botao) {

                        botao.click();

                        clearInterval(
                            intervaloPlayer
                        );

                        console.log(
                            "[CONTINUAR SÉRIE] Player restaurado:",
                            playerSalvo
                        );

                        return;
                    }

                    if (tentativasPlayer >= 20) {

                        clearInterval(
                            intervaloPlayer
                        );

                        console.warn(
                            "[CONTINUAR SÉRIE] Player não encontrado:",
                            playerSalvo
                        );

                    }

                }, 250);
        }

        return true;
    }


    /*
     * Espera assistirEpisodio existir.
     */
    let tentativas = 0;

    const intervalo =
        setInterval(function () {

            tentativas++;

            if (
                restaurarContinuarSerie() ||
                tentativas >= 40
            ) {

                clearInterval(intervalo);

            }

        }, 250);

})();
</script>



<script id="lukafilmes-serie-protecao-popup-final">
(function () {
    "use strict";

    /*
     * LUKAFILMES — PROTEÇÃO DO PLAYER DE SÉRIE
     * Mesma proteção estrutural usada na página de filme.
     * Protege a página principal contra pop-ups e navegação externa.
     */

    const frame = document.getElementById("serieFrame");

    if (!frame) {
        console.log("[SERIE PROTEÇÃO] serieFrame não encontrado.");
        return;
    }

    /*
     * Mantém o iframe configurado para reprodução.
     */
    frame.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture; fullscreen"
    );

    frame.setAttribute("allowfullscreen", "");

    frame.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
    );

    /*
     * Impede links da página principal de abrirem
     * novas abas/janelas.
     */
    document.addEventListener("click", function (e) {

        const alvo = e.target;

        if (!alvo || !alvo.closest) return;

        const link = alvo.closest("a");

        if (!link) return;

        if (
            link.target === "_blank" ||
            link.target === "_new" ||
            link.target === "_parent" ||
            link.target === "_top"
        ) {
            e.preventDefault();
            e.stopImmediatePropagation();

            link.removeAttribute("target");

            console.log(
                "[SERIE PROTEÇÃO] navegação externa bloqueada:",
                link.href || ""
            );

            return false;
        }

    }, true);

    /*
     * Bloqueia window.open usado pela página principal.
     */
    window.open = function () {

        console.log(
            "[SERIE PROTEÇÃO] popup externo bloqueado."
        );

        return null;
    };

    /*
     * Confirma carregamento do player.
     */
    frame.addEventListener("load", function () {

        console.log(
            "[SERIE PROTEÇÃO] iframe carregado:",
            frame.src
        );

    });

    console.log(
        "[SERIE PROTEÇÃO] proteção do player de série ativa."
    );

})();
</script>

                "Novo filme disponível • Toque para assistir";

            descricao.style.cssText =
                "font-size:11px;" +
                "color:#aaa;" +
                "line-height:1.3;";

            texto.appendChild(descricao);

            item.appendChild(texto);
            lista.appendChild(item);
        });
    }

    async function verificarNovidades(){
        try{
            const resposta = await fetch(
                "/api/notificacoes/novos-filmes",
                { cache:"no-store" }
            );

            if(!resposta.ok) return;

            const dados = await resposta.json();
            const filmes = Array.isArray(dados.filmes)
                ? dados.filmes
                : [];

            if(!filmes.length) return;

            const vistos = lerIds();

            const novos = filmes.filter(function(filme){
                return !vistos.includes(Number(filme.id));
            });

            const badge = document.getElementById(
                "lukaNotificationBadge"
            );

            if(badge){
                if(novos.length){
                    badge.textContent =
                        novos.length > 9 ? "9+" : String(novos.length);
                    badge.style.display = "flex";
                }else{
                    badge.textContent = "";
                    badge.style.display = "none";
                }
            }

            atualizarPainel(novos.length ? novos : []);

            if(novos.length){
                salvarIds(
                    filmes.map(function(f){ return Number(f.id); })
                );
            }

        }catch(e){
            console.warn(
                "[LUKAFILMES] Não foi possível verificar novidades.",
                e
            );
        }
    }

    function iniciar(){
        verificarNovidades();
    }

    if(document.readyState === "loading"){
        document.addEventListener("DOMContentLoaded", iniciar);
    }else{
        iniciar();
    }
})();
</script>


<script>
/* ============================================================
   LUKAFILMES-CORRECAO-CONTINUAR-SERIE
   Garante que séries sejam registradas somente depois que
   o STORAGE isolado da conta estiver pronto.
   Filmes não são alterados.
   ============================================================ */
(function(){

    "use strict";

    function registrarSerieContinuar(dados){

        if(!dados || !dados.id){
            console.warn(
                "[CONTINUAR SÉRIE] Dados inválidos para registro."
            );
            return;
        }

        function executar(){

            if(!window.LukaContinuar ||
               typeof window.LukaContinuar.registrarInicio !== "function"){

                console.warn(
                    "[CONTINUAR SÉRIE] LukaContinuar ainda não disponível."
                );

                setTimeout(executar, 150);
                return;
            }

            try{

                window.LukaContinuar.registrarInicio({

                    id: String(dados.id),

                    titulo:
                        dados.titulo ||
                        "Série",

                    capa:
                        dados.capa ||
                        "",

                    tipo: "serie",

                    player:
                        dados.player != null
                            ? String(dados.player)
                            : "1",

                    temporada:
                        dados.temporada != null
                            ? String(dados.temporada)
                            : null,

                    episodio:
                        dados.episodio != null
                            ? String(dados.episodio)
                            : null

                });

                console.log(
                    "[CONTINUAR SÉRIE] REGISTRADO:",
                    {
                        id: String(dados.id),
                        temporada: dados.temporada,
                        episodio: dados.episodio,
                        player: dados.player
                    }
                );

            }catch(e){

                console.error(
                    "[CONTINUAR SÉRIE] Erro ao registrar:",
                    e
                );
            }
        }

        /*
         * O conta-storage pode ainda estar esperando /api/eu.
         * Neste caso esperamos a conta antes de gravar.
         */
        if(
            window.LukaContaPronta &&
            typeof window.LukaContaPronta.then === "function"
        ){

            window.LukaContaPronta
                .then(function(){
                    executar();
                })
                .catch(function(){
                    executar();
                });

        }else{

            executar();
        }
    }

    window.LukaRegistrarSerieContinuar =
        registrarSerieContinuar;

    console.log(
        "[CONTINUAR SÉRIE] Correção carregada."
    );

})();
</script>

<script id="lukafilmes-renovacao-notificacao-script">
(function(){

    "use strict";

    const TEMPO = 10000;

    function escapar(valor){
        return String(valor || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function removerNotificacao(){
        const antigo =
            document.getElementById(
                "lukaRenovacaoNotificacao"
            );

        if(antigo){
            antigo.remove();
        }
    }

    function mostrarNotificacao(dados){

        removerNotificacao();

        const caixa =
            document.createElement("div");

        caixa.id =
            "lukaRenovacaoNotificacao";

        const usuario =
            escapar(dados.usuario || "");

        const dias =
            Number(dados.dias_restantes || 0);

        let textoDias;

        if(dados.expirado){
            textoDias =
                "Seu acesso já expirou.";
        }else if(dias === 1){
            textoDias =
                "Seu acesso vence em 1 dia.";
        }else{
            textoDias =
                "Seu acesso vence em " +
                dias +
                " dias.";
        }

        caixa.innerHTML = `
            <div class="luka-renovacao-titulo">
                🔔 RENOVAÇÃO DO LUKAFILMES
            </div>

            <div class="luka-renovacao-texto">
                Olá, <strong>${usuario}</strong>!
                <br>
                ${textoDias}
                <br>
                Renove seu acesso por mais
                ${Number(dados.dias_renovacao || 30)} dias.
            </div>

            <div class="luka-renovacao-dias">
                R$ ${escapar(dados.valor || "18.00")}
            </div>

            <div class="luka-renovacao-acoes">
                <button
                    type="button"
                    class="luka-renovar"
                    id="lukaRenovarAgora">
                    🔄 RENOVAR
                </button>

                <button
                    type="button"
                    class="luka-fechar"
                    id="lukaFecharRenovacao">
                    FECHAR
                </button>
            </div>
        `;

        document.body.appendChild(caixa);

        caixa.style.display = "block";

        const botaoRenovar =
            document.getElementById(
                "lukaRenovarAgora"
            );

        if(botaoRenovar){

            botaoRenovar.addEventListener(
                "click",
                function(){

                    /*
                     * Próxima etapa:
                     * abrir o PIX existente com
                     * renovacao=true.
                     */
                    window.dispatchEvent(
                        new CustomEvent(
                            "luka:renovar",
                            {
                                detail: dados
                            }
                        )
                    );

                    caixa.remove();
                }
            );
        }

        const botaoFechar =
            document.getElementById(
                "lukaFecharRenovacao"
            );

        if(botaoFechar){
            botaoFechar.addEventListener(
                "click",
                removerNotificacao
            );
        }

        setTimeout(function(){

            if(document.body.contains(caixa)){
                caixa.remove();
            }

        }, TEMPO);
    }

    async function verificarRenovacao(){

        try{

            const resposta =
                await fetch(
                    "/api/renovacao-status",
                    {
                        method: "GET",
                        credentials: "same-origin",
                        cache: "no-store"
                    }
                );

            if(!resposta.ok){
                return;
            }

            const dados =
                await resposta.json();

            if(
                dados &&
                dados.sucesso &&
                dados.logado &&
                dados.deve_notificar
            ){

                mostrarNotificacao(dados);
            }

        }catch(erro){

            console.warn(
                "[LUKAFILMES] Falha ao verificar renovação:",
                erro
            );
        }
    }

    function iniciar(){

        /*
         * Pequeno atraso para não competir com
         * o carregamento principal da página.
         */
        setTimeout(
            verificarRenovacao,
            1200
        );
    }

    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            iniciar,
            {once:true}
        );

    }else{

        iniciar();
    }

})();

</script>
