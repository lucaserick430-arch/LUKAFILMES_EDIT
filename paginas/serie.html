<head>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .pagina-serie {
            min-height: 100vh;
            position: relative;
            overflow: hidden;
            padding-bottom: 80px;
            background: #050505;
        }

        /* ==========================================
           FUNDO
           ========================================== */

        .pagina-serie::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;
            right: 0;

            height: 780px;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(5, 5, 5, .15),
                    rgba(5, 5, 5, .30) 35%,
                    rgba(5, 5, 5, .65) 65%,
                    #050505 100%
                ),
                var(--fundo-serie);

            background-size: cover;

            background-position: center top;

            filter: blur(2px);

            transform: scale(1.03);

            opacity: .9;

            z-index: 0;
        }

        .pagina-serie::after {

            content: "";

            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    to bottom,
                    transparent 0,
                    transparent 25%,
                    rgba(5, 5, 5, .25) 45%,
                    #050505 78%
                );

            z-index: 0;

            pointer-events: none;
        }


        /* ==========================================
           VOLTAR
           ========================================== */

        .voltar-area {

            position: relative;

            z-index: 5;

            max-width: 1200px;

            margin: auto;

            padding: 25px;
        }

        .voltar {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            padding: 11px 18px;

            color: #fff;

            text-decoration: none;

            background: rgba(0, 0, 0, .55);

            border: 1px solid rgba(255, 255, 255, .14);

            border-radius: 30px;

            backdrop-filter: blur(12px);

            font-weight: bold;

            transition: .25s;
        }

        .voltar:hover {

            background: #e50914;

            border-color: #e50914;

            transform: translateX(-3px);
        }


        /* ==========================================
           DETALHES
           ========================================== */

        .detalhes-serie {

            position: relative;

            z-index: 2;

            width: 100%;

            max-width: 1000px;

            margin: 40px auto 0;

            padding: 0 20px;

            text-align: center;
        }


        /* ==========================================
           CAPA
           ========================================== */

        .poster-serie {

            width: 270px;

            margin: 0 auto 25px;
        }

        .poster-serie img {

            width: 100%;

            display: block;

            border-radius: 17px;

            border: 1px solid rgba(255, 255, 255, .18);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .9);
        }


        /* ==========================================
           TITULO
           ========================================== */

        #tituloSerie {

            margin: 0 0 15px;

            font-size: clamp(34px, 5vw, 58px);

            line-height: 1.05;

            font-weight: 900;

            text-shadow:
                0 8px 35px rgba(0, 0, 0, .95);
        }

        .dados-serie {

            color: #ddd;

            font-size: 15px;

            margin-bottom: 18px;
        }


        /* ==========================================
           SINOPSE
           ========================================== */

        .sinopse-box {

            width: 100%;

            max-width: 850px;

            margin: 25px auto 0;

            padding: 30px 35px;

            text-align: left;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 20px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, .55);
        }

        .sinopse-box h2 {

            margin: 0 0 15px;

            font-size: 22px;
        }

        .sinopse {

            margin: 0;

            color: #d1d1d1;

            font-size: 16px;

            line-height: 1.8;
        }


        /* ==========================================
           TEMPORADAS
           ========================================== */

        .temporadas {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            backdrop-filter: blur(16px);

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);
        }

        .temporadas h2 {

            margin: 0 0 20px;

            font-size: 26px;
        }

        #selectTemporada {

            width: 100%;

            padding: 14px 16px;

            color: #fff;

            background: #151515;

            border: 1px solid rgba(255, 255, 255, .15);

            border-radius: 10px;

            outline: none;

            font-size: 16px;

            cursor: pointer;
        }


        /* ==========================================
           EPISODIOS
           ========================================== */

        .episodios {

            margin-top: 25px;

            display: grid;

            grid-template-columns:
                repeat(auto-fill, minmax(180px, 1fr));

            gap: 14px;
        }

        .episodio {

    position: relative;

    padding: 20px 17px;

    text-align: center;

    color: #fff;

    background: rgba(0, 0, 0, .18);

    border: 1px solid rgba(255, 255, 255, .08);

    border-radius: 14px;

    cursor: pointer;

    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;

    font-family: inherit;

    min-height: 145px;

    backdrop-filter: blur(4px);

    -webkit-backdrop-filter: blur(4px);
}

.episodio span {

    transition:
        transform .25s ease,
        background .25s ease,
        box-shadow .25s ease;
}

.episodio:hover {

    background: rgba(229, 9, 20, .18);

    border-color: rgba(229, 9, 20, .65);

    transform: translateY(-4px);

    box-shadow:
        0 12px 35px rgba(0, 0, 0, .35);
}

.episodio:hover span {

    background: rgba(229, 9, 20, .9) !important;

    transform: scale(1.08);

    box-shadow:
        0 0 20px rgba(229, 9, 20, .35);
}

.episodio strong {

    display: block;

    margin-bottom: 6px;

    color: #fff;

    font-weight: 700;

    text-shadow:
        0 2px 8px rgba(0, 0, 0, .8);
}

.episodio small {

    display: block;

    color: rgba(255, 255, 255, .58);

    line-height: 1.4;

    transition: color .25s ease;
}

.episodio:hover small {

    color: rgba(255, 255, 255, .9);
}
/* ==========================================
           PLAYER
           ========================================== */

        .player-serie {

            position: relative;

            z-index: 3;

            width: calc(100% - 40px);

            max-width: 1000px;

            margin: 55px auto 0;

            padding: 30px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(255, 255, 255, .075),
                    rgba(255, 255, 255, .025)
                );

            border: 1px solid rgba(255, 255, 255, .10);

            border-radius: 22px;

            box-shadow:
                0 30px 80px rgba(0, 0, 0, .65);

            backdrop-filter: blur(16px);
        }

        .player-serie h2 {

            margin: 0 0 22px;

            font-size: 26px;
        }

        .player-video {

            width: 100%;

            aspect-ratio: 16 / 9;

            overflow: hidden;

            background: #000;

            border-radius: 15px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, .7);
        }

        .player-video iframe {

            width: 100%;

            height: 100%;

            border: 0;

            display: block;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 700px) {

            .voltar-area {

                padding: 18px 15px 0;
            }

            .detalhes-serie {

                margin-top: 35px;

                padding: 0 15px;
            }

            .poster-serie {

                width: 205px;
            }

            .sinopse-box {

                padding: 22px 20px;
            }

            .temporadas,
            .player-serie {

                width: calc(100% - 24px);

                padding: 18px 14px;

                border-radius: 17px;
            }

            .episodios {

                grid-template-columns: 1fr;
            }

            #tituloSerie {

                font-size: 36px;
            }

        }

    
/* =========================================================
   LUKAFILMES — DETALHES DA SÉRIE / VISUAL STREAMING
   SOMENTE VISUAL — NÃO ALTERA A LÓGICA
   ========================================================= */

.pagina-serie {
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(229,9,20,.10),
            transparent 38%
        ),
        #050505;
}

/* Backdrop mais cinematográfico */

.pagina-serie::before {
    height: 900px;
    opacity: .82;
    filter: blur(1px);
    transform: scale(1.035);
}

.pagina-serie::after {
    background:
        linear-gradient(

        );
}

}

}

/* Select */

/* =========================================================
   MOBILE

@media (max-width: 800px) {

            MegaEmbed</button>

                type="button"

            EmbedMovies</button>

        </div>

        <div class="player-video">

            <iframe
                id="serieFrame"

<script>

(function () {

    "use strict";


    console.log("[LUKAFILMES] Iniciando carregamento da série...");


    /* ==========================================
       RECUPERAR SÉRIE
       ========================================== */

    const salvo = localStorage.getItem("serieSelecionada");


    if (!salvo) {

        document.getElementById("tituloSerie").textContent =
            "Série não encontrada";

        document.getElementById("sinopseSerie").textContent =
            "Nenhuma série foi selecionada.";

        return;
    }


    let serie;


    try {

        serie = JSON.parse(salvo);

        

    } catch (erro) {

        console.error(
            "[SERIES] Erro ao ler série:",
            erro
        );

        document.getElementById("tituloSerie").textContent =
            "Erro ao carregar série";

        return;
    }


    console.log(
        "[SERIES] Série selecionada:",
        serie
    );


    /* ==========================================
       ELEMENTOS
       ========================================== */

    const tituloElemento =
        document.getElementById("tituloSerie");

    const posterElemento =
        document.getElementById("posterSerie");

    const sinopseElemento =
        document.getElementById("sinopseSerie");

    const dadosElemento =
        document.getElementById("dadosSerie");

    const select =
        document.getElementById("selectTemporada");

    const listaEpisodios =
        document.getElementById("episodios");

    const player =
        document.getElementById("playerSerie");

    const frame =
        document.getElementById("serieFrame");

    const tituloPlayer =
        document.getElementById("tituloPlayer");


    /* ==========================================
       DADOS BÁSICOS
       ========================================== */

    const titulo =
        serie.titulo ||
        serie.name ||
        serie.original_name ||
        "Sem título";


    document.title =
        "LUKAFILMES - " + titulo;


    tituloElemento.textContent =
        titulo;


    /* ==========================================
       CAPA
       ========================================== */

    let poster = "";


    if (serie.capa) {

        poster = serie.capa;

    } else if (serie.poster_path) {

        poster =
            "https://image.tmdb.org/t/p/w500" +
            serie.poster_path;

    }


    if (poster) {

        posterElemento.src = poster;

    } else {

        posterElemento.style.display = "none";

    }


    /* ==========================================
       SINOPSE
       ========================================== */

    sinopseElemento.textContent =
        serie.sinopse ||
        serie.overview ||
        "Sinopse não disponível.";


    /* ==========================================
       ANO
       ========================================== */

    const ano =
        serie.ano ||
        (
            serie.first_air_date
                ? serie.first_air_date.substring(0, 4)
                : ""
        );


    /* ==========================================
       NOTA
       ========================================== */

    const valorNota =
        serie.nota ??
        serie.vote_average ??
        0;


    const nota =
        Number(valorNota || 0).toFixed(1);


    dadosElemento.textContent =
        "⭐ " +
        nota +
        (
            ano
                ? " • " + ano
                : ""
        );


    /* ==========================================
       FUNDO
       ========================================== */

    let fundo = "";


    if (serie.fundo) {

        fundo = serie.fundo;

    } else if (serie.backdrop_path) {

        fundo =
            "https://image.tmdb.org/t/p/w1280" +
            serie.backdrop_path;

    }


    if (fundo) {

        document.documentElement.style.setProperty(
            "--fundo-serie",
            'url("' + fundo + '")'
        );

    }



    /* ==========================================
       TRAILER DA SÉRIE — FUNDO
       ========================================== */

    if (serie.id) {

        fetch("/api/serie/" + serie.id + "/videos")
            .then(resposta => resposta.json())
            .then(dados => {

                if (
                    dados &&
                    dados.sucesso &&
                    dados.encontrado &&
                    dados.trailer &&
                    dados.trailer.embed
                ) {

                    const embed = dados.trailer.embed;

                    const video = document.createElement("iframe");

                    video.src =
                        embed +
                        (embed.includes("?") ? "&" : "?") +
                        "autoplay=1&mute=1&controls=0&loop=1&playlist=" +
                        (dados.trailer.key || "");

                    video.setAttribute("allow",
                        "autoplay; encrypted-media; picture-in-picture");

                    video.setAttribute("allowfullscreen", "");

                    video.style.position = "fixed";
                    video.style.inset = "0";
                    video.style.width = "100%";
                    video.style.height = "100%";
                    video.style.border = "0";
                    video.style.zIndex = "-1";
                    video.style.pointerEvents = "none";
                    video.style.objectFit = "cover";

                    video.id = "trailerFundoSerie";

                    document.body.prepend(video);

                    console.log(
                        "[SERIES] Trailer de fundo carregado:",
                        dados.trailer.nome || ""
                    );
                }

            })
            .catch(erro => {

                console.warn(
                    "[SERIES] Trailer de fundo indisponível. Mantendo backdrop.",
                    erro
                );

            });
    }

    /* ==========================================
       VARIÁVEIS
       ========================================== */

    let temporadas = [];


    /* ==========================================
       CARREGAR DETALHES DA SÉRIE
       ========================================== */

    async function carregarDetalhes() {

    console.log(
        "[SERIES] ID da série:",
        serie.id
    );


    if (!serie.id) {

        console.error(
            "[SERIES] ID da série não encontrado."
        );

        listaEpisodios.innerHTML = `
            <div class="episodio">
                ❌ ID da série não encontrado.
            </div>
        `;

        return;
    }


    try {

        const url =
            "/api/serie/" +
            encodeURIComponent(serie.id);


        console.log(
            "[SERIES] Buscando detalhes:",
            url
        );


        const resposta =
            await fetch(url, {
                method: "GET",
                credentials: "same-origin",
                cache: "no-store"
            });


        console.log(
            "[SERIES] Status detalhes:",
            resposta.status
        );


        if (!resposta.ok) {

            throw new Error(
                "Erro HTTP " +
                resposta.status
            );
        }


        const dados =
            await resposta.json();


        console.log(
            "[SERIES] Detalhes recebidos:",
            dados
        );


        if (
            dados &&
            dados.sucesso &&
            dados.serie
        ) {

            const serieDetalhes =
                dados.serie;


            const listaTemporadas =
                Array.isArray(serieDetalhes.temporadas)
                    ? serieDetalhes.temporadas
                    : (
                        Array.isArray(serieDetalhes.seasons)
                            ? serieDetalhes.seasons
                            : []
                    );


            console.log(
                "[SERIES] Lista de temporadas:",
                listaTemporadas
            );


            if (listaTemporadas.length > 0) {

                console.log(
                    "[SERIES] Temporadas encontradas:",
                    listaTemporadas.length
                );


                preencherTemporadas(
                    listaTemporadas
                );


                return;
            }


            console.warn(
                "[SERIES] Temporadas não encontradas. Usando fallback."
            );


            criarTemporadaFallback();

            return;
        }


        console.warn(
            "[SERIES] Resposta sem dados da série. Usando fallback."
        );


        criarTemporadaFallback();


    } catch (erro) {

        console.error(
            "[ERRO DETALHES SÉRIE]",
            erro
        );


        criarTemporadaFallback();

    }

}

function criarTemporadaFallback() {

        temporadas = [
            {
                season_number: 1,
                name: "Temporada 1"
            }
        ];


        select.innerHTML = "";


        const option =
            document.createElement("option");


        option.value = "1";

        option.textContent =
            "Temporada 1";


        select.appendChild(option);


        mostrarEpisodios(1);

    }


    /* ==========================================
       PREENCHER TEMPORADAS
       ========================================== */

    function preencherTemporadas(lista) {

        temporadas =
            Array.isArray(lista)
                ? lista.filter(function (temporada) {

                    return Number(
                        temporada.season_number
                    ) > 0;

                })
                : [];


        select.innerHTML = "";


        if (!temporadas.length) {

            criarTemporadaFallback();

            return;
        }


        temporadas.forEach(function (temporada) {

            const option =
                document.createElement("option");


            option.value =
                String(
                    temporada.season_number
                );


            option.textContent =
                temporada.name ||
                (
                    "Temporada " +
                    temporada.season_number
                );


            select.appendChild(option);

        });


        mostrarEpisodios(
            Number(
                temporadas[0].season_number
            )
        );

    }


    /* ==========================================
       CARREGAR EPISÓDIOS
       ========================================== */

    async function mostrarEpisodios(temporada) {

        if (
            !listaEpisodios ||
            !serie ||
            !serie.id
        ) {

            console.error(
                "[SERIES] Dados da série não encontrados."
            );

            return;
        }


        listaEpisodios.innerHTML = `

            <div style="
                padding: 25px;
                text-align: center;
                color: #aaa;
                width: 100%;
                grid-column: 1 / -1;
            ">

                🔄 Carregando episódios...

            </div>

        `;


        const url =
            "/api/serie/" +
            encodeURIComponent(serie.id) +
            "/temporada/" +
            encodeURIComponent(temporada);


        console.log(
            "[SERIES] Buscando episódios:",
            url
        );


        try {

            const resposta =
                await fetch(url, {
                    method: "GET",
                    credentials: "same-origin",
                    cache: "no-store"
                });


            console.log(
                "[SERIES] Status episódios:",
                resposta.status
            );


            if (!resposta.ok) {

                throw new Error(
                    "Erro HTTP " +
                    resposta.status
                );
            }


            const dados =
                await resposta.json();


            console.log(
                "[SERIES] Episódios recebidos:",
                dados
            );


            if (
                !dados ||
                !dados.sucesso ||
                !Array.isArray(dados.episodios)
            ) {

                throw new Error(
                    "A API não retornou episódios."
                );
            }


            if (!dados.episodios.length) {

                listaEpisodios.innerHTML = `

                    <div style="
                        padding: 25px;
                        text-align: center;
                        color: #aaa;
                        width: 100%;
                        grid-column: 1 / -1;
                    ">

                        Nenhum episódio encontrado.

                    </div>

                `;

                return;
            }


            listaEpisodios.innerHTML = "";
            dados.episodios.forEach(function (ep) {

                const numero =
                    ep.episode_number || "";

                const nome =
                    ep.name || "Sem título";

                const descricao =
                    ep.overview || "Descrição não disponível.";

                const duracao =
                    ep.runtime
                        ? ep.runtime + " min"
                        : "";

                const imagem =
                    ep.still_path
                        ? "https://image.tmdb.org/t/p/w780" + ep.still_path
                        : (
                            serie.backdrop_path
                                ? "https://image.tmdb.org/t/p/w780" + serie.backdrop_path
                                : ""
                        );

                const item =
                    document.createElement("button");

                item.type = "button";
                item.className = "episodio";

                item.innerHTML = `
                    <div class="episodio-capa">

                        ${
                            imagem
                                ? `<img
                                    src="${imagem}"
                                    alt="Episódio ${numero}"
                                    loading="lazy"
                                >`
                                : `<div class="episodio-sem-imagem">
                                    🎬
                                  </div>`
                        }

                        <div class="episodio-play">
                            ▶
                        </div>

                    </div>

                    <div class="episodio-info">

                        <div class="episodio-topo">

                            <strong>
                                ${numero ? "Episódio " + numero : "Episódio"}
                            </strong>

                            ${
                                duracao
                                    ? `<span class="episodio-duracao">
                                        ${duracao}
                                      </span>`
                                    : ""
                            }

                        </div>

                        <h3>
                            ${nome}
                        </h3>

                        <p>
                            ${descricao}
                        </p>

                    </div>
                `;

                item.addEventListener("click", function () {

                    assistirEpisodio(
                        temporada,
                        numero,
                        nome
                    );

                });

                listaEpisodios.appendChild(item);

            });


        } catch (erro) {

            console.error(
                "[ERRO EPISODIOS]",
                erro
            );


            listaEpisodios.innerHTML = `

                <div style="
                    padding: 25px;
                    text-align: center;
                    color: #ff7777;
                    width: 100%;
                    grid-column: 1 / -1;
                ">

                    ❌ Não foi possível carregar os episódios.

                    <br>

                    <small style="
                        color: #888;
                    ">
                        Verifique o console do navegador.
                    </small>

                </div>

            `;

        }

    }


    /* ==========================================
       TROCAR TEMPORADA
       ========================================== */

    select.addEventListener(
        "change",
        function () {

            const temporada =
                Number(
                    select.value
                );


            if (!temporada) {

                return;
            }


            mostrarEpisodios(
                temporada
            );

        }
    );


    /* ==========================================
       PLAYER
       ========================================== */

    function assistirEpisodio(
        temporada,
        episodio,
        nome
    ) {

        if (!serie || !serie.id) {

            console.error(
                "[SERIES] ID da série não encontrado."
            );

            return;
        }

        const idSerie =
            String(serie.id).trim();

        const temporadaId =
            String(temporada).trim();

        const episodioId =
            String(episodio).trim();

        if (!idSerie || !temporadaId || !episodioId) {

            console.error(
                "[SERIES] Dados do episódio incompletos.",
                {
                    idSerie,
                    temporadaId,
                    episodioId
                }
            );

            return;
        }

        console.log(
            "[SERIES PLAYER] Abrindo episódio:",
            {
                serie: idSerie,
                temporada: temporadaId,
                episodio: episodioId,
                nome: nome || ""
            }
        );

        const playerSerie =
            document.getElementById("playerSerie");

        const serieFrame =
            document.getElementById("serieFrame");

        if (!playerSerie || !serieFrame) {

            console.error(
                "[SERIES PLAYER] Área do player não encontrada."
            );

            return;
        }

        /*
         * GUARDA OS DADOS DO EPISÓDIO
         */

        playerSerie.dataset.serieId =
            idSerie;

        playerSerie.dataset.temporada =
            temporadaId;

        playerSerie.dataset.episodio =
            episodioId;

        /*
         * ABRE O PLAYER
         */

        playerSerie.style.display =
            "block";

        /*
         * PLAY 1 — MEGA
         * INICIA COMO PADRÃO
         */

        const play1Url =
            "https://mgeb.top/embed/" +
            idSerie +
            "/" +
            temporadaId +
            "/" +
            episodioId;

        serieFrame.src =
            play1Url;

        /*
         * MARCA PLAY 1
         */

        const botoesPlayers =
            playerSerie.querySelectorAll(
                ".serie-player-btn"
            );

        botoesPlayers.forEach(function(btn) {

            btn.classList.remove(
                "ativo"
            );

            btn.classList.remove(
                "player-selecionado"
            );

        });

        const play1 =
            playerSerie.querySelector(
                '.serie-player-btn[data-player="1"]'
            );

        if (play1) {

            play1.classList.add(
                "ativo"
            );

            play1.classList.add(
                "player-selecionado"
            );

        }

        /*
         * CONFIGURA PLAY 1 E PLAY 2
         */

        botoesPlayers.forEach(function(btn) {

            if (
                btn.dataset.playerConfigurado === "1"
            ) {
                return;
            }

            btn.dataset.playerConfigurado =
                "1";

            btn.addEventListener(
                "click",
                function() {

                    const numero =
                        String(
                            this.dataset.player || ""
                        );

                    let embedUrl = "";

                    /*
                     * PLAY 1 — MEGA
                     */

                    if (numero === "1") {

                        embedUrl =
                            "https://mgeb.top/embed/" +
                            idSerie +
                            "/" +
                            temporadaId +
                            "/" +
                            episodioId;
                    }

                    /*
                     * PLAY 2 — MAYA / MYEMBED
                     */

                    else if (numero === "2") {

                        embedUrl =
                            "https://myembed.biz/serie/" +
                            idSerie +
                            "/" +
                            temporadaId +
                            "/" +
                            episodioId;
                    }

                    if (!embedUrl) {
                        return;
                    }

                    /*
                     * DESELECIONA OS OUTROS
                     */

                    botoesPlayers.forEach(
                        function(item) {

                            item.classList.remove(
                                "ativo"
                            );

                            item.classList.remove(
                                "player-selecionado"
                            );

                        }
                    );

                    /*
                     * MARCA O ESCOLHIDO
                     */

                    this.classList.add(
                        "ativo"
                    );

                    this.classList.add(
                        "player-selecionado"
                    );

                    /*
                     * TROCA O IFRAME
                     */

                    serieFrame.src =
                        embedUrl;

                    console.log(
                        "[SERIES PLAYER]",
                        "PLAY " + numero,
                        embedUrl
                    );

                    /*
                     * CONTINUAR ASSISTINDO
                     */

                    if (window.LukaContinuar) {

                        LukaContinuar.registrarInicio({

                            id: idSerie,

                            titulo:
                                serie.name ||
                                serie.titulo ||
                                nome ||
                                "Série",

                            capa:
                                serie.poster_path
                                    ? "https://image.tmdb.org/t/p/w500" +
                                      serie.poster_path
                                    : "",

                            tipo: "serie",

                            player: numero,

                            temporada:
                                temporadaId,

                            episodio:
                                episodioId

                        });

                    }

                }
            );

        });

        /*
         * REGISTRA PLAY 1
         */

        if (window.LukaContinuar) {

            LukaContinuar.registrarInicio({

                id: idSerie,

                titulo:
                    serie.name ||
                    serie.titulo ||
                    nome ||
                    "Série",

                capa:
                    serie.poster_path
                        ? "https://image.tmdb.org/t/p/w500" +
                          serie.poster_path
                        : "",

                tipo: "serie",

                player: "1",

                temporada:
                    temporadaId,

                episodio:
                    episodioId

            });

        }

        /*
         * DESCE ATÉ O PLAYER
         */

        playerSerie.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        console.log(
            "[SERIES PLAYER] PLAY 1 carregado:",
            play1Url
        );

    }


    /* ==========================================
       VOLTAR PARA A LISTAGEM PRESERVANDO POSIÇÃO
       ========================================== */

    const botaoVoltarSerie =
        document.getElementById("voltarSerie");

    if (botaoVoltarSerie) {

        botaoVoltarSerie.addEventListener(
            "click",
            function (e) {

                e.preventDefault();

                window.location.href = "series.html";

            }
        );

    }

    /* ==========================================
       INICIAR
       ========================================== */

    carregarDetalhes();


})();


/* ==========================================
   DOM CARREGADO
   ========================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        console.log(
            "[LUKAFILMES] Página de série carregada."
        );

    }
);

</script>

<script id="serie-favoritos-topo-script">
(function(){

    "use strict";

    console.log("[FAVORITOS SÉRIE] Sistema iniciado.");

    function obterSerie(){

        try{

            const salvo =
                localStorage.getItem("serieSelecionada");

            if(!salvo){
                console.warn(
                    "[FAVORITOS SÉRIE] serieSelecionada não encontrada."
                );
                return null;
            }

            const serie = JSON.parse(salvo);

            if(!serie || typeof serie !== "object"){
                return null;
            }

            return serie;

        }catch(e){

            console.error(
                "[FAVORITOS SÉRIE] Erro ao obter série:",
                e
            );

            return null;
        }
    }


    function obterLista(){

        try{

            const salvo =
                localStorage.getItem("lukafilmes_minhalista");

            if(!salvo){
                return [];
            }

            const lista = JSON.parse(salvo);

            return Array.isArray(lista)
                ? lista
                : [];

        }catch(e){

            console.error(
                "[FAVORITOS SÉRIE] Erro ao ler lista:",
                e
            );

            return [];
        }
    }


    function salvarLista(lista){

        localStorage.setItem(
            "lukafilmes_minhalista",
            JSON.stringify(lista)
        );

        console.log(
            "[FAVORITOS SÉRIE] Lista salva:",
            lista
        );
    }


    function idDaSerie(serie){

        return String(
            serie &&
            (
                serie.id ||
                serie.tmdb_id ||
                serie.tv_id ||
                serie.titulo ||
                serie.name ||
                serie.nome
            )
            || ""
        ).trim();
    }


    function normalizarSerie(serie){

        if(!serie){
            return null;
        }

        const id =
            idDaSerie(serie);

        const titulo =
            serie.titulo ||
            serie.title ||
            serie.name ||
            serie.nome ||
            document.getElementById("tituloSerie")?.textContent?.trim() ||
            "Série";

        const capa =
            serie.capa ||
            serie.poster ||
            serie.poster_path ||
            document.getElementById("posterSerie")?.src ||
            "";

        return {
            ...serie,

            id: id,

            titulo: titulo,

            capa: capa,

            tipo: "serie",

            media_type: "tv",

            nome: serie.nome || serie.name || titulo
        };
    }


    function atualizarBotao(){

        const botao =
            document.getElementById(
                "serieAdicionarFavorito"
            );

        if(!botao){
            console.warn(
                "[FAVORITOS SÉRIE] Botão não encontrado."
            );
            return;
        }

        const serie =
            normalizarSerie(
                obterSerie()
            );

        if(!serie){

            botao.style.display =
                "none";

            return;
        }

        const id =
            idDaSerie(serie);

        if(!id){

            botao.style.display =
                "none";

            return;
        }

        botao.style.display =
            "inline-flex";

        const lista =
            obterLista();

        const existe =
            lista.some(function(item){

                return String(
                    item &&
                    (
                        item.id ||
                        item.tmdb_id ||
                        item.tv_id ||
                        item.titulo ||
                        item.name ||
                        item.nome
                    )
                ).trim() === id;

            });

        if(existe){

            botao.textContent =
                "♥ Remover dos favoritos";

            botao.classList.add(
                "favorito-ativo"
            );

        }else{

            botao.textContent =
                "＋ Adicionar aos favoritos";

            botao.classList.remove(
                "favorito-ativo"
            );
        }
    }


    function alternarFavorito(){

        const serie =
            normalizarSerie(
                obterSerie()
            );

        if(!serie){

            console.error(
                "[FAVORITOS SÉRIE] Série não encontrada."
            );

            return;
        }

        const id =
            idDaSerie(serie);

        if(!id){

            console.error(
                "[FAVORITOS SÉRIE] ID da série não encontrado."
            );

            return;
        }

        let lista =
            obterLista();

        const indice =
            lista.findIndex(function(item){

                return String(
                    item &&
                    (
                        item.id ||
                        item.tmdb_id ||
                        item.tv_id ||
                        item.titulo ||
                        item.name ||
                        item.nome
                    )
                ).trim() === id;

            });


        if(indice >= 0){

            lista.splice(
                indice,
                1
            );

            console.log(
                "[FAVORITOS SÉRIE] Série removida:",
                serie
            );

        }else{

            lista.unshift(
                serie
            );

            console.log(
                "[FAVORITOS SÉRIE] Série adicionada:",
                serie
            );
        }


        salvarLista(lista);

        atualizarBotao();
    }


    function instalar(){

        const botao =
            document.getElementById(
                "serieAdicionarFavorito"
            );

        if(!botao){
            return;
        }

        if(
            botao.dataset.favoritoSerieLigado === "1"
        ){
            atualizarBotao();
            return;
        }

        botao.dataset.favoritoSerieLigado =
            "1";

        botao.addEventListener(
            "click",
            function(evento){

                evento.preventDefault();
                evento.stopPropagation();

                alternarFavorito();

            },
            true
        );

        atualizarBotao();

        console.log(
            "[FAVORITOS SÉRIE] Botão conectado."
        );
    }


    if(
        document.readyState ===
        "loading"
    ){

        document.addEventListener(
            "DOMContentLoaded",
            instalar
        );

    }else{

        instalar();
    }


    setTimeout(
        instalar,
        500
    );

    setTimeout(
        instalar,
        1500
    );

    setTimeout(
        instalar,
        3000
    );


})();
</script>

(function () {

    "use strict";

    function ativarPlayersSerie() {

        const playerSerie =
            document.getElementById("playerSerie");

        const serieFrame =
            document.getElementById("serieFrame");

        const botoes =
            document.querySelectorAll(
                ".players-serie-opcoes .serie-player-btn"
            );

        if (!playerSerie || !serieFrame || !botoes.length) {
            return;
        }

        if (playerSerie.dataset.playersConfigurados === "1") {
            return;
        }

        playerSerie.dataset.playersConfigurados = "1";

        botoes.forEach(function (btn) {

            btn.addEventListener("click", function () {

                const numero =
                    String(this.dataset.player || "");

                const idSerie =
                    String(
                        playerSerie.dataset.serieId ||
                        localStorage.getItem("seriePlayerId") ||
                        ""
                    ).trim();

                const temporada =
                    String(
                        playerSerie.dataset.temporada ||
                        localStorage.getItem("seriePlayerTemporada") ||
                        ""
                    ).trim();

                const episodio =
                    String(
                        playerSerie.dataset.episodio ||
                        localStorage.getItem("seriePlayerEpisodio") ||
                        ""
                    ).trim();

                let embedUrl = "";

                if (numero === "1") {

                    if (!idSerie || !temporada || !episodio) {
                        console.warn(
                            "[SÉRIE] Dados insuficientes para PLAY 1."
                        );
                        return;
                    }

                    embedUrl =
                        "https://mgeb.top/embed/" +
                        idSerie +
                        "/" +
                        temporada +
                        "/" +
                        episodio;
                }

                else if (numero === "2") {

                    if (!idSerie || !temporada || !episodio) {
                        console.warn(
                            "[SÉRIE] Dados insuficientes para PLAY 2."
                        );
                        return;
                    }

                    embedUrl =
                        "https://myembed.biz/serie/" +
                        idSerie +
                        "/" +
                        temporada +
                        "/" +
                        episodio;
                }

                if (!embedUrl) {
                    return;
                }

                botoes.forEach(function (item) {
                    item.classList.remove("ativo");
                    item.classList.remove("player-selecionado");
                });

                this.classList.add("ativo");
                this.classList.add("player-selecionado");

                serieFrame.src = embedUrl;

                console.log(
                    "[SÉRIE PLAYER]",
                    "PLAY " + numero,
                    embedUrl
                );

                playerSerie.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                });

            });

        });

    }

    document.addEventListener(
        "DOMContentLoaded",
        ativarPlayersSerie
    );

    setTimeout(
        ativarPlayersSerie,
        500
    );

    setTimeout(
        ativarPlayersSerie,
        1500
    );

})();

</script>



<!-- LUKAFILMES-CONTINUAR-SERIE-RESUME -->
<script>
(function () {

    "use strict";

    /*
     * LUKAFILMES
     * CONTINUAR ASSISTINDO — SÉRIES
     *
     * A fonte oficial da retomada é:
     * lukafilmes_continuar
     *
     * Não usa mais serieSelecionada para descobrir
     * qual episódio deve ser retomado.
     */

    function obterSerieContinuar() {

        try {

            const salvo =
                localStorage.getItem("lukafilmes_continuar");

            if (!salvo) {
                console.log(
                    "[CONTINUAR SÉRIE] Nenhum histórico encontrado."
                );
                return null;
            }

            const lista = JSON.parse(salvo);

            if (!Array.isArray(lista)) {
                return null;
            }

            const serie =
                lista.find(function (item) {

                    return (
                        item &&
                        String(item.tipo || "").toLowerCase() === "serie" &&
                        item.id != null &&
                        item.temporada != null &&
                        item.episodio != null
                    );

                });

            if (!serie) {

                console.log(
                    "[CONTINUAR SÉRIE] Nenhuma série com episódio salvo.",
                    lista
                );

                return null;
            }

            return serie;

        } catch (erro) {

            console.error(
                "[CONTINUAR SÉRIE] Erro ao ler histórico:",
                erro
            );

            return null;
        }
    }


    function restaurarContinuarSerie() {

        if (window.__lukafilmesContinuarSerieExecutado) {
            return true;
        }

        const item =
            obterSerieContinuar();

        if (!item) {
            return false;
        }

        if (
            typeof window.assistirEpisodio !== "function"
        ) {
            return false;
        }

        const temporada =
            String(item.temporada).trim();

        const episodio =
            String(item.episodio).trim();

        if (!temporada || !episodio) {
            return false;
        }

        window.__lukafilmesContinuarSerieExecutado = true;

        console.log(
            "[CONTINUAR SÉRIE] RETOMANDO:",
            {
                id: item.id,
                titulo: item.titulo,
                temporada: temporada,
                episodio: episodio,
                player: item.player || "1"
            }
        );

        /*
         * Mantém serieSelecionada sincronizada com o item
         * que realmente veio do Continuar Assistindo.
         */
        try {

            localStorage.setItem(
                "serieSelecionada",
                JSON.stringify(item)
            );

            localStorage.setItem(
                "seriePlayerId",
                String(item.id)
            );

            localStorage.setItem(
                "seriePlayerTemporada",
                temporada
            );

            localStorage.setItem(
                "seriePlayerEpisodio",
                episodio
            );

            if (item.player != null) {

                localStorage.setItem(
                    "seriePlayer",
                    String(item.player)
                );

            }

        } catch (erro) {

            console.warn(
                "[CONTINUAR SÉRIE] Não foi possível sincronizar dados:",
                erro
            );
        }

        /*
         * Abre exatamente a temporada e o episódio salvos.
         */
        window.assistirEpisodio(
            temporada,
            episodio,
            item.titulo || "Série"
        );

        /*
         * assistirEpisodio() inicia no PLAY 1.
         *
         * Se o usuário estava no PLAY 2,
         * restauramos o mesmo player.
         */
        const playerSalvo =
            String(item.player || "1");

        if (playerSalvo !== "1") {

            let tentativasPlayer = 0;

            const intervaloPlayer =
                setInterval(function () {

                    tentativasPlayer++;

                    const botao =
                        document.querySelector(
                            '.players-serie-opcoes .serie-player-btn[data-player="' +
                            playerSalvo +
                            '"]'
                        );

                    if (botao) {

                        botao.click();

                        clearInterval(
                            intervaloPlayer
                        );

                        console.log(
                            "[CONTINUAR SÉRIE] Player restaurado:",
                            playerSalvo
                        );

                        return;
                    }

                    if (tentativasPlayer >= 20) {

                        clearInterval(
                            intervaloPlayer
                        );

                        console.warn(
                            "[CONTINUAR SÉRIE] Player não encontrado:",
                            playerSalvo
                        );

                    }

                }, 250);
        }

        return true;
    }


    /*
     * Espera assistirEpisodio existir.
     */
    let tentativas = 0;

    const intervalo =
        setInterval(function () {

            tentativas++;

            if (
                restaurarContinuarSerie() ||
                tentativas >= 40
            ) {

                clearInterval(intervalo);

            }

        }, 250);

})();
</script>
